<div *ngIf="loader$ | async" class="loader-overlay">
  <div class="loader"></div>
</div>

<!-- Banner de nueva versión disponible (global, todas las rutas) -->
<div *ngIf="nuevaVersionDisponible"
     class="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] bg-[#64BC04] text-white rounded-lg shadow-lg px-4 py-3 flex items-center gap-3 max-w-[90vw]">
  <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
  </svg>
  <span class="text-sm font-medium">Hay una nueva versión disponible.</span>
  <button (click)="actualizar()"
          class="ml-2 bg-white text-[#64BC04] text-sm font-semibold rounded-md px-3 py-1 hover:bg-gray-100 transition-colors cursor-pointer">
    Actualizar
  </button>
</div>

<router-outlet />
