<div class="bloqueo-overlay" *ngIf="debeEvaluar && !enRutaEvaluacion">
  <div class="bloqueo-card">
    <i class="ti ti-shield-lock bloqueo-icono"></i>
    <h3>Evaluación anónima pendiente</h3>
    <p>
      Tienes pendiente evaluar de forma anónima al Jefe SSOMA de
      {{ bannerSvc.periodo?.nombreMes }} {{ bannerSvc.periodo?.anio }}. Es obligatoria:
      debes completarla antes de continuar usando el sistema.
    </p>
    <button class="bloqueo-btn" (click)="irAEvaluar()">
      <i class="ti ti-pencil"></i> Evaluar ahora
    </button>
  </div>
</div>
