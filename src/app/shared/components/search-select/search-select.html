<div class="flex flex-col gap-[6px]" [style.--ss-accent]="color">

  <!-- Label opcional -->
  <label *ngIf="showLabel && label" class="text-sm text-[var(--ss-accent)] font-medium">
    {{ label }}
  </label>

  <!-- Contenedor relativo para el dropdown -->
  <div class="relative overflow-visible">

    <!-- Trigger -->
    <button
      type="button"
      (click)="toggle($event)"
      [disabled]="disabled"
      class="w-full flex items-center justify-between focus:outline-none transition-colors"
      [class.cursor-pointer]="!disabled"
      [class.cursor-not-allowed]="disabled"
      [class.opacity-60]="disabled"
      [ngClass]="dark ? [
        'rounded-[7px] pl-[10px] pr-[8px] h-[30px] text-[11px] font-medium',
        'border border-[rgba(255,255,255,0.2)]',
        isOpen ? 'bg-[#2a4a71]' : 'bg-[rgba(255,255,255,0.1)] hover:bg-[rgba(255,255,255,0.15)]'
      ] : [
        compact
          ? 'rounded-[6px] bg-[#f8fafc] pl-[8px] pr-[6px] h-[32px] text-[0.78rem] border focus:ring-1 focus:ring-[var(--ss-accent)]/20'
          : 'rounded-lg bg-white pl-[12px] pr-[10px] py-[10px] text-sm border focus:ring-2 focus:ring-[var(--ss-accent)]/30',
        isOpen
          ? 'border-[var(--ss-accent)] ring-2 ring-[var(--ss-accent)]/30'
          : compact ? 'border-[#e2e8f0]' : 'border-[#D6DEE5]'
      ]"
    >
      <span
        class="ss-trigger-label"
        [class.ss-full]="fullText"
        [ngClass]="dark ? 'text-white' : (hasValue ? 'text-gray-800' : 'text-gray-400')"
      >
        {{ selectedLabel }}
      </span>
      <span class="flex items-center gap-[8px]">
        <span
          *ngIf="allowClear && hasValue && !disabled"
          (click)="clear($event)"
          (keydown.enter)="clear($any($event))"
          tabindex="0"
          role="button"
          aria-label="Limpiar selección"
          title="Limpiar"
          class="flex items-center justify-center w-[18px] h-[18px] rounded-full text-gray-400 hover:text-gray-700 hover:bg-gray-100 cursor-pointer transition-colors"
        >
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </span>
        <svg
          class="flex-shrink-0 text-gray-400 transition-transform duration-200"
          [ngClass]="isOpen ? 'rotate-180' : ''"
          width="16" height="16" viewBox="0 0 16 9" fill="none"
        >
          <path
            d="M14.692 0L16 1.339L8.873 8.629a1.997 1.997 0 0 1-2.746 0L0 1.339 1.308.001 8 6.844 14.692 0Z"
            fill="currentColor"
          />
        </svg>
      </span>
    </button>

    <!-- Dropdown -->
    <div
      *ngIf="isOpen"
      class="absolute top-[calc(100%+4px)] left-0 right-0 bg-white border border-[#D6DEE5] rounded-lg shadow-lg z-50 overflow-hidden"
    >
      <!-- Buscador -->
      <div *ngIf="options.length > 5" class="p-[8px] border-b border-[#F0F0F0]">
        <div class="flex items-center gap-[8px] bg-[#F8F8F8] border border-[#E2E2E2] rounded-lg px-[10px] py-[6px]">
          <svg class="flex-shrink-0 text-gray-400" width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M19.6 21L13.3 14.7a7 7 0 1 1 1.4-1.4L21 19.6 19.6 21ZM9.5 15A5.5 5.5 0 1 0 9.5 4a5.5 5.5 0 0 0 0 11Z" fill="currentColor"/>
          </svg>
          <input
            #searchInput
            type="text"
            [(ngModel)]="searchText"
            placeholder="Buscar..."
            class="w-full bg-transparent text-sm focus:outline-none text-gray-700 placeholder-gray-400"
            (click)="$event.stopPropagation()"
          />
        </div>
      </div>

      <!-- Lista de opciones -->
      <div class="overflow-y-auto max-h-[200px] overscroll-contain">

        <!-- Sin resultados -->
        <div
          *ngIf="filteredOptions.length === 0"
          class="px-[12px] py-[10px] text-sm text-gray-400 text-center"
        >
          Sin resultados
        </div>

        <!-- Opciones -->
        <div
          *ngFor="let option of filteredOptions; trackBy: trackByOption"
          (click)="select(option)"
          class="ss-option px-[12px] py-[9px] text-sm cursor-pointer transition-colors"
          [class.ss-full]="fullText"
          [ngClass]="option[valueField] === value
            ? 'ss-option-selected font-medium'
            : 'text-gray-700 hover:bg-[#F0F0F0]'"
        >
          {{ option[displayField] }}
        </div>

      </div>
    </div>

  </div>

</div>
