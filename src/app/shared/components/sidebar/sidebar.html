<div class="sidebar-inner">

  <!-- Toggle collapse button -->
  <button class="toggle-btn" (click)="toggleCollapsed()" [title]="collapsed ? 'Expandir sidebar' : 'Contraer sidebar'">
    <i class="ti ti-layout-sidebar"></i>
  </button>

  <!-- Logo -->
  <div class="logo-section">
    <div class="logo-icon">
      <i class="ti ti-leaf"></i>
    </div>
    <div class="logo-text" *ngIf="!collapsed">
      <span class="logo-name">Abril</span>
      <span class="logo-sub">GRUPO INMOBILIARIO</span>
    </div>
  </div>

  <!-- User profile -->
  <div class="profile-section" (click)="toggleAccountMenu($event)" [class.menu-open]="accountMenuOpen">
    <div class="avatar">{{ userInitials }}</div>
    <ng-container *ngIf="!collapsed">
      <div class="profile-info">
        <span class="profile-name">{{ userName || 'Usuario' }}</span>
        <span class="profile-role">{{ userRole || '' }}</span>
      </div>
      <i class="ti ti-chevron-down chev" [class.rotated]="accountMenuOpen"></i>
    </ng-container>

    <!-- Account dropdown -->
    <div class="account-menu" *ngIf="accountMenuOpen && !collapsed" (click)="$event.stopPropagation()">
      <div class="account-info" *ngIf="userEmail">
        <span class="account-email">{{ userEmail }}</span>
      </div>
      <button class="account-logout" (click)="logout()">
        <i class="ti ti-logout"></i>
        Cerrar sesión
      </button>
    </div>
  </div>

  <!-- Separator -->
  <div class="separator"></div>

  <!-- Main module list -->
  <nav class="modules-nav">
    <div
      *ngFor="let module of mainModules; trackBy: trackByModuleKey"
      class="module-item"
      [class.active]="isActiveModule(module.baseRoute)"
      (click)="onModuleClick(module)"
      [title]="collapsed ? module.label : ''"
    >
      <div class="active-bar" *ngIf="isActiveModule(module.baseRoute)"></div>
      <app-nav-icon [key]="module.iconKey" [size]="20" />
      <span class="module-label" *ngIf="!collapsed">{{ module.label }}</span>
    </div>
  </nav>

  <!-- Separator -->
  <div class="separator"></div>

  <!-- Bottom: configuración + logout -->
  <div class="bottom-nav">
    <div
      *ngIf="configModule"
      class="module-item"
      [class.active]="isActiveModule(configModule.baseRoute)"
      (click)="onModuleClick(configModule)"
      [title]="collapsed ? configModule.label : ''"
    >
      <div class="active-bar" *ngIf="isActiveModule(configModule.baseRoute)"></div>
      <app-nav-icon [key]="configModule.iconKey" [size]="20" />
      <span class="module-label" *ngIf="!collapsed">{{ configModule.label }}</span>
    </div>

    <button
      class="module-item logout-item"
      (click)="logout()"
      [title]="collapsed ? 'Cerrar sesión' : ''"
    >
      <app-nav-icon key="logout" [size]="20" />
      <span class="module-label" *ngIf="!collapsed">Cerrar sesión</span>
    </button>
  </div>

</div>
