<div class="max-w-xs min-h-screen py-[20px] px-[5px]">
  <div class="flex flex-col items-center w-[100px] gap-[5px]">

    <ng-container *ngFor="let module of navService.getModules()">
      <div
        class="relative flex flex-col items-center w-full cursor-pointer rounded-lg p-[5px]"
        [ngClass]="{
          'bg-[#E5F7D1]': isActiveModule(module.baseRoute),
          'hover:bg-[#E5F7D1]': !isActiveModule(module.baseRoute)
        }"
        (click)="toggleMenu(module.key)"
      >
        <!-- Icono -->
        <app-nav-icon [key]="module.iconKey" [size]="28" />

        <p class="font-sans text-sm text-center mt-1">{{ module.label }}</p>

        <!-- Dropdown -->
        <div
          *ngIf="activeMenu === module.key"
          class="absolute left-28 top-0 p-2 w-60 bg-white rounded-xl shadow-lg z-50"
          (click)="$event.stopPropagation()"
        >
          <!-- Items directos -->
          <a
            *ngFor="let item of navService.filterItems(module.items)"
            [routerLink]="item.route"
            class="block px-4 py-2 text-sm rounded-xl hover:bg-[#E5F7D1] font-sans"
          >
            {{ item.label }}
          </a>

          <!-- Grupos (ej. Configuración) -->
          <ng-container *ngFor="let group of navService.filterGroups(module.groups)">
            <div class="relative" (click)="toggleGroup(group.label)">
              <div class="flex justify-between items-center px-4 py-2 text-sm rounded-xl hover:bg-[#E5F7D1] font-sans cursor-pointer">
                <span>{{ group.label }}</span>
                <svg width="9" height="16" viewBox="0 0 9 16" fill="none">
                  <path d="M0 1.30763L1.33853 0L8.62916 7.1266C8.74668 7.24079 8.83995 7.37658 8.90359 7.52616C8.96724 7.67574 9 7.83614 9 7.99815C9 8.16016 8.96724 8.32056 8.90359 8.47014C8.83995 8.61971 8.74668 8.75551 8.62916 8.8697L1.33853 16L0.00126076 14.6924L6.84403 8L0 1.30763Z" fill="#64BC04"/>
                </svg>
              </div>

              <!-- Submenú del grupo -->
              <div
                *ngIf="activeGroup === group.label"
                class="absolute left-full top-0 ml-2 w-56 bg-white rounded-xl shadow-lg z-50 p-[5px]"
              >
                <a
                  *ngFor="let item of group.items"
                  [routerLink]="item.route"
                  (click)="closeAllMenus()"
                  class="block px-4 py-2 text-sm hover:bg-[#E5F7D1] rounded-xl"
                >
                  {{ item.label }}
                </a>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </ng-container>

  </div>
</div>
