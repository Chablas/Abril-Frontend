<div class="hidden sm:block sm:flex sm:h-[70px] sm:items-center sm:justify-center sm:bg-[#f2f5f2] sm:px-[20px]">
    <a class="hidden sm:block sm:h-full" routerLink="/">
        <img class="h-full" src="/images/abril-logo.png" alt="Logo" />
    </a>
    <div class="hidden sm:block sm:flex-8 sm:text-center sm:text-2xl sm:font-bold">{{titulo}}</div>
    <div class="hidden sm:block shrink-0">
        <img *ngIf="userPhotoSrc; else defaultIcon"
            [src]="userPhotoSrc"
            alt="Foto de perfil"
            class="w-[40px] h-[40px] rounded-full object-cover" />
        <ng-template #defaultIcon>
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g clip-path="url(#clip0_1309_9960)">
                    <path
                        d="M27.5 17.5C27.5 21.65 24.15 25 20 25C15.85 25 12.5 21.65 12.5 17.5C12.5 13.35 15.85 10 20 10C24.15 10 27.5 13.35 27.5 17.5Z"
                        fill="black" />
                    <path fill-rule="evenodd" clip-rule="evenodd"
                        d="M40 20C40 31.05 31.05 40 20 40C8.95 40 0 31.05 0 20C0 8.95 8.95 0 20 0C31.05 0 40 8.95 40 20ZM10 34.375C10.4 33.71 14.275 27.5 19.975 27.5C25.65 27.5 29.55 33.725 29.95 34.375C32.2747 32.7675 34.1741 30.6193 35.4849 28.1153C36.7957 25.6113 37.4786 22.8264 37.475 20C37.475 10.325 29.65 2.5 19.975 2.5C10.3 2.5 2.475 10.325 2.475 20C2.475 25.95 5.45 31.225 10 34.375Z"
                        fill="black" />
                </g>
                <defs>
                    <clipPath id="clip0_1309_9960">
                        <rect width="40" height="40" fill="white" />
                    </clipPath>
                </defs>
            </svg>
        </ng-template>
    </div>
</div>
<div class="sm:hidden">
    <div class="p-[20px] flex items-center gap-[20px] border border-gray-200">
        <button (click)="menuOpen = !menuOpen">
            <svg *ngIf="!menuOpen" width="24" height="24" viewBox="0 0 24 24" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M3 18V16H21V18H3ZM3 13V11H21V13H3ZM3 8V6H21V8H3Z" fill="#64BC04" />
            </svg>
            <svg *ngIf="menuOpen" width="24" height="24" viewBox="0 0 24 24" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M20 20L4 4M20 4L4 20" stroke="#64BC04" stroke-width="2" stroke-linecap="round" />
            </svg>
        </button>

        <div class="flex-8">
            <span [title]="titulo" class="text-center font-bold line-clamp-1 text-ellipsis">{{titulo}}</span>
        </div>
    </div>
    <app-sidebar-mobile [(menuOpen)]="menuOpen">
    </app-sidebar-mobile>
</div>
