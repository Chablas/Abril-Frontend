<div class="flex border border-[#D6DEE5] rounded-lg overflow-hidden">

  <button
    *ngFor="let mode of modes; let i = index"
    type="button"
    (click)="select(mode.value)"
    [ngClass]="[
      value === mode.value
        ? 'bg-[#E5F7D1] text-[#64BC04]'
        : 'bg-white text-gray-400 hover:text-gray-600 hover:bg-gray-50',
      i > 0 ? 'border-l border-[#D6DEE5]' : ''
    ]"
    class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium transition-colors cursor-pointer">
    <span [innerHTML]="safeIcon(mode.icon)"></span>
    <span class="hidden sm:inline">{{ mode.label }}</span>
  </button>

</div>
