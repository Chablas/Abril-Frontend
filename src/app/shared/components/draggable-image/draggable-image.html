<!-- modo normal: solo la imagen, click abre el expandido -->
<img [src]="imageUrl" (click)="toggleExpand()" class="cursor-pointer select-none max-h-full max-w-full object-contain"
    draggable="false" alt="Imagen" />

<!-- modo expandido -->
<div *ngIf="expanded" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center" (mouseup)="onMouseUp()"
    (mouseleave)="onMouseUp()">

    <button (click)="toggleExpand()"
        class="absolute top-4 right-4 z-10 text-white cursor-pointer bg-black/40 rounded-full w-9 h-9 flex items-center justify-center hover:bg-black/60">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12" />
        </svg>
    </button>

    <div class="w-screen h-screen flex items-center justify-center overflow-hidden" (mousemove)="onMouseMove($event)"
        (click)="toggleExpand()">
        <img [src]="imageUrl" (wheel)="onWheelZoom($event)" (mousedown)="onMouseDown($event)"
            (click)="$event.stopPropagation()" [style.transform]="transform"
            class="transition-transform duration-75 cursor-grab active:cursor-grabbing select-none max-h-full max-w-full object-contain"
            draggable="false" alt="Imagen" />
    </div>

</div>
