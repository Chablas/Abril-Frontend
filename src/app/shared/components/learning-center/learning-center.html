<div class="guides-panel" [class.large]="large">
  <div class="guides-heading" *ngIf="showHeading" [style.color]="accentColor">
    <svg width="14" height="14" viewBox="0 0 24 24" [attr.fill]="accentColor"><path d="M8 5v14l11-7z"/></svg>
    <span>{{ titulo }}</span>
  </div>

  <div class="guides-scroll">
    <div class="guides-group" *ngFor="let cat of categorias">
      <div
        class="group-name"
        [class.group-toggle]="collapsible"
        (click)="collapsible ? toggle(cat) : null"
      >
        <span>{{ cat.nombre }}</span>
        <svg
          *ngIf="collapsible"
          class="chevron"
          [class.collapsed]="isCollapsed(cat)"
          width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
        ><path d="M6 9l6 6 6-6" /></svg>
      </div>

      <div class="guides-grid" *ngIf="!collapsible || !isCollapsed(cat)">
        <a *ngFor="let v of cat.videos" [href]="v.url" target="_blank" rel="noopener noreferrer" class="guide-card">
          <div class="guide-thumb" [style.background]="v.img ? null : accentColor + '14'">
            <img *ngIf="v.img" [src]="v.img" [alt]="v.titulo" loading="lazy" />
            <span class="guide-play" [style.background]="accentColor">
              <svg *ngIf="!esManual(v)" width="12" height="12" fill="#ffffff" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              <svg *ngIf="esManual(v)" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="2.2"
                   stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M14 3v4a1 1 0 0 0 1 1h4" />
                <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z" />
                <path d="M9 13h6M9 17h4" />
              </svg>
            </span>
          </div>
          <div class="guide-info">
            <span class="guide-title">{{ v.titulo }}</span>
            <span class="guide-link" [style.color]="accentColor">Ver guía →</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
