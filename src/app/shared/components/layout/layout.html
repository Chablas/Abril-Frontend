<div class="flex h-screen" style="background: var(--color-abril-surface);">
  <app-sidebar class="hidden sm:block shrink-0"></app-sidebar>
  <app-sidebar-mobile [(menuOpen)]="mobileMenuOpen"></app-sidebar-mobile>
  <div class="flex-1 min-w-0 flex flex-col"
       style="background: var(--color-abril-page-bg); border-radius: 0; overflow: hidden;"
       [class.rounded-none]="isFullPage()">
    <main class="flex-1 flex flex-col min-h-0 overflow-auto"
          [class.p-0]="isFullPage()"
          [style.padding]="isFullPage() ? '0' : null">
      <ng-container *ngIf="isFullPage(); else normalLayout">
        <router-outlet></router-outlet>
      </ng-container>
      <ng-template #normalLayout>
        <app-header></app-header>
        <div class="page-content flex flex-col flex-1 min-h-0 overflow-y-auto">
          <router-outlet></router-outlet>
        </div>
      </ng-template>
    </main>
  </div>
</div>
