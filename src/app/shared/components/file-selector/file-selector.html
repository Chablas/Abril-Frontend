<div class="fs-drop relative flex flex-col items-center justify-center w-full h-40 border-2 border-dashed rounded-lg cursor-pointer transition-all duration-200 hover:scale-[1.01]"
    [style.borderColor]="color"
    [style.--fs-bg]="bg"
    [style.--fs-bg-hover]="bgHover"
    (click)="opFile.click()" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)" (drop)="onDrop($event)">

    <input #opFile type="file" multiple [accept]="accept" class="hidden" (change)="onFilesSelected($event)" />

    <svg class="w-8 h-8 mb-2" [style.color]="color" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
            d="M7 16a4 4 0 01-.88-7.9A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3-3 3m3-3v12" />
    </svg>

    <p class="text-sm text-gray-600">
        {{ label }}
        <span class="font-semibold" [style.color]="color">haz clic</span>
    </p>

    <p class="text-xs text-gray-400 mt-1">
        {{ hint }}
    </p>

</div>
