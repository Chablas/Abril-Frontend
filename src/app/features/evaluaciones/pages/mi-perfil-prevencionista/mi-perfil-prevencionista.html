<app-abril-page-header
  badge="EVALUACIONES"
  titulo="Mi Perfil — Evaluación de Contratistas"
  subtitulo="Tu promedio y comentarios recibidos de los contratistas. No se muestra quién te evaluó."
  [tabGroups]="[
    { label: 'Residentes',   icono: 'ti-user-check', tabs: [
      { label: 'Dashboard',     icono: 'ti-layout-dashboard', route: '/evaluaciones/dashboard',      featureKey: 'evaluaciones.dashboard' },
      { label: 'Evaluar',       icono: 'ti-pencil',           route: '/evaluaciones/evaluar',        featureKey: 'evaluaciones.evaluar' },
      { label: 'Historial',     icono: 'ti-history',          route: '/evaluaciones/historial',      featureKey: 'evaluaciones.historial' },
      { label: 'Configuración', icono: 'ti-settings',         route: '/evaluaciones/configuracion',  featureKey: 'evaluaciones.configuracion' }
    ]},
    { label: 'Contratistas', icono: 'ti-building', tabs: [
      { label: 'Dashboard',        icono: 'ti-chart-bar', route: '/evaluaciones/dashboard-contratistas', featureKey: 'evaluaciones.dashboard-contratistas' },
      { label: 'Evaluar',          icono: 'ti-pencil',    route: '/evaluaciones/evaluar-contratista',    featureKey: 'evaluaciones.evaluar-contratista' },
      { label: 'Ver evaluaciones', icono: 'ti-list',      route: '/evaluaciones/ver-contratistas',       featureKey: 'evaluaciones.ver-contratistas' }
    ]},
    { label: 'SSOMA', icono: 'ti-shield-check', tabs: [
      { label: 'Evaluar supervisor', icono: 'ti-pencil', route: '/evaluaciones/evaluar-supervisor-contratista', featureKey: 'evaluaciones.evaluar-supervisor-contratista' },
      { label: 'Ver evaluaciones',   icono: 'ti-list',   route: '/evaluaciones/ver-supervisores-contratista',   featureKey: 'evaluaciones.ver-supervisores-contratista' },
      { label: 'Evaluar Jefe SSOMA', icono: 'ti-user-shield', route: '/evaluaciones/evaluar-jefe-ssoma', featureKey: 'evaluaciones.evaluar-jefe-ssoma' },
      { label: 'Resultados Jefe SSOMA', icono: 'ti-report', route: '/evaluaciones/resultados-jefe-ssoma', featureKey: 'evaluaciones.resultados-jefe-ssoma' },
      { label: 'Mi perfil (Prev./Coord.)', icono: 'ti-user', route: '/evaluaciones/mi-perfil-prevencionista', featureKey: 'evaluaciones.mi-perfil-prevencionista' },
      { label: 'Dashboard Prev./Coord.', icono: 'ti-chart-bar', route: '/evaluaciones/dashboard-prevencionistas', featureKey: 'evaluaciones.dashboard-prevencionistas' }
    ]}
  ]">
</app-abril-page-header>

<div class="mp-root">

  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div><span>Cargando tu perfil...</span>
  </div>

  <div class="mp-content" *ngIf="!loading && perfil">

    <div class="stat-card">
      <div class="stat-label">Promedio general</div>
      <div class="stat-num" [ngClass]="notaClase(perfil.promedioGeneral)">
        {{ notaDisplay(perfil.promedioGeneral) }}
      </div>
      <div class="stat-sub">{{ perfil.totalEvaluaciones }} evaluación(es) recibida(s)</div>
    </div>

    <div class="section-card" *ngIf="perfil.comentarios.length">
      <div class="section-title">Comentarios recibidos</div>
      <div class="comentario-item" *ngFor="let c of perfil.comentarios">
        <i class="ti ti-quote"></i> {{ c }}
      </div>
    </div>

    <div class="empty-state" *ngIf="!perfil.comentarios.length">
      <i class="ti ti-message-off"></i>
      <p>Aún no tienes comentarios registrados.</p>
    </div>
  </div>
</div>
