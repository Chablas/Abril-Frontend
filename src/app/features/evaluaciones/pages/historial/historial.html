<app-abril-page-header
  badge="EVALUACIONES"
  titulo="Historial"
  subtitulo="Historial de evaluaciones por período y residente."
    [tabGroups]="[
    { label: 'Residentes',   icono: 'ti-user-check', tabs: [
      { label: 'Dashboard',     icono: 'ti-layout-dashboard', route: '/evaluaciones/dashboard',      featureKey: 'evaluaciones.dashboard' },
      { label: 'Evaluar',       icono: 'ti-pencil',           route: '/evaluaciones/evaluar',        featureKey: 'evaluaciones.evaluar' },
      { label: 'Historial',     icono: 'ti-history',          route: '/evaluaciones/historial',      featureKey: 'evaluaciones.historial' },
      { label: 'Configuración', icono: 'ti-settings',         route: '/evaluaciones/configuracion',  featureKey: 'evaluaciones.configuracion' }
    ]},
    { label: 'Contratistas', icono: 'ti-building', tabs: [
      { label: 'Dashboard',        icono: 'ti-chart-bar', route: '/evaluaciones/dashboard-contratistas', featureKey: 'evaluaciones.dashboard-contratistas' },
      { label: 'Evaluar',          icono: 'ti-pencil',    route: '/evaluaciones/evaluar-contratista',    featureKey: 'evaluaciones.evaluar-contratista' },
      { label: 'Ver evaluaciones', icono: 'ti-list',      route: '/evaluaciones/ver-contratistas',       featureKey: 'evaluaciones.ver-contratistas' }
    ]},
    { label: 'Superv. Contratista', icono: 'ti-shield-check', tabs: [
      { label: 'Evaluar supervisor', icono: 'ti-pencil', route: '/evaluaciones/evaluar-supervisor-contratista', featureKey: 'evaluaciones.evaluar-supervisor-contratista' },
      { label: 'Ver evaluaciones',   icono: 'ti-list',   route: '/evaluaciones/ver-supervisores-contratista',   featureKey: 'evaluaciones.ver-supervisores-contratista' }
    ]},
    { label: 'Jefe SSOMA', icono: 'ti-user-shield', tabs: [
      { label: 'Evaluar Jefe SSOMA', icono: 'ti-pencil', route: '/evaluaciones/evaluar-jefe-ssoma', featureKey: 'evaluaciones.evaluar-jefe-ssoma' },
      { label: 'Resultados', icono: 'ti-report', route: '/evaluaciones/resultados-jefe-ssoma', featureKey: 'evaluaciones.resultados-jefe-ssoma' }
    ]},
    { label: 'Prevencionistas', icono: 'ti-vest', tabs: [
      { label: 'Mi perfil', icono: 'ti-user', route: '/evaluaciones/mi-perfil-prevencionista', featureKey: 'evaluaciones.mi-perfil-prevencionista' },
      { label: 'Dashboard', icono: 'ti-chart-bar', route: '/evaluaciones/dashboard-prevencionistas', featureKey: 'evaluaciones.dashboard-prevencionistas' }
    ]}
  ]">
</app-abril-page-header>

<div class="hist-root">

  <div class="hist-body">
    <div class="periodo-list">
      <div class="pl-label">Períodos</div>
      <div class="pl-item"
        *ngFor="let p of periodos"
        [class.active]="periodoSeleccionado?.id === p.id"
        (click)="selectPeriodo(p)">
        {{ p.nombreMes }} {{ p.anio }}
        <span *ngIf="p.activo" class="pl-dot"></span>
      </div>
    </div>

    <div class="eval-list">
      <div class="eval-filters">
        <select [(ngModel)]="filtroArea" class="filter-sel">
          <option value="">Todas las áreas</option>
          <option *ngFor="let a of areas" [value]="a">{{ a }}</option>
        </select>
        <input [(ngModel)]="filtroResidente" placeholder="Buscar residente..." class="filter-input" />
      </div>
      <div class="eval-table">
        <div class="et-header">
          <span>Residente</span>
          <span>Evaluador</span>
          <span>Área</span>
          <span>Nota</span>
          <span>Proyecto</span>
          <span>Fecha</span>
        </div>
        <div class="et-row" *ngFor="let e of filtradas">
          <span>{{ e.evaluadoNombre }}</span>
          <span>{{ e.evaluadorNombre }}</span>
          <span>{{ e.areaNombre }}</span>
          <span [ngClass]="scoreClass(e.nota)">{{ e.nota ?? 'N/A' }}</span>
          <span>{{ e.projectNombre ?? '—' }}</span>
          <span>{{ e.createdAt | date:'dd/MM/yy' }}</span>
        </div>
        <div class="et-empty" *ngIf="!filtradas.length && !loading">Sin evaluaciones</div>
        <div class="et-empty" *ngIf="loading">Cargando...</div>
      </div>
    </div>
  </div>
</div>
