<app-abril-page-header
  badge="EVALUACIONES"
  titulo="Historial"
  subtitulo="Historial de evaluaciones por período y residente."
  [tabGroups]="tabGroups"
></app-abril-page-header>

<div class="hist-root">

  <div class="hist-content">

    <!-- PANEL IZQUIERDO -->
    <div class="panel-left">
      <div class="panel-header">
        <div class="panel-title">Períodos</div>
      </div>
      <div class="periodo-list">
        <div class="periodo-item"
          *ngFor="let p of periodos"
          [class.active]="periodoSeleccionado?.id === p.id"
          (click)="selectPeriodo(p)">
          <span>{{ p.nombreMes }} {{ p.anio }}</span>
          <span *ngIf="p.activo" class="periodo-dot"></span>
        </div>
      </div>
    </div>

    <!-- PANEL DERECHO -->
    <div class="panel-right">
      <div class="panel-header">
        <div class="panel-title">Evaluaciones</div>
      </div>

      <div class="eval-filters">
        <select [(ngModel)]="filtroArea" class="filter-sel">
          <option value="">Todas las áreas</option>
          <option *ngFor="let a of areas" [value]="a">{{ a }}</option>
        </select>
        <input [(ngModel)]="filtroResidente" placeholder="Buscar residente..." class="filter-input" />
      </div>

      <div class="table-wrap">
        <table class="eval-table">
          <thead>
            <tr>
              <th>Residente</th>
              <th>Evaluador</th>
              <th>Área</th>
              <th>Nota</th>
              <th>Proyecto</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let e of filtradas">
              <td>{{ e.evaluadoNombre }}</td>
              <td>{{ e.evaluadorNombre }}</td>
              <td>{{ e.areaNombre }}</td>
              <td [ngClass]="scoreClass(e.nota)">{{ e.nota ?? 'N/A' }}</td>
              <td>{{ e.projectNombre ?? '—' }}</td>
              <td>{{ e.createdAt | date:'dd/MM/yy' }}</td>
            </tr>
          </tbody>
        </table>
        <div class="et-empty" *ngIf="!filtradas.length && !loading">Sin evaluaciones</div>
        <div class="et-empty" *ngIf="loading">Cargando...</div>
      </div>
    </div>
  </div>
</div>
