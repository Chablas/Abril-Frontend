<app-abril-page-header
  badge="COSTOS · CONFIGURACIÓN"
  titulo="Partidas de Control"
  subtitulo="Categorías de partidas para control de costos."
  [tabs]="[
    { label: 'Correos Proyecto',  icono: 'ti-mail',     route: '/costs/configuration/staff-project-email' },
    { label: 'Partidas Control',  icono: 'ti-category', route: '/costs/configuration/work-item-category' },
    { label: 'Partidas',          icono: 'ti-list',     route: '/costs/configuration/work-item' },
    { label: 'Links Proyecto',    icono: 'ti-link',     route: '/costs/configuration/project-link' },
    { label: 'Correos C. Ppto.',  icono: 'ti-mail-cog', route: '/costs/configuration/costos-presupuestos-email' }
  ]">
</app-abril-page-header>

<div class="flex flex-col gap-4 bg-white rounded-lg p-5 flex-1 min-h-0">

  <!-- Header -->
  <div class="flex justify-between items-center">
    <button (click)="showCreateModal = true"
      class="py-[5px] px-5 rounded-lg border text-sm flex items-center gap-2 cursor-pointer transition-colors" style="background:var(--color-abril-primary-light); border-color:var(--color-abril-primary); color:var(--color-abril-primary)">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="color:var(--color-abril-primary)">
        <path d="M10 0C4.486 0 0 4.486 0 10s4.486 10 10 10 10-4.486 10-10S15.514 0 10 0Zm0 1.538c4.682 0 8.462 3.78 8.462 8.462S14.682 18.462 10 18.462 1.538 14.682 1.538 10 5.318 1.538 10 1.538ZM9.231 5.385v3.846H5.385v1.538h3.846v3.846h1.538v-3.846h3.846V9.231h-3.846V5.385H9.231Z" fill="currentColor"/>
      </svg>
      Nuevo registro
    </button>

    <!-- Botón Sincronizar instructivos -->
    <button (click)="syncInstructivos()" [disabled]="syncing"
      class="bg-white py-[5px] px-5 rounded-lg border border-blue-400 text-blue-500 text-sm flex items-center gap-2 cursor-pointer hover:bg-blue-50 transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
      <svg *ngIf="!syncing" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      <svg *ngIf="syncing" class="animate-spin" width="18" height="18" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      {{ syncing ? 'Sincronizando…' : 'Sincronizar instructivos' }}
    </button>
  </div>

  <!-- Filtros -->
  <div class="flex flex-wrap gap-3 items-end">

    <div class="flex flex-col gap-[6px]">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Descripción</label>
      <input
        type="text"
        [(ngModel)]="filters.description"
        placeholder="Buscar por descripción..."
        (keydown.enter)="onSearch()"
        class="w-[260px] border rounded-xl px-3 py-[10px] text-sm focus:outline-none" style="border-color:var(--color-abril-border)" />
    </div>

    <button type="button" (click)="onSearch()"
      class="h-[42px] px-5 rounded-xl text-white text-sm font-medium cursor-pointer transition-colors flex items-center gap-2" style="background:var(--color-abril-primary)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M19.6 21L13.3 14.7a7 7 0 1 1 1.4-1.4L21 19.6 19.6 21ZM9.5 14A4.5 4.5 0 1 0 9.5 5a4.5 4.5 0 0 0 0 9Z" fill="white"/>
      </svg>
      Buscar
    </button>

  </div>

  <!-- Lista -->
  <app-work-item-category-list
    [filters]="filters"
    (pagedData)="onPagedData($event)"
    class="flex-1 min-h-0 overflow-auto">
  </app-work-item-category-list>

  <!-- Paginador -->
  <app-paginator
    [totalRecords]="totalRecords"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (pageChange)="onPageChange($event)">
  </app-paginator>

</div>

<!-- Modal crear -->
<app-work-item-category-create
  *ngIf="showCreateModal"
  (closeModal)="showCreateModal = false"
  (saved)="list.load(1)">
</app-work-item-category-create>
