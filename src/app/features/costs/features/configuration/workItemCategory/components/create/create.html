<app-base-modal [title]="'AGREGAR PARTIDA DE CONTROL'" width="w-[420px]" (closeModal)="closeModal.emit()">
  <div class="flex flex-col gap-5 mt-5">

    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Descripción</label>
      <input
        type="text"
        [(ngModel)]="description"
        placeholder="Ingresa la descripción..."
        class="border rounded-lg px-3 py-2.5 text-sm focus:outline-none" style="border-color:var(--color-abril-border)" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Especialidad</label>
      <app-search-select
        [options]="specialties"
        valueField="workSpecialtyId"
        displayField="workSpecialtyDescription"
        placeholder="Selecciona la especialidad"
        [showLabel]="false"
        [fullText]="true"
        [(value)]="specialtyId">
      </app-search-select>
    </div>

    <div class="flex justify-center pt-1">
      <button (click)="save()"
        class="w-[140px] py-2 rounded-lg cursor-pointer transition-colors" style="background:var(--color-abril-primary)">
        <p class="text-white text-base font-medium text-center">Guardar</p>
      </button>
    </div>

  </div>
</app-base-modal>
