<div class="flex flex-col gap-4 flex-1 min-h-0">

  <!-- Filtros + Buscar + Sincronizar (una sola línea) -->
  <div class="flex flex-wrap gap-3 items-end">

    <!-- Descripción -->
    <div class="flex flex-col gap-[6px]">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Descripción</label>
      <app-search-input
        width="260px"
        placeholder="Buscar por descripción..."
        [value]="filters.description || ''"
        (valueChange)="filters.description = $event"
        (keyup.enter)="onSearch()">
      </app-search-input>
    </div>

    <!-- Partida de control -->
    <div class="flex flex-col gap-[6px] w-[260px]">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Partida de control</label>
      <app-search-select
        [options]="categories"
        valueField="workItemCategoryId"
        displayField="workItemCategoryDescription"
        placeholder="Todas"
        [showLabel]="false"
        [(value)]="filters.workItemCategoryId">
      </app-search-select>
    </div>

    <!-- Forma de valorización -->
    <div class="flex flex-col gap-[6px] w-[250px]">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Forma de valorización</label>
      <app-search-select
        [options]="valorizationOptions"
        valueField="value"
        displayField="label"
        placeholder="Todas"
        [showLabel]="false"
        [(value)]="filters.hasValorizationForm">
      </app-search-select>
    </div>

    <!-- Buscar -->
    <button type="button" (click)="onSearch()"
      class="h-[42px] px-5 rounded-lg text-white text-sm font-medium cursor-pointer transition-colors flex items-center gap-2" style="background:var(--color-abril-primary)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M19.6 21L13.3 14.7a7 7 0 1 1 1.4-1.4L21 19.6 19.6 21ZM9.5 14A4.5 4.5 0 1 0 9.5 5a4.5 4.5 0 0 0 0 9Z" fill="white"/>
      </svg>
      Buscar
    </button>

    <!-- Sincronizar partidas (alineado a la derecha) -->
    <button (click)="sync()" [disabled]="syncing"
      class="h-[42px] bg-white px-5 rounded-lg border border-blue-400 text-blue-500 text-sm flex items-center gap-2 cursor-pointer hover:bg-blue-50 transition-colors disabled:opacity-60 disabled:cursor-not-allowed ml-auto">
      <svg *ngIf="!syncing" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      <svg *ngIf="syncing" class="animate-spin" width="18" height="18" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      {{ syncing ? 'Sincronizando…' : 'Sincronizar partidas' }}
    </button>

  </div>

  <!-- Lista -->
  <app-work-item-list
    [filters]="filters"
    (pagedData)="onPagedData($event)"
    class="flex-1 min-h-0 overflow-auto">
  </app-work-item-list>

  <!-- Paginador -->
  <app-paginator
    [totalRecords]="totalRecords"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (pageChange)="onPageChange($event)">
  </app-paginator>

</div>

<!-- Modal crear -->
<app-work-item-create
  *ngIf="showCreateModal"
  (closeModal)="showCreateModal = false"
  (saved)="list.load(1)">
</app-work-item-create>
