<div class="flex flex-col gap-4 bg-white rounded-lg p-5 h-full">

  <!-- Header -->
  <div class="flex justify-between items-center">
    <button (click)="showCreateModal = true"
      class="bg-[#E5F7D1] py-[5px] px-5 rounded-lg border border-[#64BC04] text-[#64BC04] text-sm flex items-center gap-2 cursor-pointer hover:bg-[#d4f0b8] transition-colors">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M10 0C4.486 0 0 4.486 0 10s4.486 10 10 10 10-4.486 10-10S15.514 0 10 0Zm0 1.538c4.682 0 8.462 3.78 8.462 8.462S14.682 18.462 10 18.462 1.538 14.682 1.538 10 5.318 1.538 10 1.538ZM9.231 5.385v3.846H5.385v1.538h3.846v3.846h1.538v-3.846h3.846V9.231h-3.846V5.385H9.231Z" fill="#64BC04"/>
      </svg>
      Nuevo registro
    </button>
  </div>

  <!-- Filtros -->
  <div class="flex flex-wrap gap-3 items-end">

    <div class="flex flex-col gap-[6px]">
      <label class="text-sm text-[#64BC04] font-medium">Descripción</label>
      <input
        type="text"
        [(ngModel)]="filters.description"
        placeholder="Buscar por descripción..."
        class="w-[260px] border border-[#D6DEE5] rounded-xl px-3 py-[10px] text-sm focus:outline-none focus:ring-2 focus:ring-[#64BC04]/30" />
    </div>

    <button type="button" (click)="onSearch()"
      class="h-[42px] px-5 bg-[#64BC04] rounded-xl text-white text-sm font-medium cursor-pointer hover:bg-[#57a803] transition-colors flex items-center gap-2">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M19.6 21L13.3 14.7a7 7 0 1 1 1.4-1.4L21 19.6 19.6 21ZM9.5 14A4.5 4.5 0 1 0 9.5 5a4.5 4.5 0 0 0 0 9Z" fill="white"/>
      </svg>
      Buscar
    </button>

  </div>

  <!-- Lista -->
  <app-work-item-list
    [filters]="filters"
    (pagedData)="onPagedData($event)"
    class="flex-1 min-h-0 overflow-auto">
  </app-work-item-list>

  <!-- Paginador -->
  <app-paginator
    [totalRecords]="totalRecords"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (pageChange)="onPageChange($event)">
  </app-paginator>

</div>

<!-- Modal crear -->
<app-work-item-create
  *ngIf="showCreateModal"
  (closeModal)="showCreateModal = false"
  (saved)="list.load(1)">
</app-work-item-create>
