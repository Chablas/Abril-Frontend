<app-abril-page-header
  badge="COSTOS · CONFIGURACIÓN"
  titulo="Partidas"
  subtitulo="Ítems de trabajo para presupuesto y control de costos."
  [botonPrimario]="{ label: 'Nuevo registro', icono: 'ti-plus' }"
  (primaryClick)="showCreateModal = true"
  [tabs]="[
    { label: 'Correos Proyecto',  icono: 'ti-mail',     route: '/costs/configuration/staff-project-email' },
    { label: 'Partidas Control',  icono: 'ti-category', route: '/costs/configuration/work-item-category' },
    { label: 'Partidas',          icono: 'ti-list',     route: '/costs/configuration/work-item' },
    { label: 'Especialidades',    icono: 'ti-stack-2',  route: '/costs/configuration/work-specialty' },
    { label: 'Planos Proyecto',   icono: 'ti-link',     route: '/costs/configuration/project-link' },
    { label: 'Carpeta Adj.',      icono: 'ti-folder',   route: '/costs/configuration/adjudicacion-folder' },
    { label: 'Correos C. Ppto.',  icono: 'ti-mail-cog', route: '/costs/configuration/costos-presupuestos-email' }
  ]">
</app-abril-page-header>

<div class="flex flex-col gap-4 bg-white rounded-lg p-5 flex-1 min-h-0">

  <!-- Filtros -->
  <div class="flex flex-wrap gap-3 items-end">

    <div class="flex flex-col gap-[6px]">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Descripción</label>
      <input
        type="text"
        [(ngModel)]="filters.description"
        (keyup.enter)="onSearch()"
        placeholder="Buscar por descripción..."
        class="w-[260px] border rounded-lg px-3 py-[10px] text-sm focus:outline-none" style="border-color:var(--color-abril-border)" />
    </div>

    <button type="button" (click)="onSearch()"
      class="h-[42px] px-5 rounded-lg text-white text-sm font-medium cursor-pointer transition-colors flex items-center gap-2" style="background:var(--color-abril-primary)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M19.6 21L13.3 14.7a7 7 0 1 1 1.4-1.4L21 19.6 19.6 21ZM9.5 14A4.5 4.5 0 1 0 9.5 5a4.5 4.5 0 0 0 0 9Z" fill="white"/>
      </svg>
      Buscar
    </button>

  </div>

  <!-- Lista -->
  <app-work-item-list
    [filters]="filters"
    (pagedData)="onPagedData($event)"
    class="flex-1 min-h-0 overflow-auto">
  </app-work-item-list>

  <!-- Paginador -->
  <app-paginator
    [totalRecords]="totalRecords"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (pageChange)="onPageChange($event)">
  </app-paginator>

</div>

<!-- Modal crear -->
<app-work-item-create
  *ngIf="showCreateModal"
  (closeModal)="showCreateModal = false"
  (saved)="list.load(1)">
</app-work-item-create>
