<app-base-modal [title]="'EDITAR LINK DE PROYECTO'" width="w-[500px]" (closeModal)="closeModal.emit()">
  <div class="flex flex-col gap-5 mt-5">

    <!-- URL -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">URL del link</label>
      <input
        type="url"
        [(ngModel)]="dto.linkUrl"
        placeholder="https://..."
        class="border rounded-xl px-3 py-2.5 text-sm focus:outline-none" style="border-color:var(--color-abril-border)" />
    </div>

    <!-- Estado -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Estado</label>
      <select [(ngModel)]="dto.active"
        class="w-full px-3 py-2.5 border rounded-xl text-sm bg-white focus:outline-none cursor-pointer" style="border-color:var(--color-abril-border)">
        <option [ngValue]="true">ACTIVO</option>
        <option [ngValue]="false">INACTIVO</option>
      </select>
    </div>

    <!-- Guardar -->
    <div class="flex justify-center pt-1">
      <button (click)="save()"
        class="w-[140px] py-2 rounded-xl cursor-pointer transition-colors" style="background:var(--color-abril-primary)">
        <p class="text-white text-base font-medium text-center">Guardar</p>
      </button>
    </div>

  </div>
</app-base-modal>
