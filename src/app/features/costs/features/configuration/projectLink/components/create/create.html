<app-base-modal [title]="'AGREGAR PLANO DE PROYECTO'" width="w-[500px]" (closeModal)="closeModal.emit()">
  <div class="flex flex-col gap-5 mt-5">

    <!-- Proyecto -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Proyecto</label>
      <app-search-select
        [options]="formData.projects"
        valueField="projectId"
        displayField="projectDescription"
        placeholder="— Selecciona un proyecto —"
        [showLabel]="false"
        [(value)]="projectId">
      </app-search-select>
    </div>

    <!-- Tipo de link -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Tipo de link</label>
      <app-search-select
        [options]="formData.types"
        valueField="projectLinkTypeId"
        displayField="projectLinkTypeDescription"
        placeholder="— Selecciona el tipo —"
        [showLabel]="false"
        [(value)]="projectLinkTypeId">
      </app-search-select>
    </div>

    <!-- URL -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">URL del link</label>
      <input
        type="url"
        [(ngModel)]="linkUrl"
        placeholder="https://..."
        class="border rounded-lg px-3 py-2.5 text-sm focus:outline-none" style="border-color:var(--color-abril-border)" />
    </div>

    <!-- Guardar -->
    <div class="flex justify-center pt-1">
      <button (click)="save()"
        class="w-[140px] py-2 rounded-lg cursor-pointer transition-colors" style="background:var(--color-abril-primary)">
        <p class="text-white text-base font-medium text-center">Guardar</p>
      </button>
    </div>

  </div>
</app-base-modal>
