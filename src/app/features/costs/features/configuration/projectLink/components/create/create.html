<app-base-modal [title]="'AGREGAR LINK DE PROYECTO'" width="w-[500px]" (closeModal)="closeModal.emit()">
  <div class="flex flex-col gap-5 mt-5">

    <!-- Proyecto -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm text-[#64BC04] font-medium">Proyecto</label>
      <app-search-select
        [options]="formData.projects"
        valueField="projectId"
        displayField="projectDescription"
        placeholder="— Selecciona un proyecto —"
        [showLabel]="false"
        [(value)]="projectId">
      </app-search-select>
    </div>

    <!-- Tipo de link -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm text-[#64BC04] font-medium">Tipo de link</label>
      <app-search-select
        [options]="formData.types"
        valueField="projectLinkTypeId"
        displayField="projectLinkTypeDescription"
        placeholder="— Selecciona el tipo —"
        [showLabel]="false"
        [(value)]="projectLinkTypeId">
      </app-search-select>
    </div>

    <!-- URL -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm text-[#64BC04] font-medium">URL del link</label>
      <input
        type="url"
        [(ngModel)]="linkUrl"
        placeholder="https://..."
        class="border border-[#D6DEE5] rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#64BC04]/30" />
    </div>

    <!-- Guardar -->
    <div class="flex justify-center pt-1">
      <button (click)="save()"
        class="w-[140px] bg-[#64BC04] py-2 rounded-xl cursor-pointer hover:bg-[#57a803] transition-colors">
        <p class="text-white text-base font-medium text-center">Guardar</p>
      </button>
    </div>

  </div>
</app-base-modal>
