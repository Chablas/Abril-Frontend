<div class="flex flex-col gap-3">

  <!-- Link + detectar -->
  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Link de la carpeta (OneDrive / SharePoint)</label>
    <div class="flex gap-2">
      <input
        type="url"
        [ngModel]="linkUrl"
        (ngModelChange)="onLinkChange($event)"
        placeholder="https://abrilinmob-my.sharepoint.com/..."
        class="flex-1 min-w-0 border rounded-lg px-3 py-2.5 text-sm focus:outline-none" style="border-color:var(--color-abril-border)" />
      <button type="button" (click)="detect()"
        class="px-4 rounded-lg text-white text-sm font-medium cursor-pointer transition-colors whitespace-nowrap" style="background:var(--color-abril-primary)">
        Detectar
      </button>
    </div>
    <span class="text-xs text-gray-400">
      Pega el enlace del proyecto y pulsa <b>Detectar</b> para navegar sus carpetas y elegir la de contratos.
    </span>
  </div>

  <!-- Navegador -->
  <div *ngIf="detected" class="flex flex-col gap-2 border rounded-lg p-3" style="border-color:var(--color-abril-border)">

    <!-- Breadcrumb -->
    <div class="flex items-center flex-wrap gap-1 text-xs">
      <ng-container *ngFor="let c of breadcrumb; let i = index; let last = last">
        <button type="button"
          class="px-1.5 py-0.5 rounded transition-colors"
          [ngClass]="last ? 'font-semibold text-gray-700 cursor-default' : 'text-[color:var(--color-abril-primary)] hover:bg-gray-100 cursor-pointer'"
          (click)="goToCrumb(i)">
          {{ c.name }}
        </button>
        <span *ngIf="!last" class="text-gray-300">/</span>
      </ng-container>
    </div>

    <!-- Subcarpetas -->
    <div class="border rounded-lg max-h-[240px] overflow-y-auto bg-white" style="border-color:var(--color-abril-border)">
      <button *ngFor="let f of folders" type="button"
        (click)="openFolder(f)"
        class="w-full flex items-center gap-2 px-3 py-2 text-left text-sm border-b last:border-b-0 hover:bg-green-50 cursor-pointer transition-colors"
        style="border-color:var(--color-abril-border)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="shrink-0">
          <path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z" style="fill:var(--color-abril-primary)"/>
        </svg>
        <span class="flex-1 truncate text-gray-700">{{ f.name }}</span>
        <span class="text-gray-300 text-xs">›</span>
      </button>
      <p *ngIf="folders.length === 0" class="text-center text-xs text-gray-400 italic py-4">
        Esta carpeta no tiene subcarpetas.
      </p>
    </div>

    <!-- Selección actual -->
    <div *ngIf="currentFolder" class="flex items-center gap-2 text-sm bg-green-50 border border-green-200 rounded-lg px-3 py-2">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="shrink-0">
        <path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="#16a34a"/>
      </svg>
      <span class="text-gray-700">Se guardará en: <b>{{ currentFolder.name }}</b></span>
    </div>
  </div>

</div>
