<app-base-modal [title]="'AGREGAR CORREO POR PROYECTO'" width="w-[480px]" (closeModal)="closeModal.emit()">
  <div class="flex flex-col gap-5 mt-5">

    <!-- Proyecto -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Proyecto</label>
      <app-search-select
        [options]="formData.projects"
        valueField="projectId"
        displayField="projectDescription"
        [showLabel]="false"
        [(value)]="dto.projectId">
      </app-search-select>
    </div>

    <!-- Tipo de correo -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Tipo de correo</label>
      <app-search-select
        [options]="formData.types"
        valueField="staffProjectEmailTypeId"
        displayField="description"
        placeholder="— Selecciona un tipo —"
        [showLabel]="false"
        [(value)]="dto.staffProjectEmailTypeId">
      </app-search-select>
    </div>

    <!-- Email -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Correo electrónico</label>
      <input
        type="email"
        [(ngModel)]="dto.email"
        placeholder="ejemplo@correo.com"
        class="border rounded-xl px-3 py-2.5 text-sm focus:outline-none" style="border-color:var(--color-abril-border)" />
    </div>

    <!-- Guardar -->
    <div class="flex justify-center pt-1">
      <button (click)="save()"
        class="w-[140px] py-2 rounded-xl cursor-pointer transition-colors" style="background:var(--color-abril-primary)">
        <p class="text-white text-base font-medium text-center">Guardar</p>
      </button>
    </div>

  </div>
</app-base-modal>
