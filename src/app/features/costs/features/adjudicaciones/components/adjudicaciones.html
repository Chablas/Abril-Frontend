<div class="pt-5 pb-3 flex flex-wrap gap-3 items-center">
  <button (click)="openCreateModal($event)" class="bg-[#E5F7D1] py-[5px] px-[18px] rounded-lg border border-[#64BC04] text-[#64BC04] text-sm flex items-center gap-2 cursor-pointer hover:bg-[#d4f0b8] transition-colors">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 0C4.486 0 0 4.486 0 10s4.486 10 10 10 10-4.486 10-10S15.514 0 10 0Zm0 1.538c4.682 0 8.462 3.78 8.462 8.462S14.682 18.462 10 18.462 1.538 14.682 1.538 10 5.318 1.538 10 1.538ZM9.231 5.385v3.846H5.385v1.538h3.846v3.846h1.538v-3.846h3.846V9.231h-3.846V5.385H9.231Z" fill="#64BC04"/></svg>
    Nueva adjudicación
  </button>

  <input type="text" [(ngModel)]="filters.search" placeholder="Buscar razón social, servicio…"
    class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-72 bg-white focus:outline-none focus:ring-2 focus:ring-[#64BC04]/40" />

  <select [(ngModel)]="filters.projectId" class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white text-gray-500 focus:outline-none cursor-pointer">
    <option [ngValue]="0">Todos los proyectos</option>
  </select>

  <button (click)="load()" class="bg-[#64BC04] text-white text-sm px-4 py-2 rounded-lg cursor-pointer hover:bg-[#57a803] transition-colors">
    Buscar
  </button>

  <span class="text-xs text-gray-400 ml-auto">{{ totalRecords }} registros</span>
</div>

<main class="pb-4 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
  <app-card
    *ngFor="let item of items"
    [item]="item"
    (cardClick)="openDetail(item)">
  </app-card>
</main>

<app-paginator
  [totalRecords]="totalRecords"
  [currentPage]="currentPage"
  [totalPages]="totalPages"
  (pageChange)="load($event)">
</app-paginator>

<app-create
  *ngIf="showCreateModal"
  (closeModal)="showCreateModal = false"
  (saved)="load(currentPage)">
</app-create>

<app-detail
  *ngIf="selectedItem"
  [item]="selectedItem"
  (closeModal)="selectedItem = null"
  (statusChanged)="load(currentPage)">
</app-detail>
