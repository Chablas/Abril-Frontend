<div (click)="cardClick.emit(item.projectSubContractorId)"
    class="bg-white rounded-xl border border-gray-200 p-4 cursor-pointer hover:shadow-md hover:border-[#64BC04]/50 transition-all">

  <div class="flex justify-between items-start mb-3">
    <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full border"
      [ngClass]="stepBadgeClass()">
      Paso {{ item.projectSubContractorStatusId }} · {{ item.projectSubContractorStatusDescription }}
    </span>
    <span class="text-[11px] text-gray-400">SC-{{ item.projectSubContractorId }}</span>
  </div>

  <p class="font-semibold text-gray-800 text-sm leading-tight mb-1">{{ item.contributorName }}</p>
  <p class="text-xs text-gray-500 leading-snug mb-2">{{ item.contractDescription }}</p>

  <div class="flex flex-wrap gap-1 mb-3">
    <span class="text-[10px] px-2 py-0.5 bg-gray-100 text-gray-500 rounded-full">
      {{ item.workItemDescription }}
    </span>
  </div>

  <div class="flex items-center justify-between pt-2 border-t border-gray-100">
    <div class="flex items-center gap-1.5 text-[11px] text-gray-500">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="#9CA3AF" stroke-width="1.5"/>
        <polyline points="9 22 9 12 15 12 15 22" stroke="#9CA3AF" stroke-width="1.5"/>
      </svg>
      {{ item.projectDescription }}
    </div>
    <!-- mini stepper -->
    <div class="flex gap-0.5">
      <div *ngFor="let dot of stepDots; let i = index"
        class="w-4 h-1.5 rounded-full"
        [ngClass]="i < item.projectSubContractorStatusId ? 'bg-[#64BC04]' : 'bg-gray-200'">
      </div>
    </div>
  </div>

</div>
