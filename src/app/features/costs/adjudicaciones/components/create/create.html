<app-base-modal [title]="'NUEVA ADJUDICACIÓN'" width="w-[900px]" (closeModal)="closeModal.emit()">

  <div class="flex flex-col gap-[24px] mt-[20px]">

    <!-- ── SECCIÓN 1: Información general ──────────────────────────── -->
    <div>
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-[12px]">
        Información general
      </p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-[16px]">

        <app-search-select label="Proyecto" [options]="createFormData.projects" valueField="projectId"
          displayField="projectDescription" [(value)]="createDto.projectId" />

        <app-search-select label="Empresa / Subcontratista" [options]="createFormData.companies" valueField="companyId"
          displayField="companyName" [(value)]="createDto.companyId" />

        <app-search-select label="Partida" [options]="createFormData.workItems" valueField="workItemId"
          displayField="workItemDescription" [(value)]="createDto.workItemId" />

        <div class="flex flex-col gap-[6px]">
          <label class="text-sm text-[#64BC04] font-medium">Correo del contratista</label>
          <input
            type="email"
            [(ngModel)]="createDto.contractorEmail"
            placeholder="correo@empresa.com"
            class="border border-[#E2E2E2] rounded-xl p-[10px] text-sm focus:outline-none focus:ring-2 focus:ring-[#64BC04]/30"
          />
        </div>

      </div>
    </div>

    <div class="border-t border-[#F0F0F0]"></div>

    <!-- ── SECCIÓN 2: Información del contrato ────────────────────── -->
    <div>
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-[12px]">
        Información del contrato
      </p>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-[16px]">

        <app-search-select label="Contrato" [options]="createFormData.contracts" valueField="contractId"
          displayField="contractDescription" [(value)]="createDto.contractId" />

        <app-search-select label="Tipo de contrato" [options]="createFormData.contractTypes" valueField="contractTypeId"
          displayField="contractTypeDescription" [(value)]="createDto.contractTypeId" />

        <app-search-select label="Origen del contrato" [options]="createFormData.contractOrigins" valueField="contractOriginId"
          displayField="contractOriginDescription" [(value)]="createDto.contractOriginId" />

      </div>
    </div>

    <div class="border-t border-[#F0F0F0]"></div>

    <!-- ── SECCIÓN 3: Información financiera ─────────────────────── -->
    <div>
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-[12px]">
        Información financiera
      </p>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-[16px]">

        <div class="flex flex-col gap-[6px]">
          <label class="text-sm text-[#64BC04] font-medium">Monto</label>
          <input
            type="number"
            [(ngModel)]="createDto.amount"
            min="0"
            placeholder="0.00"
            class="border border-[#E2E2E2] rounded-xl p-[10px] text-sm focus:outline-none focus:ring-2 focus:ring-[#64BC04]/30"
          />
        </div>

        <app-search-select label="Moneda" [options]="createFormData.currencies" valueField="currencyId"
          displayField="currencyCode" [(value)]="createDto.currencyId" />

        <app-search-select label="Forma de pago" [options]="createFormData.paymentMethods" valueField="paymentMethodId"
          displayField="paymentMethodDescription" [(value)]="createDto.paymentMethodId" />

        <div *ngIf="createDto.paymentMethodId === 2" class="flex flex-col gap-[6px]">
          <label class="text-sm text-[#64BC04] font-medium">Porcentaje de adelanto</label>
          <div class="relative">
            <input
              type="text"
              inputmode="decimal"
              [ngModel]="createDto.advancePercentage"
              min="0"
              max="100"
              placeholder="0"
              (input)="blockExtraDecimals($event)"
              class="w-full border border-[#E2E2E2] rounded-xl p-[10px] pr-[36px] text-sm focus:outline-none focus:ring-2 focus:ring-[#64BC04]/30"
            />
            <span class="absolute right-[12px] top-1/2 -translate-y-1/2 text-sm text-gray-400 pointer-events-none">%</span>
          </div>
          <span *ngIf="createDto.advancePercentage && createDto.amount" class="text-xs text-gray-500">
            Adelanto: <span class="font-semibold text-gray-700">{{ (createDto.advancePercentage / 100) * createDto.amount | number:'1.2-2' }}</span>
          </span>
        </div>

      </div>

      <!-- IGV toggle -->
      <div class="mt-[16px] flex items-center gap-[12px]">
        <button
          type="button"
          (click)="createDto.hasIgv = !createDto.hasIgv"
          class="relative w-[44px] h-[24px] rounded-full transition-colors duration-200 cursor-pointer focus:outline-none"
          [ngClass]="createDto.hasIgv ? 'bg-[#64BC04]' : 'bg-gray-300'"
        >
          <span
            class="absolute left-0 top-[3px] w-[18px] h-[18px] bg-white rounded-full shadow transition-transform duration-200"
            [ngClass]="createDto.hasIgv ? 'translate-x-[23px]' : 'translate-x-[3px]'"
          ></span>
        </button>
        <span class="text-sm text-gray-600">
          Incluye IGV
          <span
            class="ml-[6px] text-xs font-semibold px-[8px] py-[2px] rounded-full"
            [ngClass]="createDto.hasIgv ? 'bg-[#E5F7D1] text-[#64BC04]' : 'bg-gray-100 text-gray-400'"
          >
            {{ createDto.hasIgv ? 'SÍ' : 'NO' }}
          </span>
        </span>
      </div>
    </div>

    <div class="border-t border-[#F0F0F0]"></div>

    <!-- ── SECCIÓN 4: Archivos ────────────────────────────────────── -->
    <div>
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-[12px]">
        Archivos adjuntos
      </p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-[16px]">

        <!-- Archivos de cotización -->
        <div class="flex flex-col gap-[8px]">
          <label class="text-sm text-[#64BC04] font-medium">
            Archivos de cotización
            <span class="text-gray-400 font-normal">(máx. {{ maxQuotationFiles }})</span>
          </label>
          <app-file-selector
            *ngIf="quotationFileItems.length < maxQuotationFiles"
            accept="*"
            hint="Cualquier archivo"
            (fileSelected)="onQuotationImageSelected($event)">
          </app-file-selector>
          <app-file-preview [files]="quotationFileItems" (remove)="removeQuotationFile($event)"></app-file-preview>
        </div>

        <!-- Archivos comparativos -->
        <div class="flex flex-col gap-[8px]">
          <label class="text-sm text-[#64BC04] font-medium">
            Archivos comparativos
            <span class="text-gray-400 font-normal">(máx. {{ maxComparativeFiles }})</span>
          </label>
          <app-file-selector
            *ngIf="comparativeFileItems.length < maxComparativeFiles"
            accept="*"
            hint="Cualquier archivo"
            (fileSelected)="onComparativeImageSelected($event)">
          </app-file-selector>
          <app-file-preview [files]="comparativeFileItems" (remove)="removeComparativeFile($event)"></app-file-preview>
        </div>

      </div>
    </div>

    <!-- ── BOTÓN GUARDAR ──────────────────────────────────────────── -->
    <div class="flex justify-center pt-[4px]">
      <button
        (click)="save()"
        class="w-[140px] bg-[#64BC04] py-[8px] rounded-[10px] cursor-pointer hover:bg-[#57a803] transition-colors"
      >
        <p class="text-white text-base font-medium text-center">Guardar</p>
      </button>
    </div>

  </div>

</app-base-modal>
