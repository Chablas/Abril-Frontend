<app-base-modal [title]="'Crear licencia'" width="w-[560px]" (closeModal)="closeModal.emit()">

  <form (ngSubmit)="submit()" class="flex flex-col gap-5 mt-2">

    <!-- ── Archivo de la licencia ──────────────────────────────────────── -->
    <div class="flex flex-col gap-[6px]">
      <label class="text-sm text-[var(--color-abril-primary)] font-medium">
        Archivo de la licencia <span class="text-red-500">*</span>
      </label>

      <app-file-selector
        *ngIf="!selectedFile"
        accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.webp"
        hint="PDF, Word, Excel o imagen"
        (fileSelected)="onFileSelected($event)">
      </app-file-selector>

      <div *ngIf="selectedFile"
        class="flex items-center justify-between border border-[#D6DEE5] rounded-lg px-3 py-2 bg-gray-50">
        <span class="text-sm text-gray-700 truncate">{{ selectedFile.file.name }}</span>
        <button type="button" (click)="removeFile()"
          class="text-red-500 text-sm font-medium cursor-pointer hover:underline ml-3 shrink-0">
          Quitar
        </button>
      </div>
    </div>

    <!-- ── Fecha de vencimiento ────────────────────────────────────────── -->
    <div class="flex flex-col gap-[6px]">
      <label class="text-sm text-[var(--color-abril-primary)] font-medium">
        Fecha de vencimiento <span class="text-red-500">*</span>
      </label>
      <app-date-picker
        [showLabel]="false"
        [value]="fechaVencimiento"
        (valueChange)="fechaVencimiento = $event ?? ''; onVencimientoChange()"
        color="var(--color-abril-primary)" />
    </div>

    <!-- ── Recordatorio (bidireccional) ────────────────────────────────── -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="flex flex-col gap-[6px]">
        <label class="text-sm text-[var(--color-abril-primary)] font-medium">
          Fecha de recordatorio <span class="text-red-500">*</span>
        </label>
        <app-date-picker
          [showLabel]="false"
          [value]="fechaRecordatorio"
          (valueChange)="fechaRecordatorio = $event ?? ''; onRecordatorioChange()"
          color="var(--color-abril-primary)" />
      </div>

      <div class="flex flex-col gap-[6px]">
        <label class="text-sm text-[var(--color-abril-primary)] font-medium">
          Días de antelación <span class="text-red-500">*</span>
        </label>
        <input type="number" min="0" name="diasAntes" [(ngModel)]="diasAntes"
          (ngModelChange)="onDiasChange()" placeholder="Ej. 30"
          class="border border-[#D6DEE5] rounded-lg bg-white px-[12px] py-[10px] text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[var(--color-abril-primary)]/30" />
      </div>
    </div>

    <p class="text-xs text-gray-500 -mt-2">
      Completa cualquiera de los dos campos: el otro se calcula automáticamente en base a la fecha de vencimiento.
    </p>

    <!-- ── Correos del recordatorio ────────────────────────────────────── -->
    <div class="flex flex-col gap-[6px]">
      <label class="text-sm text-[var(--color-abril-primary)] font-medium">
        Correos del recordatorio <span class="text-red-500">*</span>
      </label>

      <div class="flex gap-2">
        <input type="text" name="emailInput" [(ngModel)]="emailInput"
          (keydown.enter)="$event.preventDefault(); addEmail()"
          placeholder="correo@abril.pe o grupo@abril.pe"
          class="flex-1 border border-[#D6DEE5] rounded-lg bg-white px-[12px] py-[10px] text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[var(--color-abril-primary)]/30" />
        <button type="button" (click)="addEmail()"
          class="h-[42px] px-4 bg-[var(--color-abril-primary-light)] rounded-lg text-[var(--color-abril-primary)] text-sm font-medium cursor-pointer hover:bg-[#d4ecd5] transition-colors shrink-0">
          Agregar
        </button>
      </div>

      <!-- Chips de correos agregados -->
      <div *ngIf="emails.length > 0" class="flex flex-wrap gap-2 mt-1">
        <span *ngFor="let e of emails; let i = index"
          class="inline-flex items-center gap-1.5 bg-[var(--color-abril-primary-light)] text-[var(--color-abril-primary-dark)] text-xs font-medium px-2.5 py-1 rounded-full">
          <span class="ti ti-mail"></span>
          {{ e }}
          <button type="button" (click)="removeEmail(i)" title="Quitar"
            class="text-[var(--color-abril-primary-dark)]/60 hover:text-red-500 cursor-pointer leading-none">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </span>
      </div>

      <p class="text-xs text-gray-500">
        Puedes ingresar correos individuales o grupos de correo: los grupos se desglosan
        automáticamente en sus miembros al momento de enviar el recordatorio.
      </p>
    </div>

    <!-- ── Acciones ────────────────────────────────────────────────────── -->
    <div class="flex justify-end gap-3 pt-1">
      <button type="button" (click)="closeModal.emit()"
        class="h-[42px] px-5 rounded-lg border border-[#D6DEE5] text-sm font-medium text-gray-600 cursor-pointer hover:bg-gray-50 transition-colors">
        Cancelar
      </button>
      <button type="submit"
        class="h-[42px] px-5 bg-[#64BC04] rounded-lg text-white text-sm font-medium cursor-pointer hover:bg-[#57a803] transition-colors">
        Guardar licencia
      </button>
    </div>

  </form>
</app-base-modal>
