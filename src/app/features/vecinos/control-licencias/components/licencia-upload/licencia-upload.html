<app-base-modal
  [title]="(item.archivoUrl ? 'Reemplazar documento — ' : 'Subir documento — ') + item.tipoDescripcion"
  width="w-[480px]"
  (closeModal)="close()">

  <div class="flex flex-col gap-3">
    <p *ngIf="item.archivoUrl" class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
      El documento actual se archivará en el historial de este tipo de licencia.
    </p>

    <div class="abril-field">
      <label class="abril-field-label">Archivo</label>
      <input class="abril-field-input" type="file"
        accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.webp"
        (change)="onFileSelected($event)" />
    </div>

    <div class="abril-field">
      <label class="abril-field-label">Fecha de vencimiento</label>
      <input class="abril-field-input" type="date" [ngModel]="fechaVencimiento"
        (ngModelChange)="fechaVencimiento = $event; onFechaVencimientoChange()" />
    </div>
    <p class="text-xs text-gray-400 -mt-2" *ngIf="item.diasAntesDefault != null">
      Este tipo recuerda por defecto <b>{{ item.diasAntesDefault }} día(s)</b> antes de vencer.
    </p>

    <div class="abril-field">
      <label class="abril-field-label">Fecha de recordatorio</label>
      <input class="abril-field-input" type="date" [(ngModel)]="fechaRecordatorio" />
    </div>

    <p class="text-xs text-gray-400" *ngIf="diasAntes !== null">
      Se avisará <b>{{ diasAntes }} día(s)</b> antes del vencimiento.
    </p>

    <div class="flex justify-end gap-2 pt-2">
      <button type="button" (click)="close()" class="px-4 py-2 text-sm text-gray-500 hover:text-gray-700">Cancelar</button>
      <button type="button" (click)="guardar()"
        class="px-4 py-2 rounded-[var(--radius-standard)] bg-[var(--color-abril-standard)] text-white text-sm font-medium hover:bg-[var(--color-abril-standard-hover)] transition-colors">
        Guardar
      </button>
    </div>
  </div>
</app-base-modal>
