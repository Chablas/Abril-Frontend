<app-abril-modal-panel
  [titulo]="(item.archivoUrl ? 'Reemplazar documento' : 'Subir documento') + ' — ' + item.tipoDescripcion"
  icono="ti-upload"
  variant="teal"
  width="480px"
  (closeModal)="close()">

  <p *ngIf="item.archivoUrl" class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mb-3">
    El documento actual se archivará en el historial de este tipo de licencia.
  </p>

  <div class="abril-field">
    <label class="abril-field-label">Archivo</label>
    <input class="abril-field-input" type="file"
      accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.webp"
      (change)="onFileSelected($event)" />
  </div>

  <div class="abril-field">
    <label class="abril-field-label">Fecha de vencimiento</label>
    <input class="abril-field-input" type="date" [(ngModel)]="fechaVencimiento" />
  </div>

  <div class="abril-section-title">Recordatorios (días de antelación)</div>
  <p class="text-xs text-gray-400 -mt-1 mb-1.5">
    Puedes agregar varios, ej. 30, 15, 7 y 2 días antes — cada uno avisa por su cuenta.
  </p>

  <div class="flex flex-wrap gap-1.5 mb-2" *ngIf="diasAntesLista.length">
    <span *ngFor="let d of diasAntesLista"
      class="inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-full bg-[var(--color-abril-standard-light)] text-[var(--color-abril-standard)]">
      {{ d }} día{{ d === 1 ? '' : 's' }} antes
      <button type="button" (click)="quitarDiasAntes(d)" class="hover:text-red-600" title="Quitar">
        <i class="ti ti-x text-[10px]"></i>
      </button>
    </span>
  </div>

  <div class="flex items-end gap-2">
    <div class="abril-field flex-1">
      <label class="abril-field-label">Agregar (días antes)</label>
      <input class="abril-field-input" type="number" min="0" [(ngModel)]="nuevoDiasAntes"
        (keydown.enter)="agregarDiasAntes()" placeholder="Ej. 7" />
    </div>
    <button type="button" (click)="agregarDiasAntes()"
      class="h-[38px] px-3 rounded-[var(--radius-standard)] border border-gray-300 text-gray-600 text-sm hover:bg-gray-50">
      <i class="ti ti-plus"></i>
    </button>
  </div>

  <div modalFooter class="flex justify-between w-full">
    <button type="button" (click)="close()" class="px-4 py-2 text-sm text-gray-500 hover:text-gray-700">Cancelar</button>
    <button type="button" (click)="guardar()"
      class="px-4 py-2 rounded-[var(--radius-standard)] bg-[var(--color-abril-standard)] text-white text-sm font-medium hover:bg-[var(--color-abril-standard-hover)] transition-colors">
      Guardar
    </button>
  </div>
</app-abril-modal-panel>
