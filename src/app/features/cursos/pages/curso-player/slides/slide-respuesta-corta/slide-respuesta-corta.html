<div class="slide-rc" [ngClass]="'slide-rc-estilo-' + estilo">
  <span class="kicker anim-cascada-titulo">{{ kicker }}</span>

  <h2 class="enunciado anim-cascada-titulo">{{ config.enunciado }}</h2>

  <div class="campo-respuesta anim-cascada-cuerpo">
    <input
      type="text"
      class="input-respuesta"
      [(ngModel)]="texto"
      [disabled]="confirmado"
      placeholder="Escribe tu respuesta..."
      (keydown.enter)="confirmar()"
    />
    <button
      type="button"
      class="btn-enviar anim-cascada-control"
      [disabled]="!texto.trim() || confirmado"
      (click)="confirmar()"
      aria-label="Enviar respuesta"
      title="Enviar"
    >
      <i class="ti ti-send-2"></i>
    </button>
  </div>
</div>
