<div class="bg-white rounded-lg p-[20px]">

  <!-- Header con botón crear -->
  <div class="pb-[20px]">
    <button (click)="openCreateModal()"
      class="bg-[#E5F7D1] py-[5px] px-[20px] rounded-lg border border-[#64BC04] text-[#64BC04] cursor-pointer">
      <div class="flex items-center gap-[10px]">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 0C4.48615 0 0 4.48615 0 10C0 15.5138 4.48615 20 10 20C15.5138 20 20 15.5138 20 10C20 4.48615 15.5138 0 10 0ZM10 1.53846C14.6823 1.53846 18.4615 5.31769 18.4615 10C18.4615 14.6823 14.6823 18.4615 10 18.4615C5.31769 18.4615 1.53846 14.6823 1.53846 10C1.53846 5.31769 5.31769 1.53846 10 1.53846ZM9.23077 5.38462V9.23077H5.38462V10.7692H9.23077V14.6154H10.7692V10.7692H14.6154V9.23077H10.7692V5.38462H9.23077Z" fill="#64BC04" />
        </svg>
        <p>Nueva plantilla</p>
      </div>
    </button>
  </div>

  <!-- Tabla -->
  <div class="w-full rounded-lg overflow-auto border border-[#D6DEE5]">
    <table class="w-full table-fixed">
      <thead class="bg-[#E5F7D1]">
        <tr class="text-[#64BC04]">
          <th class="w-[60px]"></th>
          <th class="text-left px-4 py-2">Nombre</th>
          <th class="text-left px-4 py-2">Descripción</th>
          <th class="w-[100px] text-center py-2">Relaciones</th>
          <th class="w-[80px] text-center py-2">Estado</th>
          <th class="w-[60px]"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of pagedData.data"
          class="border-b border-[#D6DEE5] h-[42px] hover:bg-gray-50 cursor-pointer"
          (click)="openEditModal(t)">
          <!-- Edit icon -->
          <td class="text-center">
            <div class="flex items-center justify-center">
              <svg class="w-5 h-5 text-[#64BC04]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
              </svg>
            </div>
          </td>
          <td class="px-4 text-sm text-gray-800 font-medium">{{ t.templateName }}</td>
          <td class="px-4 text-sm text-gray-500">{{ t.description ?? '-' }}</td>
          <td class="text-center">
            <span class="bg-green-100 text-green-800 text-xs font-semibold px-2 py-0.5 rounded-full border border-green-200">
              {{ t.psssCount }}
            </span>
          </td>
          <td class="text-center">
            <span
              class="text-xs font-semibold px-2 py-0.5 rounded-full border"
              [ngClass]="t.active
                ? 'bg-green-50 text-green-700 border-green-200'
                : 'bg-red-50 text-red-600 border-red-200'">
              {{ t.active ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          <!-- Delete icon -->
          <td class="text-center">
            <div class="flex items-center justify-center">
              <button class="cursor-pointer" (click)="delete(t, $event)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M7 21C6.45 21 5.97933 20.8043 5.588 20.413C5.19667 20.0217 5.00067 19.5507 5 19V6H4V4H9V3H15V4H20V6H19V19C19 19.55 18.8043 20.021 18.413 20.413C18.0217 20.805 17.5507 21.0007 17 21H7ZM17 6H7V19H17V6ZM9 17H11V8H9V17ZM13 17H15V8H13V17Z" fill="#64BC04" />
                </svg>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="pagedData.data.length === 0">
          <td colspan="6" class="text-center py-10 text-gray-400">No hay plantillas registradas.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="flex gap-2 mt-4 justify-around w-full border border-[#D6DEE5] rounded-lg h-[30px]">
    <span># Registros: {{ pagedData.totalRecords }}</span>
    <div class="flex gap-[10px] items-center">
      <button class="cursor-pointer text-[#0086A5]" (click)="changePage(pagedData.page - 1)" [disabled]="pagedData.page === 1">«</button>
      <button
        class="cursor-pointer py-1 px-2 rounded transition-colors"
        *ngFor="let page of pages"
        (click)="changePage(page)"
        [ngClass]="{ 'bg-[#0086A5] text-white': page === pagedData.page, 'text-black hover:bg-gray-100': page !== pagedData.page }">
        {{ page }}
      </button>
      <button class="cursor-pointer text-[#0086A5]" (click)="changePage(pagedData.page + 1)" [disabled]="pagedData.page === pagedData.totalPages">»</button>
    </div>
  </div>

</div>

<!-- Modal: Crear plantilla -->
<app-base-modal *ngIf="showCreateModal" title="NUEVA PLANTILLA" width="w-[480px]" (closeModal)="showCreateModal = false">
  <div class="flex flex-col gap-4 mt-4">
    <div class="flex flex-col gap-1">
      <label class="text-[0.72rem] uppercase tracking-widest font-bold text-gray-500">Nombre *</label>
      <input
        type="text"
        [(ngModel)]="createDto.templateName"
        placeholder="Ej: Arquitectura Residencial"
        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#64bc04]"
      />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-[0.72rem] uppercase tracking-widest font-bold text-gray-500">Descripción</label>
      <textarea
        [(ngModel)]="createDto.description"
        placeholder="Descripción opcional..."
        rows="3"
        class="border border-gray-300 rounded-lg px-3 py-2 text-sm resize-none focus:outline-none focus:border-[#64bc04]"
      ></textarea>
    </div>
    <div class="flex justify-center mt-2">
      <button (click)="create()" class="w-[120px] bg-[#64BC04] py-[5px] rounded-[10px] cursor-pointer">
        <p class="text-white text-lg">Guardar</p>
      </button>
    </div>
  </div>
</app-base-modal>

<!-- Modal: Editar plantilla (asignar PSSS) -->
<app-template-edit
  *ngIf="showEditModal && selectedTemplate"
  [template]="selectedTemplate"
  (closeModal)="showEditModal = false"
  (templateUpdated)="loadTemplates(pagedData.page)"
/>
