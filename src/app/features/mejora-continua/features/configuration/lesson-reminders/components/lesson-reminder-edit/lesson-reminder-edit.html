<app-base-modal
  [title]="'EDITAR RECORDATORIO DE LECCIÓN'"
  width="w-[720px]"
  (closeModal)="closeModal.emit()"
>
  <div class="flex flex-col gap-[15px] mt-[15px]">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="flex flex-col">
        <p class="text-[#64BC04]">Trabajador</p>
        <div
          class="border border-[#D6DEE5] rounded-lg px-3 py-2 bg-gray-50 text-gray-500 cursor-not-allowed"
          [title]="item.workerFullName ?? ''"
        >
          {{ item.workerFullName }}
        </div>
      </div>
      <div class="flex flex-col">
        <p class="text-[#64BC04]">Proyecto</p>
        <app-search-select
          [options]="projects"
          valueField="projectId"
          displayField="projectDescription"
          [value]="selectedProjectId"
          (valueChange)="selectedProjectId = $event"
          [showLabel]="false"
          [allowClear]="false"
          placeholder="Seleccionar proyecto"
        ></app-search-select>
      </div>
    </div>

    <div class="flex justify-center pt-2">
      <button
        (click)="save()"
        class="w-[120px] bg-[#64BC04] py-[5px] rounded-[10px] cursor-pointer"
      >
        <p class="text-[#ffffff] text-lg">Guardar</p>
      </button>
    </div>
  </div>
</app-base-modal>
