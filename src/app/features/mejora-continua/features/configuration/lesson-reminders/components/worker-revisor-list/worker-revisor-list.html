<div class="flex flex-col gap-[20px]">
  <div class="flex items-end justify-start gap-3 flex-wrap">
    <!-- Filtro por categoría del trabajador -->
    <div class="w-[260px]">
      <app-search-select
        label="Categoría del trabajador"
        [options]="categoriaTrabajadorFilterOptions"
        valueField="id"
        displayField="name"
        [value]="categoriaTrabajadorFilter"
        (valueChange)="categoriaTrabajadorFilter = $event; onFilterChange()"
        placeholder="Todas las categorías"
      ></app-search-select>
    </div>

    <!-- Filtro por jefe asignado -->
    <div class="w-[260px]">
      <app-search-select
        label="Revisor"
        [options]="jefeFilterOptions"
        valueField="workerId"
        displayField="fullName"
        [value]="jefeFilter"
        (valueChange)="jefeFilter = $event; onFilterChange()"
        placeholder="Todos los revisores"
      ></app-search-select>
    </div>

    <!-- Filtro por categoría del revisor -->
    <div class="w-[260px]">
      <app-search-select
        label="Categoría del revisor"
        [options]="categoriaFilterOptions"
        valueField="id"
        displayField="name"
        [value]="categoriaFilter"
        (valueChange)="categoriaFilter = $event; onFilterChange()"
        placeholder="Todas las categorías"
      ></app-search-select>
    </div>

    <!-- Buscar por nombre (trabajador o jefe) -->
    <app-search-input
      placeholder="Buscar por nombre..."
      [(value)]="searchText"
      (valueChange)="onFilterChange()"
      width="280px"
    ></app-search-input>
  </div>

  <div class="w-full rounded-lg overflow-visible border border-[#D6DEE5] bg-white">
    <table class="w-full">
      <thead class="bg-[#E5F7D1]">
        <tr class="text-[#64BC04]">
          <th class="text-left px-[16px] py-[10px] font-semibold">Trabajador</th>
          <th class="text-left px-[16px] py-[10px] font-semibold">Correo</th>
          <th class="text-left px-[16px] py-[10px] font-semibold w-[320px]">Revisor</th>
          <th class="text-center px-[16px] py-[10px] font-semibold w-[130px]">Auto-aprobar</th>
          <th class="text-center px-[16px] py-[10px] font-semibold w-[160px]">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of pagedRows" class="border-b border-[#D6DEE5] hover:bg-gray-50">
          <td class="px-[16px] py-[8px] text-gray-700">{{ r.fullName }}</td>
          <td class="px-[16px] py-[8px] text-gray-700">{{ r.email }}</td>
          <td class="px-[16px] py-[8px] text-gray-700">
            <ng-container *ngIf="editingWorkerId !== r.workerId; else editJefe">
              <span *ngIf="r.jefeFullName; else sinJefe">{{ r.jefeFullName }}</span>
              <ng-template #sinJefe>
                <span class="text-gray-400 italic">Sin jefe asignado</span>
              </ng-template>
            </ng-container>
            <ng-template #editJefe>
              <app-search-select
                [options]="options"
                valueField="workerId"
                displayField="fullName"
                [value]="selectedJefeId"
                (valueChange)="selectedJefeId = $event"
                placeholder="Seleccione un jefe..."
              ></app-search-select>
            </ng-template>
          </td>
          <!-- Toggle auto-aprobar (solo si NO tiene revisor asignado) -->
          <td class="px-[16px] py-[8px] text-center">
            <button
              type="button"
              [disabled]="r.jefeWorkerId != null"
              (click)="toggleAutoApprove(r)"
              class="relative inline-flex h-5 w-9 items-center rounded-full transition-colors focus:outline-none"
              [ngClass]="
                r.jefeWorkerId != null
                  ? 'bg-gray-200 cursor-not-allowed opacity-60'
                  : (r.autoApproveLesson ? 'bg-[#64BC04] cursor-pointer' : 'bg-gray-300 cursor-pointer')
              "
              [title]="
                r.jefeWorkerId != null
                  ? 'No disponible: el trabajador tiene un revisor asignado'
                  : (r.autoApproveLesson ? 'Desactivar auto-aprobación' : 'Activar auto-aprobación')
              "
            >
              <span
                class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                [ngClass]="r.autoApproveLesson && r.jefeWorkerId == null ? 'translate-x-4' : 'translate-x-0.5'"
              ></span>
            </button>
          </td>
          <td class="px-[16px] py-[8px] text-center">
            <ng-container *ngIf="editingWorkerId !== r.workerId; else editActions">
              <button
                (click)="startEdit(r)"
                class="text-xs font-medium px-[10px] py-[4px] rounded-[6px] border border-[#64BC04] text-[#64BC04] hover:bg-[#E5F7D1] transition-colors cursor-pointer"
              >
                Editar
              </button>
            </ng-container>
            <ng-template #editActions>
              <div class="flex items-center justify-center gap-2">
                <button
                  (click)="save(r)"
                  class="text-xs font-medium px-[10px] py-[4px] rounded-[6px] border border-green-300 text-green-700 hover:bg-green-50 transition-colors cursor-pointer"
                >
                  Guardar
                </button>
                <button
                  (click)="cancelEdit()"
                  class="text-xs font-medium px-[10px] py-[4px] rounded-[6px] border border-gray-300 text-gray-600 hover:bg-gray-100 transition-colors cursor-pointer"
                >
                  Cancelar
                </button>
              </div>
            </ng-template>
          </td>
        </tr>

        <tr *ngIf="filteredRows.length === 0">
          <td colspan="5" class="px-[16px] py-[32px] text-center text-gray-400 text-sm">
            {{ searchText.trim() || jefeFilter != null || categoriaFilter != null || categoriaTrabajadorFilter != null ? 'Sin resultados.' : 'No hay trabajadores con correo @abril.pe.' }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <app-paginator
    [totalRecords]="filteredRows.length"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (pageChange)="changePage($event)"
  ></app-paginator>
</div>
