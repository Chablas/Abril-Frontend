<div class="flex flex-col gap-[20px]">
  <div class="flex items-end justify-start gap-3 flex-wrap">
    <!-- Filtro por categoría -->
    <div class="w-[220px]">
      <app-search-select
        label="Categoría"
        [options]="categoryOptions"
        valueField="value"
        displayField="label"
        [value]="categoryFilter"
        (valueChange)="categoryFilter = $event"
        placeholder="Todas las categorías"
      ></app-search-select>
    </div>

    <!-- Buscar por nombre -->
    <div
      class="flex items-center gap-2 bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-400
              focus-within:bg-white focus-within:border-[#64bc04] focus-within:shadow-[0_0_0_3px_rgba(100,188,4,0.15)] transition-all w-[280px]"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="flex-shrink-0">
        <circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" />
      </svg>
      <input
        type="text"
        placeholder="Buscar por nombre..."
        [(ngModel)]="searchText"
        class="flex-1 border-0 outline-none bg-transparent text-gray-900 text-sm"
      />
    </div>
  </div>

  <div class="w-full rounded-lg overflow-auto border border-[#D6DEE5] bg-white">
    <table class="w-full">
      <thead class="bg-[#E5F7D1]">
        <tr class="text-[#64BC04]">
          <th class="text-left px-[16px] py-[10px] font-semibold">Nombre</th>
          <th class="text-left px-[16px] py-[10px] font-semibold w-[160px]">Categoría</th>
          <th class="text-left px-[16px] py-[10px] font-semibold">Correo</th>
          <th class="text-center px-[16px] py-[10px] font-semibold w-[140px]">Estado</th>
          <th class="text-center px-[16px] py-[10px] font-semibold w-[140px]">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of filteredRows" class="border-b border-[#D6DEE5] hover:bg-gray-50">
          <td class="px-[16px] py-[8px] text-gray-700">{{ r.fullName }}</td>
          <td class="px-[16px] py-[8px] text-gray-700">{{ r.categoria }}</td>
          <td class="px-[16px] py-[8px] text-gray-700">{{ r.email }}</td>
          <td class="px-[16px] py-[8px] text-center">
            <app-status-badge
              [text]="r.active ? 'ACTIVO' : 'INACTIVO'"
              [bgColor]="r.active ? '#D7FAF4' : '#FAD5D4'"
              [textColor]="r.active ? '#009C87' : '#D30000'"
            />
          </td>
          <td class="px-[16px] py-[8px] text-center">
            <button
              (click)="toggle(r)"
              class="text-xs font-medium px-[10px] py-[4px] rounded-[6px] border transition-colors cursor-pointer"
              [ngClass]="
                r.active
                  ? 'border-red-200 text-red-600 hover:bg-red-50'
                  : 'border-green-300 text-green-700 hover:bg-green-50'
              "
            >
              {{ r.active ? 'Desactivar' : 'Activar' }}
            </button>
          </td>
        </tr>

        <tr *ngIf="filteredRows.length === 0">
          <td colspan="5" class="px-[16px] py-[32px] text-center text-gray-400 text-sm">
            {{ hasActiveFilter ? 'Sin resultados.' : 'No hay jefaturas (workers con categoría Jefe, Coordinador o Residente).' }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
