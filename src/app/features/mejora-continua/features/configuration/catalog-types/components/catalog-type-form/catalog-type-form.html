<app-base-modal [title]="title" width="w-[440px]" (closeModal)="closeModal.emit()">
  <div class="flex flex-col gap-4 mt-4">

    <!-- Nombre -->
    <div class="flex flex-col gap-1">
      <label class="text-[0.72rem] uppercase tracking-widest font-bold text-gray-500">Nombre *</label>
      <input type="text" [(ngModel)]="name" placeholder="Ej: Obras civiles"
        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#64bc04]" />
    </div>

    <!-- Activo (solo en edición) -->
    <label *ngIf="isEdit" class="flex items-center gap-2 cursor-pointer select-none">
      <input type="checkbox" [(ngModel)]="active" class="accent-[#64bc04] w-4 h-4 cursor-pointer" />
      <span class="text-sm text-gray-700 font-medium">Activo</span>
    </label>

  </div>

  <div class="flex justify-center mt-6">
    <button type="button" (click)="save()"
      class="w-[120px] bg-[#64BC04] py-[5px] rounded-[10px] cursor-pointer">
      <p class="text-white text-lg">Guardar</p>
    </button>
  </div>
</app-base-modal>
