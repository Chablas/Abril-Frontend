<div class="flex flex-col gap-6 p-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-lg font-bold text-gray-800">Tipos de Catálogo</h2>
      <p class="text-sm text-gray-500 mt-0.5">Categorías principales del catálogo de ítems</p>
    </div>
    <button type="button" (click)="openCreate()"
      class="flex items-center gap-2 bg-[#64BC04] text-white text-sm font-semibold px-4 py-2 rounded-lg cursor-pointer hover:bg-[#57a803] transition-colors">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 5v14M5 12h14" />
      </svg>
      Nuevo tipo
    </button>
  </div>

  <!-- Tabla -->
  <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
    <ng-container *ngIf="!loading; else loadingTpl">
      <ng-container *ngIf="types.length > 0; else emptyTpl">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-200">
              <th class="text-left px-5 py-3 text-[0.72rem] uppercase tracking-widest font-bold text-gray-500">
                Nombre
              </th>
              <th class="text-left px-5 py-3 text-[0.72rem] uppercase tracking-widest font-bold text-gray-500">
                Código
              </th>
              <th class="text-center px-5 py-3 text-[0.72rem] uppercase tracking-widest font-bold text-gray-500">
                Acciones
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let t of types"
              class="border-b border-gray-100 last:border-b-0 hover:bg-gray-50 transition-colors">
              <td class="px-5 py-3 font-medium text-gray-800">{{ t.catalogTypeName }}</td>
              <td class="px-5 py-3">
                <span class="font-mono text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded">
                  {{ t.catalogTypeCode }}
                </span>
              </td>
              <td class="px-5 py-3">
                <div class="flex items-center justify-center gap-1">
                  <button type="button" (click)="openEdit(t)" title="Editar"
                    class="p-1.5 rounded-lg text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                    </svg>
                  </button>
                  <button type="button" (click)="delete(t)" title="Eliminar"
                    class="p-1.5 rounded-lg text-red-500 hover:bg-red-50 transition-colors cursor-pointer">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <polyline points="3 6 5 6 21 6" />
                      <path d="M19 6l-1 14H6L5 6" />
                      <path d="M10 11v6M14 11v6" />
                      <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                    </svg>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </ng-container>

      <ng-template #emptyTpl>
        <p class="text-center text-gray-400 py-12 text-sm">No hay tipos de catálogo registrados.</p>
      </ng-template>
    </ng-container>

    <ng-template #loadingTpl>
      <p class="text-center text-gray-400 py-12 text-sm">Cargando...</p>
    </ng-template>
  </div>
</div>

<!-- Modal crear / editar -->
<app-catalog-type-form
  *ngIf="showForm"
  [editingType]="editingType"
  (closeModal)="showForm = false"
  (saved)="onSaved()"
/>
