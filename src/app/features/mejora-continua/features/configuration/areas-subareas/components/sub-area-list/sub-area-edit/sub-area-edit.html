<app-base-modal *ngIf="showEditModal" title="EDITAR SUBÁREA" width="w-[560px]" (closeModal)="closeEditModal.emit()">
    <div class="flex flex-col gap-[15px] items-center mt-[15px]">
        <div class="flex gap-[20px] w-full">
            <div class="flex flex-col flex-1">
                <p class="text-[#64BC04]">Área</p>
                <app-search-select [options]="areas" valueField="areaId" displayField="areaDescription"
                    [value]="editDto.areaId || null" (valueChange)="editDto.areaId = $event ?? 0"
                    [allowClear]="false" [showLabel]="false" placeholder="Seleccionar área">
                </app-search-select>
            </div>
            <div class="flex flex-col flex-1">
                <p class="text-[#64BC04]">Descripción</p>
                <input type="text" [(ngModel)]="editDto.subAreaDescription"
                    class="border border-[#E2E2E2] rounded-lg p-[10px]" />
            </div>
            <div class="flex flex-col">
                <p class="text-[#64BC04]">Estado</p>
                <app-search-select [options]="estadoOptions" [value]="editDto.active"
                    (valueChange)="editDto.active = $event" [allowClear]="false" [showLabel]="false">
                </app-search-select>
            </div>
        </div>
        <button (click)="save($event)" class="w-[120px] bg-[#64BC04] py-[5px] rounded-[10px] cursor-pointer">
            <p class="text-white text-lg">Guardar</p>
        </button>
    </div>
</app-base-modal>
