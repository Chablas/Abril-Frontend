<app-abril-page-header
  [badge]="'MEJORA CONTINUA · ' + anioActual"
  titulo="Configuración"
  subtitulo="Áreas, plantillas, catálogos y relaciones de lecciones aprendidas."
  [tabs]="[
    { label: 'Cronograma de Hitos', icono: 'ti-flag',             route: '/mejora-continua/milestone-schedule',      featureKey: 'mejora-continua.milestone-schedule' },
    { label: 'Dashboard',           icono: 'ti-layout-dashboard', route: '/mejora-continua/dashboard',               featureKey: 'mejora-continua.dashboard' },
    { label: 'Lecciones Aprendidas',icono: 'ti-list',             route: '/mejora-continua/lessons-learned',         featureKey: 'mejora-continua.lessons-learned' },
    { label: 'Configuración',       icono: 'ti-settings',         route: '/mejora-continua/lecciones-configuracion', featureKey: 'mejora-continua.config.lecciones-configuracion' },
    { label: 'Recordatorios',       icono: 'ti-bell',             route: '/mejora-continua/configuration/reminders', featureKey: 'mejora-continua.config.reminders' }
  ]">
</app-abril-page-header>

<div class="bg-white flex-1 overflow-y-auto p-[20px] flex flex-col gap-5">
  <app-section-tabs
    [tabs]="sectionTabs"
    [value]="activeSection"
    (valueChange)="onSectionChange($event)"
  ></app-section-tabs>

  <!-- SECCIÓN: Áreas -->
  <div *ngIf="activeSection === 'areas'">
    <app-lesson-areas></app-lesson-areas>
  </div>

  <!-- SECCIÓN: Relaciones por área -->
  <div *ngIf="activeSection === 'area-relations'">
    <app-areas></app-areas>
  </div>

  <!-- SECCIÓN: Plantillas -->
  <div *ngIf="activeSection === 'templates'">
    <app-templates></app-templates>
  </div>

  <!-- SECCIÓN: Tipos de catálogo -->
  <div *ngIf="activeSection === 'catalog-types'">
    <app-catalog-types></app-catalog-types>
  </div>

  <!-- SECCIÓN: Ítems de catálogo -->
  <div *ngIf="activeSection === 'catalog-items'">
    <app-catalog-items></app-catalog-items>
  </div>
</div>
