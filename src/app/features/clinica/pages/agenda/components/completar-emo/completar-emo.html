<app-base-modal *ngIf="open" title="Registrar Resultado EMO" width="w-[640px]" (closeModal)="close()">
  <div class="form-wrapper">
    <div class="grid-2">

      <div class="col-span-2" *ngIf="programacion">
        <div class="worker-info-box">
          <span class="worker-name">{{ programacion.workerNombre }}</span>
          <span class="worker-dni">{{ programacion.workerDni }}</span>
          <span class="badge border bg-gray-100 text-gray-600 border-gray-200">{{ programacion.tipoEmo }}</span>
        </div>
      </div>

      <!-- Aptitud -->
      <div class="col-span-2">
        <label class="field-label">Aptitud *</label>
        <select class="field-input" [(ngModel)]="aptitud">
          <option value="">Seleccionar...</option>
          <option *ngFor="let a of aptitudes" [value]="a">{{ a }}</option>
        </select>
      </div>

      <!-- N° Informe / URL -->
      <div>
        <label class="field-label">N° Informe</label>
        <input type="text" class="field-input" [(ngModel)]="numeroInforme" placeholder="Ej: INF-2025-001" />
      </div>
      <div>
        <label class="field-label">URL resultado</label>
        <input type="text" class="field-input" [(ngModel)]="urlResultado" placeholder="https://..." />
      </div>

      <!-- Fecha lectura EMO -->
      <div>
        <label class="field-label">Fecha lectura EMO</label>
        <input type="date" class="field-input" [(ngModel)]="fechaLectura" />
      </div>

      <!-- Notas -->
      <div>
        <label class="field-label">Notas</label>
        <input type="text" class="field-input" [(ngModel)]="notas" placeholder="Observaciones..." />
      </div>

      <!-- RESTRICCIONES -->
      <div class="col-span-2" *ngIf="requiereRestriccion">
        <label class="field-label">Restricciones</label>
        <div class="restriccion-row">
          <input type="text" class="field-input" [(ngModel)]="nuevaRestriccion"
            placeholder="Ej: No trabajo en altura" (keyup.enter)="agregarRestriccion()" />
          <button type="button" class="btn-ghost" (click)="agregarRestriccion()">+ Agregar</button>
        </div>
        <div *ngIf="restricciones.length > 0" class="restriccion-list">
          <div class="restriccion-item" *ngFor="let r of restricciones; let i = index">
            <span>{{ r.descripcionLibre }}</span>
            <button type="button" class="btn-remove" (click)="quitarRestriccion(i)">✕</button>
          </div>
        </div>
      </div>

      <!-- DOCUMENTOS -->
      <div class="col-span-2" *ngIf="requiereDocumentos">
        <div class="section-divider">Documentos</div>
      </div>
      <div *ngIf="requiereDocumentos">
        <label class="field-label">Constancia de Aptitud (PDF)</label>
        <input type="file" accept=".pdf" class="field-input" (change)="onArchivoAptitud($event)" />
      </div>
      <div *ngIf="requiereDocumentos">
        <label class="field-label">EMO Completo (PDF)</label>
        <input type="file" accept=".pdf" class="field-input" (change)="onArchivoEmo($event)" />
      </div>

      <!-- INTERCONSULTA -->
      <ng-container *ngIf="requiereInterconsulta">
        <div class="col-span-2">
          <div class="section-divider">Interconsulta</div>
        </div>
        <div class="col-span-2">
          <label class="field-label">Especialidad *</label>
          <input type="text" class="field-input" [(ngModel)]="icEspecialidad"
            placeholder="Ej: Cardiología, Traumatología..." />
        </div>
        <div>
          <label class="field-label">Centro de atención</label>
          <input type="text" class="field-input" [(ngModel)]="icCentro" placeholder="Clínica / Hospital..." />
        </div>
        <div>
          <label class="field-label">CIE-10</label>
          <input type="text" class="field-input" [(ngModel)]="icCie10" placeholder="Ej: M54.5" />
        </div>
        <div class="col-span-2">
          <label class="field-label">Diagnóstico</label>
          <textarea class="field-input" rows="2" [(ngModel)]="icDiagnostico" placeholder="Descripción del diagnóstico..."></textarea>
        </div>
        <div class="col-span-2">
          <label style="display:flex;align-items:center;gap:0.5rem;">
            <input type="checkbox" [(ngModel)]="icRequiereSeguimiento" />
            <span class="field-label" style="margin:0">Requiere seguimiento</span>
          </label>
        </div>
      </ng-container>

      <!-- Alertas -->
      <div class="col-span-2" *ngIf="aptitud === 'No Apto'">
        <div class="alert-box alert-red">
          ⚠ Este trabajador quedará como No Apto y será bloqueado en habilitación automáticamente.
        </div>
      </div>
      <div class="col-span-2" *ngIf="aptitud === 'Observado'">
        <div class="alert-box alert-orange">
          ⚠ Estado Observado — requiere interconsulta para definir aptitud final.
        </div>
      </div>

    </div>
    <footer class="form-footer">
      <button class="btn-ghost" (click)="close()">Cancelar</button>
      <button class="btn-primary" [disabled]="!canSubmit" (click)="submit()">
        {{ saving ? 'Guardando...' : 'Registrar resultado' }}
      </button>
    </footer>
  </div>
</app-base-modal>
