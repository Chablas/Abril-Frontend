<app-base-modal title="Programar EMO" width="w-[520px]" (closeModal)="close()">
  <div class="worker-header">
    <p class="wh-name">{{ worker.nombreCompleto }}</p>
    <p class="wh-meta">DNI {{ worker.dni }}<ng-container *ngIf="worker.empresa"> · {{ worker.empresa }}</ng-container></p>
  </div>

  <form class="form-body" (ngSubmit)="submit()">
    <div class="grid-2">
      <div>
        <label class="field-label">Fecha Programada *</label>
        <input type="date" class="field-input" [(ngModel)]="form.fechaProgramada" name="fechaProgramada" required />
      </div>

      <div>
        <label class="field-label">Tipo EMO *</label>
        <select class="field-input" [(ngModel)]="form.tipoEmoId" name="tipoEmoId" required>
          <option [value]="0" disabled>Seleccionar…</option>
          <option *ngFor="let t of tiposEmo" [value]="t.id">{{ t.nombre }}</option>
        </select>
      </div>

      <div>
        <label class="field-label">Clínica *</label>
        <select class="field-input" [(ngModel)]="form.clinicaId" name="clinicaId" required>
          <option [value]="0" disabled>Seleccionar…</option>
          <option *ngFor="let c of clinicas" [value]="c.id">{{ c.nombre }}</option>
        </select>
      </div>

      <div>
        <label class="field-label">Médico <span class="optional">(opcional)</span></label>
        <select class="field-input" [(ngModel)]="form.medicoId" name="medicoId">
          <option [value]="0">Sin especificar</option>
          <option *ngFor="let m of medicos" [value]="m.id">{{ m.apellidoNombre }}</option>
        </select>
      </div>

      <div class="col-span-2">
        <label class="field-label">Notas <span class="optional">(opcional)</span></label>
        <textarea
          class="field-input field-textarea"
          [(ngModel)]="form.notas"
          name="notas"
          rows="3"
          placeholder="Observaciones…"
        ></textarea>
      </div>
    </div>

    <div class="form-footer">
      <button type="button" class="btn-secondary" (click)="close()" [disabled]="submitting">
        Cancelar
      </button>
      <button type="submit" class="btn-primary" [disabled]="!canSubmit || submitting">
        {{ submitting ? 'Guardando…' : 'Programar EMO' }}
      </button>
    </div>
  </form>
</app-base-modal>
