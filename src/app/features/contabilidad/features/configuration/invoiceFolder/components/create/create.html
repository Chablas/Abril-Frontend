<app-base-modal [title]="'AGREGAR CARPETA DE FACTURAS'" width="w-[560px]" (closeModal)="closeModal.emit()">
  <div class="flex flex-col gap-5 mt-5">

    <!-- Nombre identificativo -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Nombre</label>
      <input
        type="text"
        [(ngModel)]="name"
        placeholder="Ej. Facturas urgentes"
        class="w-full border rounded-lg px-3 py-2.5 text-sm focus:outline-none" style="border-color:var(--color-abril-border)" />
    </div>

    <!-- Navegador de carpetas -->
    <app-invoice-folder-picker
      [linkUrl]="linkUrl"
      (linkUrlChange)="linkUrl = $event"
      (selected)="onFolderSelected($event)">
    </app-invoice-folder-picker>

    <!-- Guardar -->
    <div class="flex justify-center pt-1">
      <button (click)="save()"
        class="w-[140px] py-2 rounded-lg cursor-pointer transition-colors" style="background:var(--color-abril-primary)">
        <p class="text-white text-base font-medium text-center">Guardar</p>
      </button>
    </div>

  </div>
</app-base-modal>
