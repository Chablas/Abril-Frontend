<app-abril-page-header
  [badge]="'PROYECTOS · ' + anioActual"
  titulo="Hitos"
  subtitulo="Configuración de hitos para los cronogramas."
  [tabs]="[
    { label: 'Dashboard',              icono: 'ti-layout-dashboard', route: '/projects/projects-dashboard' },
    { label: 'Cronograma Actividades', icono: 'ti-calendar',         route: '/projects/cronograma-actividades' },
    { label: 'Cronograma de Hitos',    icono: 'ti-flag',             route: '/projects/milestone-schedule' },
    { label: 'Control de IVTs',        icono: 'ti-clipboard',        route: '/projects/technical-inspection-visit' },
    { label: 'Cuaderno de Obra',       icono: 'ti-notebook',         route: '/projects/construction-logbook' },
    { label: 'Respuesta de Informes',  icono: 'ti-file-report',      route: '/projects/report-response-control' },
    { label: 'Residentes',             icono: 'ti-users',            route: '/projects/resident-monitoring-measurement' },
    { label: 'Hitos',                  icono: 'ti-settings',         route: '/projects/configuration/milestones' }
  ]"
  [botonPrimario]="{ label: 'Nuevo hito', icono: 'ti-plus' }"
  (primaryClick)="showCreateModal = true">
</app-abril-page-header>

<div class="bg-white flex-1 overflow-y-auto p-[20px]">

    <div class="flex flex-col justify-center items-center">
        <div class="w-full rounded-lg overflow-auto border" style="border-color:var(--color-abril-border)">

            <table class="w-full table-fixed">
                <thead style="background:var(--color-abril-primary-light)">
                    <tr style="color:var(--color-abril-primary-dark)">
                        <th class="w-[50px]"></th>
                        <th class="w-[150px]">Descripción</th>
                        <th class="w-[150px]">Estado</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let item of milestones.data" class="border-b h-[30px]" style="border-color:var(--color-abril-border)">
                        <td class="text-center">
                            <div class="flex items-center justify-center">
                                <button class="cursor-pointer" (click)="openEditModal(item, $event)">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                        xmlns="http://www.w3.org/2000/svg" style="color:var(--color-abril-primary)">
                                        <path
                                            d="M14.06 9L15 9.94L5.92 19H5V18.08L14.06 9ZM17.66 3C17.41 3 17.15 3.1 16.96 3.29L15.13 5.12L18.88 8.87L20.71 7.04C21.1 6.65 21.1 6 20.71 5.63L18.37 3.29C18.17 3.09 17.92 3 17.66 3ZM14.06 6.19L3 17.25V21H6.75L17.81 9.94L14.06 6.19Z"
                                            fill="currentColor" />
                                    </svg>
                                </button>
                                <button class="cursor-pointer" (click)="deleteMilestone(item.milestoneId, $event)">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                        xmlns="http://www.w3.org/2000/svg" style="color:var(--color-abril-primary)">
                                        <path
                                            d="M7 21C6.45 21 5.97933 20.8043 5.588 20.413C5.19667 20.0217 5.00067 19.5507 5 19V6H4V4H9V3H15V4H20V6H19V19C19 19.55 18.8043 20.021 18.413 20.413C18.0217 20.805 17.5507 21.0007 17 21H7ZM17 6H7V19H17V6ZM9 17H11V8H9V17ZM13 17H15V8H13V17Z"
                                            fill="currentColor" />
                                    </svg>
                                </button>
                            </div>
                        </td>

                        <!-- Ver
                    <td class="text-center">
                        <button class="cursor-pointer" (click)="openModal(item.lessonId, $event)">
                            <svg *ngIf="item.stateDescription.toUpperCase() == 'SUBIDO'" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M15 12C15 12.7956 14.6839 13.5587 14.1213 14.1213C13.5587 14.6839 12.7956 15 12 15C11.2044 15 10.4413 14.6839 9.87868 14.1213C9.31607 13.5587 9 12.7956 9 12C9 11.2044 9.31607 10.4413 9.87868 9.87868C10.4413 9.31607 11.2044 9 12 9C12.7956 9 13.5587 9.31607 14.1213 9.87868C14.6839 10.4413 15 11.2044 15 12Z"
                                    stroke="#686971" stroke-width="1.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <path
                                    d="M2 12C3.6 7.903 7.336 5 12 5C16.664 5 20.4 7.903 22 12C20.4 16.097 16.664 19 12 19C7.336 19 3.6 16.097 2 12Z"
                                    stroke="#686971" stroke-width="1.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                    </td>
                    -->

                        <td><span [title]="item.milestoneDescription"
                                class="block line-clamp-1 text-ellipsis overflow-hidden text-center">{{
                                item.milestoneDescription }}</span></td>

                        <td class="text-center">
                            <span class="inline-block rounded-lg px-[8px] py-[2px] my-[4px]" [ngClass]="{
                              'bg-[#D7FAF4] text-[#009C87]': item.active == true,
                              'bg-[#FAD5D4] text-[#D30000]': item.active == false }">
                                {{ item.active ? 'ACTIVO' : 'INACTIVO' }}
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="flex gap-2 mt-4 justify-around w-full border rounded-lg h-[30px]" style="border-color:var(--color-abril-border)">
            <span># Registros: {{totalRecords}}</span>
            <div class="flex gap-[10px] items-center">
                <button class="cursor-pointer" style="color:var(--color-abril-accent)" (click)="prevPage()" [disabled]="currentPage === 1">
                    «
                </button>

                <button class="cursor-pointer py-1 px-2 rounded transition-colors" *ngFor="let page of pages"
                    (click)="goToPage(page)"
                    [ngClass]="{'bg-[var(--color-abril-accent)] text-white': page === currentPage, 'text-black hover:bg-gray-100': page !== currentPage }">
                    {{ page }}
                </button>

                <button class="cursor-pointer" style="color:var(--color-abril-accent)" (click)="nextPage()"
                    [disabled]="currentPage === totalPages">
                    »
                </button>
            </div>
        </div>
    </div>

    <div *ngIf="showCreateModal" class="fixed inset-0 bg-black/40 z-50 overflow-y-auto">
        <div class="absolute inset-0" (click)="closeModal($event, 0)">
        </div>
        <div class="min-h-screen flex items-center justify-center py-10">
            <div class="bg-white w-[500px] rounded-xl shadow-xl animate-modal-in relative"
                (click)="$event.stopPropagation()">
                <div class="py-[15px] px-[45px] flex flex-col gap-[15px] items-center">
                    <h1 class="text-2xl text-center">AGREGAR HITO</h1>
                    <div class="flex justify-between w-full">
                        <div class="flex flex-col">
                            <p style="color:var(--color-abril-primary)">Descripción</p>
                            <input type="text" [(ngModel)]="createDto.milestoneDescription"
                                class="border border-[#E2E2E2] rounded-lg p-[10px]" />
                        </div>
                        <div class="flex flex-col jus">
                            <p style="color:var(--color-abril-primary)">Estado</p>
                            <select [(ngModel)]="createDto.active"
                                class="w-full pl-[15px] pr-[25px] py-[10px] rounded-xl cursor-pointer" style="border:1px solid var(--color-abril-border)">
                                <option [ngValue]="true">ACTIVO</option>
                                <option [ngValue]="false">INACTIVO</option>
                            </select>
                        </div>
                    </div>
                    <button (click)="saveMilestone()" class="w-[120px] py-[5px] rounded-[10px] cursor-pointer" style="background:var(--color-abril-primary)">
                        <p class="text-[#ffffff] text-lg">Guardar</p>
                    </button>
                </div>
                <button class="absolute top-6 right-6 cursor-pointer" (click)="closeModal($event, 1)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 20L4 4M20 4L4 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--color-abril-primary)" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div *ngIf="showEditModal" class="fixed inset-0 bg-black/40 z-50 overflow-y-auto">
        <div class="absolute inset-0" (click)="closeModal($event, 0)">
        </div>
        <div class="min-h-screen flex items-center justify-center py-10">
            <div class="bg-white w-[500px] rounded-xl shadow-xl animate-modal-in relative"
                (click)="$event.stopPropagation()">
                <div class="py-[15px] px-[45px] flex flex-col gap-[15px] items-center">
                    <h1 class="text-2xl text-center">EDITAR HITO</h1>
                    <div class="flex justify-between w-full">
                        <div class="flex flex-col">
                            <p style="color:var(--color-abril-primary)">Descripción</p>
                            <input type="text" [(ngModel)]="editDto.milestoneDescription"
                                class="border border-[#E2E2E2] rounded-lg p-[10px]" />
                        </div>
                        <div class="flex flex-col jus">
                            <p style="color:var(--color-abril-primary)">Estado</p>
                            <select [(ngModel)]="editDto.active"
                                class="w-full pl-[15px] pr-[25px] py-[10px] rounded-xl cursor-pointer" style="border:1px solid var(--color-abril-border)">
                                <option [ngValue]="true">ACTIVO</option>
                                <option [ngValue]="false">INACTIVO</option>
                            </select>
                        </div>
                    </div>
                    <button (click)="editMilestone($event)"
                        class="w-[120px] py-[5px] rounded-[10px] cursor-pointer" style="background:var(--color-abril-primary)">
                        <p class="text-[#ffffff] text-lg">Guardar</p>
                    </button>
                </div>
                <button class="absolute top-6 right-6 cursor-pointer" (click)="closeModal($event, 1)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 20L4 4M20 4L4 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--color-abril-primary)" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

</div>

<div *ngIf="loader" class="loader-overlay">
    <div class="loader"></div>
</div>
