<div class="flex-1 w-full min-h-0 overflow-y-scroll rounded-lg border-t border-x" style="border-color:var(--color-abril-border)">

    <table class="w-full table-fixed">
        <thead style="background:var(--color-abril-primary-light)">
            <tr style="color:var(--color-abril-primary-dark)">
                <!--<th class="w-[50px]"></th>-->
                <th class="w-[150px]">Imagen</th>
                <th class="w-[150px]">Proyecto</th>
                <th class="w-[150px]">Descripción incidencia</th>
                <th class="w-[150px]">Estado</th>
                <th class="w-[150px]">Respuesta</th>
                <!--<th *ngIf="authService.hasRole('ADMINISTRADOR DE RESIDENTES')" class="w-[150px]">Acciones</th>-->
            </tr>
        </thead>

        <tbody>
            <tr (click)="openReportViewModal(item)" *ngFor="let item of tableData.data"
                class="cursor-pointer hover:bg-stone-100 border-b h-[30px]" style="border-color:var(--color-abril-border)">
                <!--<td class="text-center">
                    <div class="flex items-center justify-center">
                        <button class="cursor-pointer" (click)="openEditModal(item, $event)">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M14.06 9L15 9.94L5.92 19H5V18.08L14.06 9ZM17.66 3C17.41 3 17.15 3.1 16.96 3.29L15.13 5.12L18.88 8.87L20.71 7.04C21.1 6.65 21.1 6 20.71 5.63L18.37 3.29C18.17 3.09 17.92 3 17.66 3ZM14.06 6.19L3 17.25V21H6.75L17.81 9.94L14.06 6.19Z"
                                    fill="#64BC04" />
                            </svg>
                        </button>
                        <button class="cursor-pointer" (click)="deleteArea(item.areaId, $event)">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M7 21C6.45 21 5.97933 20.8043 5.588 20.413C5.19667 20.0217 5.00067 19.5507 5 19V6H4V4H9V3H15V4H20V6H19V19C19 19.55 18.8043 20.021 18.413 20.413C18.0217 20.805 17.5507 21.0007 17 21H7ZM17 6H7V19H17V6ZM9 17H11V8H9V17ZM13 17H15V8H13V17Z"
                                    fill="#64BC04" />
                            </svg>
                        </button>
                    </div>
                </td>
                -->
                <td class="text-center px-2 break-words"><img [src]="item.images[0].imageUrl" class="h-48 w-auto object-contain rounded mx-auto" /></td>

                <td><span [title]="item.projectDescription" class="block line-clamp-1 text-ellipsis overflow-hidden text-center">{{
                        item.projectDescription }}</span></td>

                <td class="px-2">
                    <span [title]="item.residentReportIncidenceDescription"
                        class="block line-clamp-8 text-ellipsis overflow-hidden text-center text-sm">
                        {{ item.residentReportIncidenceDescription }}
                    </span>
                </td>

                <td class="text-center"><span [title]="item.stateDescription" class="inline-block rounded-lg px-[8px] py-[2px] my-[4px]" [ngClass]="{
                              'bg-[#D7FAF4] text-[#009C87]': item.stateDescription == 'LEVANTADO',
                              'bg-[#FAD5D4] text-[#D30000]': item.stateDescription == 'NO LEVANTADO' }">{{
                        item.stateDescription }}</span></td>

                <td class="text-center px-2">

                    <span *ngIf="item.residentReportResponseDescriptions.length > 0" [title]="item.residentReportResponseDescriptions[0].residentReportResponseDescription"
                        class="block line-clamp-8 text-ellipsis overflow-hidden text-center text-sm">
                        {{ item.residentReportResponseDescriptions[0].residentReportResponseDescription }}
                    </span>

                    <button *ngIf="authService.hasRole(Roles.RESIDENTE) && item.residentReportResponseDescriptions.length == 0" (click)="openResponseModal(item, $event)"
                        class="py-[5px] px-[20px] rounded-lg border cursor-pointer w-[180px]" style="background:var(--color-abril-primary-light);border-color:var(--color-abril-primary);color:var(--color-abril-primary)">
                        <div class="flex items-center gap-[10px]">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:var(--color-abril-primary)">
                                <path d="M22 12C22 17.523 17.523 22 12 22H2V12C2 6.477 6.477 2 12 2C17.523 2 22 6.477 22 12Z" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M7 13L10 16L16.5 9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <p class="text-lg leading-5">Responder incidencia</p>
                        </div>
                    </button>
                    <span *ngIf="authService.hasRole(Roles.ADMINISTRADOR_RESIDENTES) && item.residentReportResponseDescriptions.length == 0" class="text-xs text-gray-400 italic">Sin respuesta</span>
                </td>
                <!--<td *ngIf="authService.hasRole('ADMINISTRADOR DE RESIDENTES')" class="text-center">
                    <button
                        class="bg-[#E5F7D1] py-[5px] px-[20px] rounded-lg border border-[#64BC04] text-[#64BC04] cursor-pointer w-[180px]">
                        <div class="flex items-center gap-[10px]">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M9.54961 17.9996L3.84961 12.2996L5.27461 10.8746L9.54961 15.1496L18.7246 5.97461L20.1496 7.39961L9.54961 17.9996Z"
                                    fill="#64BC04" />
                            </svg>

                            <p class="text-lg leading-5">Levantar incidencia</p>
                        </div>
                    </button>
                </td>-->
            </tr>
        </tbody>
    </table>
</div>

<app-report-view-modal *ngIf="showReportViewModal" [selectedIncidence]="selectedIncidence" (closeReportViewModal)="showReportViewModal = false">
</app-report-view-modal>

<app-respond-report-modal *ngIf="showResponseModal" [selectedReportIncidenceId]="selectedReportIncidenceId" (closeResponseModal)="showResponseModal = false" (loadListData)="loadListData()">
</app-respond-report-modal>
