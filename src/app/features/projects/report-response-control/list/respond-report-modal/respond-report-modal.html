<app-base-modal [title]="'RESPONDER INCIDENCIA'" [width]="'w-[500px]'" (closeModal)="closeResponseModal.emit()">

    <div class="flex flex-col items-center gap-[20px] mt-[20px]">

    <app-file-selector *ngIf="previews.length < maxImages" class="w-full"
        [color]="'var(--color-abril-standard)'" (fileSelected)="onImageSelected($event)">
    </app-file-selector>

    <p *ngIf="previews.length < maxImages" class="text-[13px] text-stone-400">o</p>

    <button *ngIf="previews.length < maxImages" (click)="openCamera()"
        class="flex items-center gap-[10px] py-[6px] px-[16px] rounded-[7px] border cursor-pointer transition-colors" style="background:var(--color-abril-standard-light);border-color:var(--color-abril-standard);color:var(--color-abril-standard)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:var(--color-abril-standard)">
            <path
                d="M12 16C13.6569 16 15 14.6569 15 13C15 11.3431 13.6569 10 12 10C10.3431 10 9 11.3431 9 13C9 14.6569 10.3431 16 12 16Z"
                stroke="currentColor" stroke-width="1.5" />
            <path
                d="M9.778 21H14.222C17.343 21 18.904 21 20.025 20.265C20.5088 19.9482 20.9254 19.5391 21.251 19.061C22 17.961 22 16.428 22 13.364C22 10.3 22 8.76705 21.251 7.66705C20.9254 7.18904 20.5088 6.77991 20.025 6.46305C19.305 5.99005 18.403 5.82105 17.022 5.76105C16.363 5.76105 15.796 5.27105 15.667 4.63605C15.5684 4.17092 15.3123 3.75408 14.9418 3.456C14.5714 3.15791 14.1095 2.99686 13.634 3.00005H10.366C9.378 3.00005 8.527 3.68505 8.333 4.63605C8.204 5.27105 7.637 5.76105 6.978 5.76105C5.598 5.82105 4.696 5.99105 3.975 6.46305C3.49154 6.78001 3.07527 7.18914 2.75 7.66705C2 8.76705 2 10.299 2 13.364C2 16.429 2 17.96 2.749 19.061C3.073 19.537 3.489 19.946 3.975 20.265C5.096 21 6.657 21 9.778 21Z"
                stroke="currentColor" stroke-width="1.5" />
            <path d="M19 10H18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>

        <p class="text-lg">Abre la cámara</p>
    </button>

    <app-image-preview *ngIf="previews.length > 0" [previews]="previews" (remove)="removeImage($event)">
    </app-image-preview>

    <app-camera-web *ngIf="showCamera" (close)="showCamera = false" (photoTaken)="onPhotoTaken($event)">
    </app-camera-web>

    <div class="flex flex-col w-full">
        <p class="text-[14px] mb-[4px]" style="color:var(--color-abril-standard)">Descripción</p>
        <textarea [(ngModel)]="createDto.residentResponseDescription"
            class="border rounded-[7px] p-[10px] text-[14px]" style="border-color:var(--color-abril-border)"></textarea>
    </div>
    <button (click)="createResponse($event)"
        class="w-[120px] py-[6px] rounded-[7px] cursor-pointer transition-colors" style="background:var(--color-abril-standard)">
        <p class="text-white text-[15px]">Guardar</p>
    </button>

    </div>
</app-base-modal>
