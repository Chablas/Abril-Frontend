<app-base-modal [title]="'AGREGAR LECCION'" width="w-[1000px]" (closeModal)="closeModal.emit()">
  <div class="flex flex-col gap-6 mt-5">

    <!-- Seccion 1: Ubicacion -->
    <div>
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3">Ubicacion</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <app-search-select label="Proyecto" [options]="filtersData.projects" valueField="projectId"
          displayField="projectDescription" [(value)]="projectId" />
        <app-search-select label="Area" [options]="filtersData.areas" valueField="areaId"
          displayField="areaDescription" [(value)]="areaId" />
      </div>
    </div>

    <div class="border-t border-gray-100"></div>

    <!-- Seccion 2: Clasificacion -->
    <div>
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3">Clasificacion</p>
      <div class="flex flex-wrap gap-4">
        <div class="flex flex-col gap-1.5 min-w-[180px]">
          <label class="text-sm text-[#64BC04] font-medium">Fase</label>
          <select [(ngModel)]="selectedPhaseId" (ngModelChange)="onPhaseChange()"
            class="px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#64BC04]/30 cursor-pointer">
            <option [ngValue]="undefined">Seleccionar</option>
            <option *ngFor="let p of phases" [ngValue]="p.phaseId">{{ p.phaseDescription }}</option>
          </select>
        </div>

        <div *ngIf="stages.length" class="flex flex-col gap-1.5 min-w-[180px]">
          <label class="text-sm text-[#64BC04] font-medium">Etapa</label>
          <select [(ngModel)]="selectedStageId" (ngModelChange)="onStageChange()"
            class="px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#64BC04]/30 cursor-pointer">
            <option [ngValue]="undefined">Seleccionar</option>
            <option *ngFor="let s of stages" [ngValue]="s.stageId">{{ s.stageDescription }}</option>
          </select>
        </div>

        <div *ngIf="layers.length" class="flex flex-col gap-1.5 min-w-[180px]">
          <label class="text-sm text-[#64BC04] font-medium">Nivel</label>
          <select [(ngModel)]="selectedLayerId" (ngModelChange)="onLayerChange()"
            class="px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#64BC04]/30 cursor-pointer">
            <option [ngValue]="undefined">Seleccionar</option>
            <option *ngFor="let l of layers" [ngValue]="l.layerId">{{ l.layerDescription }}</option>
          </select>
        </div>

        <div *ngIf="subStages.length" class="flex flex-col gap-1.5 min-w-[180px]">
          <label class="text-sm text-[#64BC04] font-medium">Subetapa</label>
          <select [(ngModel)]="selectedSubStageId" (ngModelChange)="onSubStageChange()"
            class="px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#64BC04]/30 cursor-pointer">
            <option [ngValue]="undefined">Seleccionar</option>
            <option *ngFor="let ss of subStages" [ngValue]="ss.subStageId">{{ ss.subStageDescription }}</option>
          </select>
        </div>

        <div *ngIf="subSpecialties.length" class="flex flex-col gap-1.5 min-w-[180px]">
          <label class="text-sm text-[#64BC04] font-medium">Subespecialidad</label>
          <select [(ngModel)]="selectedSubSpecialtyId"
            class="px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#64BC04]/30 cursor-pointer">
            <option [ngValue]="undefined">Seleccionar</option>
            <option *ngFor="let sp of subSpecialties" [ngValue]="sp.subSpecialtyId">{{ sp.subSpecialtyDescription }}</option>
          </select>
        </div>
      </div>
    </div>

    <div class="border-t border-gray-100"></div>

    <!-- Seccion 3: Contenido + Imagenes -->
    <div class="flex flex-col sm:flex-row gap-6">

      <!-- Izquierda: campos de texto -->
      <div class="flex-1 flex flex-col gap-4">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Contenido</p>

        <div class="flex flex-col gap-1.5">
          <label class="text-sm text-[#64BC04] font-medium">Descripcion de la observacion</label>
          <textarea [(ngModel)]="problemDescription" placeholder="Escribe aqui" rows="3"
            class="border border-gray-200 rounded-xl p-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-[#64BC04]/30"></textarea>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-sm text-[#64BC04] font-medium">Causas de la observacion</label>
          <textarea [(ngModel)]="reasonDescription" placeholder="Escribe aqui" rows="3"
            class="border border-gray-200 rounded-xl p-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-[#64BC04]/30"></textarea>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-sm text-[#64BC04] font-medium">Leccion aprendida / Propuesta de mejora</label>
          <textarea [(ngModel)]="lessonDescription" placeholder="Escribe aqui" rows="3"
            class="border border-gray-200 rounded-xl p-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-[#64BC04]/30"></textarea>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-sm text-[#64BC04] font-medium">Impacto en obra o proyecto</label>
          <textarea [(ngModel)]="impactDescription" placeholder="Escribe aqui" rows="3"
            class="border border-gray-200 rounded-xl p-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-[#64BC04]/30"></textarea>
        </div>
      </div>

      <!-- Derecha: imagenes -->
      <div class="flex-1 flex flex-col gap-6">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Imagenes adjuntas</p>

        <div class="flex flex-col gap-2">
          <label class="text-sm text-[#64BC04] font-medium">Oportunidad</label>
          <app-file-selector (fileSelected)="onFileSelected($event, 'opportunity')" />
          <app-image-preview [previews]="opportunityPreviews" (remove)="removeImage($event, 'opportunity')" />
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-sm text-[#64BC04] font-medium">Mejora</label>
          <app-file-selector (fileSelected)="onFileSelected($event, 'improvement')" />
          <app-image-preview [previews]="improvementPreviews" (remove)="removeImage($event, 'improvement')" />
        </div>
      </div>
    </div>

    <!-- Boton guardar -->
    <div class="flex justify-center pt-1">
      <button (click)="submit()"
        class="w-[160px] bg-[#64BC04] py-2 rounded-xl cursor-pointer hover:bg-[#57a803] transition-colors">
        <p class="text-white text-base font-medium text-center">Guardar</p>
      </button>
    </div>

  </div>
</app-base-modal>
