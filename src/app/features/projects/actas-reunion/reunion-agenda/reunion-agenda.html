<div class="flex-1 flex items-start justify-center pt-10 px-4">
  <div class="bg-white rounded-lg p-6 flex flex-col gap-4 w-full max-w-[560px]">

    <ng-container *ngIf="agenda">

      <!-- Agenda fija -->
      <ng-container *ngIf="agenda.agendaFija">
        <h2 class="text-base font-semibold text-[var(--color-abril-primary)]">Agenda de la reunión</h2>
        <p class="text-sm text-gray-700 whitespace-pre-line border border-[#E5EAF0] rounded-lg p-4 bg-[#F5F8FA]">{{ agenda.agendaTexto }}</p>
        <button type="button" (click)="irAReunion()"
          class="self-start text-sm text-[var(--color-abril-primary)] hover:underline">
          Ver el acta de la reunión
        </button>
      </ng-container>

      <!-- Agenda dinámica: cargar mis temas -->
      <ng-container *ngIf="!agenda.agendaFija">
        <div>
          <h2 class="text-base font-semibold text-[var(--color-abril-primary)]">Carga tus temas a tratar</h2>
          <p class="text-xs text-gray-400 mt-1">Agrégalos uno por uno. Se guardan solos al salir del campo; puedes editarlos o borrarlos hasta antes de la reunión.</p>
        </div>

        <app-mis-temas-agenda [reunionId]="reunionId" [agenda]="agenda"></app-mis-temas-agenda>

        <button type="button" (click)="irAReunion()"
          class="self-start text-sm text-[var(--color-abril-primary)] hover:underline">
          Ver el acta completa de la reunión
        </button>
      </ng-container>

    </ng-container>

  </div>
</div>
