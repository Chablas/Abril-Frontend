<div class="p-[20px] fixed inset-0 bg-black/40 z-50 overflow-y-auto">
    <div class="absolute inset-0" (click)="closeModal($event, 0)">
    </div>
    <div class="min-h-screen flex items-center justify-center py-10">
        <div class="bg-white w-[500px] rounded-xl shadow-xl animate-modal-in relative p-[20px]"
            (click)="$event.stopPropagation()">
            <div class="flex flex-col gap-[15px] items-center">
                <h1 class="text-2xl text-center">RESPONDER INCIDENCIA</h1>
                <div class="flex justify-between gap-[20px] w-full">
                    <div class="flex flex-col w-full">
                        <p class="text-[#64BC04]">Descripción</p>
                        <textarea [(ngModel)]="createDto.residentResponseDescription"
                            class="border border-[#E2E2E2] rounded-lg p-[10px] w-full" ></textarea>
                    </div>
                </div>
                <button (click)="createResponse($event)"
                    class="w-[120px] bg-[#64BC04] py-[5px] rounded-[10px] cursor-pointer">
                    <p class="text-[#ffffff] text-lg">Guardar</p>
                </button>
            </div>
            <button class="absolute top-6 right-6 cursor-pointer" (click)="closeModal($event, 1)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 20L4 4M20 4L4 20" stroke="#64BC04" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
        </div>
    </div>
</div>
