<div class="relative flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-[#64BC04] rounded-xl bg-[#F7FBF3] cursor-pointer transition-all duration-200 hover:bg-[#EEF7E6] hover:scale-[1.01]"
    (click)="opFile.click()" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)" (drop)="onDrop($event)">

    <input #opFile type="file" multiple accept=".png,.jpg,.jpeg" class="hidden" (change)="onFilesSelected($event)" />

    <svg class="w-8 h-8 text-[#64BC04] mb-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
            d="M7 16a4 4 0 01-.88-7.9A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3-3 3m3-3v12" />
    </svg>

    <p class="text-sm text-gray-600">
        Arrastra imágenes aquí o
        <span class="text-[#64BC04] font-semibold">haz clic</span>
    </p>

    <p class="text-xs text-gray-400 mt-1">
        PNG, JPG, JPEG
    </p>

</div>
