<div class="flex flex-col gap-[20px] bg-white rounded-lg p-[20px] overflow-y-clip h-[100%]">
    <div>
        <div class="flex w-full">
            <button (click)="openCreateModal($event)"
                class="bg-[#E5F7D1] py-[5px] px-[20px] rounded-lg border border-[#64BC04] text-[#64BC04] cursor-pointer">
                <div class="flex items-center gap-[10px]">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M10 0C4.48615 0 0 4.48615 0 10C0 15.5138 4.48615 20 10 20C15.5138 20 20 15.5138 20 10C20 4.48615 15.5138 0 10 0ZM10 1.53846C14.6823 1.53846 18.4615 5.31769 18.4615 10C18.4615 14.6823 14.6823 18.4615 10 18.4615C5.31769 18.4615 1.53846 14.6823 1.53846 10C1.53846 5.31769 5.31769 1.53846 10 1.53846ZM9.23077 5.38462V9.23077H5.38462V10.7692H9.23077V14.6154H10.7692V10.7692H14.6154V9.23077H10.7692V5.38462H9.23077Z"
                            fill="#64BC04" />
                    </svg>
                    <p>Nuevo registro</p>
                </div>
            </button>
        </div>
    </div>

    <div class="flex h-[90%] gap-[20px]">
        <div class="flex flex-1 flex-col items-start">
            <div class="w-full rounded-lg overflow-hidden border border-[#D6DEE5]">

                <table class="w-full table-fixed">
                    <thead class="bg-[#E5F7D1]">
                        <tr class="text-[#64BC04]">
                            <th class="w-[10px]"></th>
                            <th class="w-[50px]">Nombre archivo</th>
                            <!--<th class="w-[150px]">Estado</th>-->
                        </tr>
                    </thead>

                    <tbody>
                        
                        <tr *ngFor="let item of tableComponentData.tableData" class="border-b border-[#D6DEE5] h-[30px]">
                            <td class="text-center">
                                <div class="flex items-center justify-center">
                                    <button class="cursor-pointer" (click)="showPdf($event, item.fileUrl)" >
                                        <svg width="22" height="16" viewBox="0 0 22 16" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path
                                                d="M13.75 7.75C13.75 8.54565 13.4339 9.30871 12.8713 9.87132C12.3087 10.4339 11.5456 10.75 10.75 10.75C9.95435 10.75 9.19129 10.4339 8.62868 9.87132C8.06607 9.30871 7.75 8.54565 7.75 7.75C7.75 6.95435 8.06607 6.19129 8.62868 5.62868C9.19129 5.06607 9.95435 4.75 10.75 4.75C11.5456 4.75 12.3087 5.06607 12.8713 5.62868C13.4339 6.19129 13.75 6.95435 13.75 7.75Z"
                                                stroke="#64BC04" stroke-width="1.5" stroke-linecap="round"
                                                stroke-linejoin="round" />
                                            <path
                                                d="M0.75 7.75C2.35 3.653 6.086 0.75 10.75 0.75C15.414 0.75 19.15 3.653 20.75 7.75C19.15 11.847 15.414 14.75 10.75 14.75C6.086 14.75 2.35 11.847 0.75 7.75Z"
                                                stroke="#64BC04" stroke-width="1.5" stroke-linecap="round"
                                                stroke-linejoin="round" />
                                        </svg>
                                    </button>
                                    <a [href]="item.fileUrl" target="_blank">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M13.9991 4H18.5891L11.2891 11.29L12.7091 12.71L19.9991 5.41V10H21.9991V2H13.9991V4Z" fill="#64BC04" />
                                            <path d="M12 5V3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V12H19V19H5V5H12Z"
                                                fill="#64BC04" />
                                        </svg>
                                    </a>
                                </div>
                            </td>

                            <!-- Ver 
                    <td class="text-center">
                        <button class="cursor-pointer" (click)="openModal(item.lessonId, $event)">
                            <svg *ngIf="item.stateDescription.toUpperCase() == 'SUBIDO'" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M15 12C15 12.7956 14.6839 13.5587 14.1213 14.1213C13.5587 14.6839 12.7956 15 12 15C11.2044 15 10.4413 14.6839 9.87868 14.1213C9.31607 13.5587 9 12.7956 9 12C9 11.2044 9.31607 10.4413 9.87868 9.87868C10.4413 9.31607 11.2044 9 12 9C12.7956 9 13.5587 9.31607 14.1213 9.87868C14.6839 10.4413 15 11.2044 15 12Z"
                                    stroke="#686971" stroke-width="1.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <path
                                    d="M2 12C3.6 7.903 7.336 5 12 5C16.664 5 20.4 7.903 22 12C20.4 16.097 16.664 19 12 19C7.336 19 3.6 16.097 2 12Z"
                                    stroke="#686971" stroke-width="1.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                    </td>
                    -->

                            <td><span [title]="item.fileDescription"
                                    class="block line-clamp-1 text-ellipsis overflow-hidden text-center">{{
                                    item.fileDescription }}</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="flex gap-2 mt-4 justify-around w-full border border-[#D6DEE5] rounded-lg h-[30px]">
                <span># Registros: {{totalRecords}}</span>
                <div class="flex gap-[10px] items-center">
                    <button class="cursor-pointer text-[#0086A5]" (click)="prevPage()" [disabled]="currentPage === 1">
                        «
                    </button>

                    <button class="cursor-pointer py-1 px-2 rounded transition-colors" *ngFor="let page of pages"
                        (click)="goToPage(page)"
                        [ngClass]="{'bg-[#0086A5] text-white': page === currentPage, 'text-black hover:bg-gray-100': page !== currentPage }">
                        {{ page }}
                    </button>

                    <button class="cursor-pointer text-[#0086A5]" (click)="nextPage()"
                        [disabled]="currentPage === totalPages">
                        »
                    </button>
                </div>
            </div>
        </div>
        <div [ngClass]="{
            'visible': tableComponentData.iframeUrl,
            'invisible': !tableComponentData.iframeUrl
          }" class="flex-2 h-full">
            <iframe *ngIf="tableComponentData.iframeUrl" class="w-full h-full" [src]="tableComponentData.iframeUrl"></iframe>
        </div>
    </div>

    <div *ngIf="showCreateModal" class="fixed inset-0 bg-black/40 z-50 overflow-y-auto">
        <div class="absolute inset-0" (click)="closeModal($event, 0)">
        </div>
        <div class="min-h-screen flex items-center justify-center py-10">
            <div class="bg-white w-[800px] rounded-xl shadow-xl animate-modal-in relative"
                (click)="$event.stopPropagation()">
                <div class="py-[15px] px-[45px] flex flex-col gap-[15px] items-center">
                    <h1 class="text-2xl text-center">AGREGAR IVT</h1>
                    <div class="flex justify-between w-full gap-[20px]">
                        <div class="flex flex-col flex-2">
                            <p class="text-[#64BC04]">Archivo</p>
                            <div *ngIf="createModalData.showImageAdder" class="relative flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-[#64BC04] rounded-xl bg-[#F7FBF3] cursor-pointer transition-all duration-200 hover:bg-[#EEF7E6] hover:scale-[1.01]"
                                (click)="opFile.click()">
                                <input #opFile type="file" class="hidden" (change)="onFileSelected($event)" 
                                    (dragover)="onDragOver($event)"
                                    (dragleave)="onDragLeave($event)"
                                    (drop)="onDrop($event)"
                                required />
                        
                                <svg class="w-8 h-8 text-[#64BC04] mb-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M7 16a4 4 0 01-.88-7.9A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3-3 3m3-3v12" />
                                </svg>
                        
                                <p class="text-sm text-gray-600">
                                    Arrastra un archivo aquí o
                                    <span class="text-[#64BC04] font-semibold">Haz clic</span>
                                </p>
                                <p class="text-xs text-gray-400 mt-1">PDF</p>
                            </div>
                            <div *ngIf="createModalData.selectedFileName"
                                class="w-full bg-white border border-[#64BC04] rounded-lg p-3 flex items-center justify-between shadow-sm"
                                [ngClass]="{'mt-3': createModalData.showImageAdder}"
                                >
                            
                                <div class="flex items-center gap-3">
                            
                                    <!-- Icono PDF -->
                                    <svg class="min-w-8 min-h-8 w-8 h-8 text-red-500" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M6 2h9l5 5v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" />
                                    </svg>
                            
                                    <div>
                                        <p class="text-sm font-semibold text-gray-700">
                                            {{ createModalData.selectedFileName }}
                                        </p>
                                        <p class="text-xs text-gray-400">
                                            {{ createModalData.selectedFileSize }}
                                        </p>
                                    </div>
                            
                                </div>
                            
                                <!-- Botón eliminar -->
                                <button type="button" class="text-red-500 cursor-pointer hover:text-red-700 text-sm font-semibold" (click)="removeFile()">
                                    Quitar
                                </button>
                            
                            </div>
                        </div>
                        <div class="flex-1">
                            <p class="text-[#64BC04]">Proyecto</p>
                            <select [(ngModel)]="createModalData.createDto.scheduleId" class="w-full pl-[15px] pr-[25px] py-[6px] border border-[#D6DEE5] rounded-xl select-wrapper cursor-pointer">
                                <option [ngValue]="0">Seleccionar</option>
                                <option *ngFor="let item of createModalData.projectOptions" [ngValue]="item.scheduleId">{{item.projectDescription}}</option>
                            </select>
                        </div>
                    </div>
                    <button (click)="saveIvtControl()" class="w-[120px] bg-[#64BC04] py-[5px] rounded-[10px] cursor-pointer">
                        <p class="text-[#ffffff] text-lg">Guardar</p>
                    </button>
                </div>
                <button class="absolute top-6 right-6 cursor-pointer" (click)="closeModal($event, 1)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 20L4 4M20 4L4 20" stroke="#64BC04" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

</div>

<div *ngIf="loader" class="loader-overlay">
    <div class="loader"></div>
</div>
