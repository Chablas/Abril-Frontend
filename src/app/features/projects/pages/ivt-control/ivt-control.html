                </table>
            </div>
            <div class="flex gap-2 mt-4 justify-around w-full border border-[#D6DEE5] rounded-lg h-[30px]">
                <span># Registros: {{totalRecords}}</span>
                <div class="flex gap-[10px] items-center">
                    <button class="cursor-pointer text-[#0086A5]" (click)="prevPage()" [disabled]="currentPage === 1">
                        «
                    </button>

                    <button class="cursor-pointer py-1 px-2 rounded transition-colors" *ngFor="let page of pages"
                        (click)="goToPage(page)"
                        [ngClass]="{'bg-[#0086A5] text-white': page === currentPage, 'text-black hover:bg-gray-100': page !== currentPage }">
                        {{ page }}
                    </button>

                    <button class="cursor-pointer text-[#0086A5]" (click)="nextPage()"
                        [disabled]="currentPage === totalPages">
                        »
                    </button>
                </div>
            </div>
        </div>
        <iframe class="flex-2 h-full" src="https://abrilbackendstorage.blob.core.windows.net/control-de-ivts/INFORME%20TECNICO,%20EXP%202675-2025,%20CAMPITELLI%20INMIBILIARIA%20SAC,%20VISITA%20No%2025%20DE%2047,%20FECHA%2010.12.2025.pdf"></iframe>
    </div>

    <div *ngIf="showCreateModal" class="fixed inset-0 bg-black/40 z-50 overflow-y-auto">
        <div class="absolute inset-0" (click)="closeModal($event, 0)">
        </div>
        <div class="min-h-screen flex items-center justify-center py-10">
            <div class="bg-white w-[500px] rounded-xl shadow-xl animate-modal-in relative"
                (click)="$event.stopPropagation()">
                <div class="py-[15px] px-[45px] flex flex-col gap-[15px] items-center">
                    <h1 class="text-2xl text-center">AGREGAR IVT</h1>
                    <div class="flex justify-between w-full">
                        <div class="flex flex-col">
                            <p class="text-[#64BC04]">Archivo</p>
                            <input type="file" [(ngModel)]="createModalData.createDto.pdf"
                                class="border border-[#E2E2E2] rounded-lg p-[10px]" />
                        </div>
                        <div>
                            <p class="text-[#64BC04]">Proyecto</p>
                            <select [(ngModel)]="createModalData.createDto.scheduleId">
                                <option *ngFor="let item of createModalData.projectOptions" [ngValue]="item.projectId">{{item.projectDescription}}</option>
                            </select>
                        </div>
                    </div>
                    <button (click)="saveIvtControl()" class="w-[120px] bg-[#64BC04] py-[5px] rounded-[10px] cursor-pointer">
                        <p class="text-[#ffffff] text-lg">Guardar</p>
                    </button>
                </div>
                <button class="absolute top-6 right-6 cursor-pointer" (click)="closeModal($event, 1)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 20L4 4M20 4L4 20" stroke="#64BC04" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

</div>

<div *ngIf="loader" class="loader-overlay">
    <div class="loader"></div>
</div>
