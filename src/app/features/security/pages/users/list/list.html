<div class="space-y-3">
  <div class="filters-card">
    <div>
      <label class="filter-label">Buscar por nombre</label>
      <div class="search-input">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7" />
          <path d="M21 21l-4.3-4.3" />
        </svg>
        <input type="text" placeholder="Nombre completo" [(ngModel)]="searchTerm" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>DNI</th>
            <th>Nombre completo</th>
            <th>Rol</th>
            <th>Correo</th>
            <th>Estado</th>
            <th class="text-right">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of filteredData">
            <td>{{ item.person.documentIdentityCode }}</td>
            <td class="font-semibold">{{ item.person.fullName }}</td>
            <td>{{ getRolesText(item.roles) }}</td>
            <td>{{ item.person.email }}</td>
            <td>
              <span class="badge border" [ngClass]="item.active ? 'chip-green' : 'chip-gray'">
                {{ item.active ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td>
              <div class="row-actions">
                <button type="button" class="btn-chip chip-blue" (click)="openEdit(item, $event)">
                  Editar
                </button>
                <button
                  type="button"
                  class="btn-chip"
                  [ngClass]="item.active ? 'chip-orange' : 'chip-green'"
                  (click)="toggleUser(item, $event)"
                >
                  {{ item.active ? 'Desactivar' : 'Activar' }}
                </button>
                <button type="button" class="btn-chip chip-gray" title="Reenviar correo de registro" (click)="resendEmail(item, $event)">
                  Reenviar
                </button>
              </div>
            </td>
          </tr>
          <tr *ngIf="filteredData.length === 0">
            <td colspan="6" class="empty-row">Sin usuarios registrados.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
