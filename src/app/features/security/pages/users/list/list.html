<div class="w-full rounded-lg overflow-y-scroll overflow-x-auto border border-[#D6DEE5]">
  <table class="w-full table-auto">
    <thead class="bg-[#E5F7D1]">
      <tr class="text-[#64BC04]">
        <th class="w-[20%]">DNI</th>
        <th class="w-[20%]">Nombre completo</th>
        <th class="w-[20%]">Rol</th>
        <th class="w-[20%]">Correo</th>
        <th class="w-[20%]">Estado</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of tableData.data" class="border-b border-[#D6DEE5] h-[30px]">
        <td><span [title]="item.person.documentIdentityCode" class="block line-clamp-1 text-ellipsis overflow-hidden text-center">{{ item.person.documentIdentityCode }}</span></td>
        <td><span [title]="item.person.fullName" class="block line-clamp-1 text-ellipsis overflow-hidden text-center">{{ item.person.fullName }}</span></td>
        <td>
          <span [title]="getRolesText(item.roles)" class="block line-clamp-1 text-ellipsis overflow-hidden text-center">
            {{ getRolesText(item.roles) }}
          </span>
        </td>
        <td><span [title]="item.person.email" class="block line-clamp-1 text-ellipsis overflow-hidden text-center">{{ item.person.email }}</span></td>
        <td class="text-center">
          <span
            class="inline-block rounded-lg px-[8px] py-[2px] my-[4px]"
            [ngClass]="{
              'bg-[#D7FAF4] text-[#009C87]': item.active == true,
              'bg-[#FAD5D4] text-[#D30000]': item.active == false,
            }"
          >
            {{ item.active ? 'ACTIVO' : 'INACTIVO' }}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
