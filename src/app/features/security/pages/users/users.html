<app-abril-page-header
  badge="SEGURIDAD"
  titulo="Usuarios"
  subtitulo="Administración de usuarios y accesos al sistema."
  [tabs]="[
    { label: 'Usuarios', icono: 'ti-users', route: '/security/users', featureKey: 'security.users' },
    { label: 'Roles', icono: 'ti-shield', route: '/security/roles', featureKey: 'security.roles' }
  ]"
  [botonSecundario]="{ label: 'Crear usuario para trabajador de Abril', icono: 'ti-id-badge-2' }"
  [botonPrimario]="{ label: 'Crear usuario para persona externa', icono: 'ti-plus' }"
  (secondaryClick)="showAbrilWorkerModal = true"
  (primaryClick)="showCreateModal = true">
</app-abril-page-header>

<div class="flex-1 min-h-0 bg-white rounded-lg p-[20px]">
  <div class="flex flex-col justify-center items-center">
    <app-user-list
      class="w-full"
      (pagedData)="updatePagination($event)"
      (editUser)="openEditForm($event)"
      (userToggled)="reloadUsers()"
      (userDeleted)="reloadUsers()"
    ></app-user-list>
    <app-paginator
      class="w-full"
      [totalRecords]="totalRecords"
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      (pageChange)="changePage($event)"
    ></app-paginator>
  </div>
</div>

<app-user-create
  *ngIf="showCreateModal"
  (closeModal)="showCreateModal = false"
  (userCreated)="reloadUsers()"
></app-user-create>

<app-abril-worker-create
  *ngIf="showAbrilWorkerModal"
  (closeModal)="showAbrilWorkerModal = false"
  (userCreated)="reloadUsers()"
></app-abril-worker-create>

<app-user-edit-form
  *ngIf="formOpen"
  [open]="formOpen"
  [initial]="formUser"
  (closed)="formOpen = false"
  (saved)="onEditSaved()"
></app-user-edit-form>
