<app-base-modal [title]="'NUEVO TRAYECTO'" width="w-[520px]" (closeModal)="closeModal.emit()">

  <div class="flex flex-col gap-[16px] mt-[16px]">

    <div class="flex flex-col gap-[4px]">
      <app-search-select
        label="Lugar de origen"
        [options]="lugares"
        valueField="id"
        displayField="nombreDisplay"
        [(value)]="lugarOrigenId" />
      <p *ngIf="submitted && !lugarOrigenId" class="text-xs text-red-500">Campo requerido</p>
    </div>

    <div class="flex flex-col gap-[4px]">
      <app-search-select
        label="Lugar de destino"
        [options]="lugares"
        valueField="id"
        displayField="nombreDisplay"
        [(value)]="lugarDestinoId" />
      <p *ngIf="submitted && !lugarDestinoId" class="text-xs text-red-500">Campo requerido</p>
      <p *ngIf="submitted && mismosLugares" class="text-xs text-red-500">El destino no puede ser igual al origen</p>
    </div>

    <div class="flex flex-col gap-[4px]">
      <label class="text-sm text-[#64BC04] font-medium">Monto (S/)</label>
      <input
        type="number"
        step="0.01"
        min="0"
        placeholder="0.00"
        [(ngModel)]="monto"
        class="border border-[#E2E2E2] rounded-[8px] px-[12px] py-[10px] text-sm text-gray-700 focus:outline-none focus:border-[#64BC04]" />
      <p *ngIf="submitted && (monto === null || monto < 0)" class="text-xs text-red-500">Ingresa un monto válido</p>
    </div>

    <div class="flex justify-center pt-[4px]">
      <button
        (click)="save()"
        class="w-[200px] bg-[#64BC04] py-[8px] rounded-[10px] cursor-pointer hover:bg-[#57a803] transition-colors">
        <p class="text-white text-base font-medium text-center">Guardar</p>
      </button>
    </div>

  </div>

</app-base-modal>
