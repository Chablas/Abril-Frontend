<app-base-modal [title]="'NUEVO TRAYECTO'" width="w-[520px]" (closeModal)="closeModal.emit()">

  <div class="flex flex-col gap-[16px] mt-[16px]">

    <div class="flex flex-col gap-[4px]">
      <app-search-select
        label="Lugar de origen"
        [options]="lugares"
        valueField="id"
        displayField="nombreDisplay"
        [(value)]="lugarOrigenId" />
      <p *ngIf="submitted && !lugarOrigenId" class="text-xs text-red-500">Campo requerido</p>
    </div>

    <div class="flex flex-col gap-[4px]">
      <app-search-select
        label="Lugar de destino"
        [options]="lugares"
        valueField="id"
        displayField="nombreDisplay"
        [(value)]="lugarDestinoId" />
      <p *ngIf="submitted && !lugarDestinoId" class="text-xs text-red-500">Campo requerido</p>
      <p *ngIf="submitted && mismosLugares" class="text-xs text-red-500">El destino no puede ser igual al origen</p>
    </div>

    <div class="flex flex-col gap-[4px]">
      <label class="text-sm font-medium" style="color:var(--color-abril-primary)">Monto (S/)</label>
      <input
        type="number"
        step="0.01"
        min="0"
        placeholder="0.00"
        [(ngModel)]="monto"
        class="border border-[#E2E2E2] rounded-[8px] px-[12px] py-[10px] text-sm text-gray-700 focus:outline-none" />
      <p *ngIf="submitted && (monto === null || monto < 0)" class="text-xs text-red-500">Ingresa un monto válido</p>
    </div>

    <label class="flex items-start gap-[8px] cursor-pointer select-none w-fit">
      <input
        type="checkbox"
        class="w-4 h-4 mt-[2px] cursor-pointer"
        style="accent-color:var(--color-abril-primary)"
        [(ngModel)]="esReembolsable" />
      <span class="flex flex-col">
        <span class="text-sm text-gray-700">Reembolsable</span>
        <span class="text-xs text-gray-400">Desmarcado, las salidas por este trayecto no generan reembolso aunque el motivo elegido sí lo permita.</span>
      </span>
    </label>

    <div class="flex justify-center pt-[4px]">
      <button
        (click)="save()"
        class="w-[200px] py-[8px] rounded-[10px] cursor-pointer transition-colors"
        style="background:var(--color-abril-primary)">
        <p class="text-white text-base font-medium text-center">Guardar</p>
      </button>
    </div>

  </div>

</app-base-modal>
