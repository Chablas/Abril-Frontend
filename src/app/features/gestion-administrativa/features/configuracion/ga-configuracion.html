<app-abril-page-header
  badge="GESTIÓN ADMINISTRATIVA · CONFIGURACIÓN"
  titulo="Configuración"
  [subtitulo]="subtitulo"
  [tabs]="[
    { label: 'Solicitud de Salidas', icono: 'ti-file-text', route: '/gestion-administrativa/solicitud-salidas', featureKey: 'gestion-administrativa.solicitud-salidas' },
    { label: 'Gestión de Salidas',   icono: 'ti-briefcase', route: '/gestion-administrativa/gestion-salidas',   featureKey: 'gestion-administrativa.gestion-salidas' },
    { label: 'Delegación de Revisión', icono: 'ti-user-check', route: '/gestion-administrativa/delegacion-revision', featureKey: 'gestion-administrativa.delegacion-revision' },
    { label: 'Configuración',        icono: 'ti-settings',  route: '/gestion-administrativa/configuracion',     featureKeys: ['gestion-administrativa.config.lugares','gestion-administrativa.config.motivos','gestion-administrativa.config.trayectos','gestion-administrativa.config.revisor-salidas','gestion-administrativa.config.revisores-areas','gestion-administrativa.config.visibilidad-salidas','gestion-administrativa.config.carpeta-adjuntos'] }
  ]"
  [botonPrimario]="botonPrimario"
  (primaryClick)="onCreate()">

  <!-- Botón "Filtros" estándar: se proyecta a la altura de las pestañas y
       delega en el modal de filtros de la sección activa. -->
  <app-filter-trigger tabsExtra [count]="filtrosActivos" (open)="onOpenFilters()" />
</app-abril-page-header>

<div class="page-container flex flex-col gap-[10px] bg-white flex-1 min-h-0 overflow-hidden">
  <app-section-tabs
    class="shrink-0"
    [tabs]="sectionTabs"
    [value]="activeSection"
    color="var(--color-abril-primary)"
    (valueChange)="onSectionChange($event)">
  </app-section-tabs>

  <!-- SECCIÓN: Lugares -->
  <app-ga-lugares *ngIf="activeSection === 'lugares'"></app-ga-lugares>

  <!-- SECCIÓN: Motivos -->
  <app-ga-motivos *ngIf="activeSection === 'motivos'"></app-ga-motivos>

  <!-- SECCIÓN: Trayectos -->
  <app-ga-trayectos *ngIf="activeSection === 'trayectos'"></app-ga-trayectos>

  <!-- SECCIÓN: Revisores de Trabajadores -->
  <app-revisor-salidas *ngIf="activeSection === 'revisor-salidas'"></app-revisor-salidas>

  <!-- SECCIÓN: Revisores de Áreas -->
  <app-revisores-areas *ngIf="activeSection === 'revisores-areas'"></app-revisores-areas>

  <!-- SECCIÓN: Visibilidad de Salidas -->
  <app-visibilidad-salidas *ngIf="activeSection === 'visibilidad-salidas'"></app-visibilidad-salidas>

  <!-- SECCIÓN: Carpeta Adjuntos -->
  <app-ga-carpeta-adjuntos *ngIf="activeSection === 'carpeta-adjuntos'"></app-ga-carpeta-adjuntos>
</div>
