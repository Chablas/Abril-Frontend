<app-abril-page-header
  [badge]="'GESTIÓN ADMINISTRATIVA · ' + anioActual"
  titulo="Lugares"
  subtitulo="Lugares de origen y destino disponibles para solicitudes."
  [tabs]="[
    { label: 'Solicitud de Salidas', icono: 'ti-file-text',    route: '/gestion-administrativa/solicitud-salidas' },
    { label: 'Gestión de Salidas',   icono: 'ti-briefcase',    route: '/gestion-administrativa/gestion-salidas' },
    { label: 'Lugares',              icono: 'ti-map-pin',      route: '/gestion-administrativa/configuracion/lugares' },
    { label: 'Motivos',              icono: 'ti-list-details', route: '/gestion-administrativa/configuracion/motivos' },
    { label: 'Trayectos',            icono: 'ti-route',        route: '/gestion-administrativa/configuracion/trayectos' }
  ]"
  [botonPrimario]="{ label: 'Nuevo lugar fijo', icono: 'ti-plus' }"
  (primaryClick)="showCreateModal = true">
</app-abril-page-header>

<div class="flex flex-col gap-[20px] bg-white p-[20px] flex-1 overflow-y-auto">

  <!-- ── Tabla ─────────────────────────────────────────────────────────── -->
  <div class="w-full rounded-lg overflow-auto border-t border-x" style="border-color:var(--color-abril-border)">
    <table class="w-full text-sm">
      <thead style="background:var(--color-abril-primary-light)">
        <tr style="color:var(--color-abril-primary-dark)">
          <th class="text-left px-[16px] py-[10px] font-semibold">Tipo</th>
          <th class="text-left px-[16px] py-[10px] font-semibold">Nombre</th>
          <th class="text-center px-[16px] py-[10px] font-semibold">Estado</th>
          <th class="text-center px-[16px] py-[10px] font-semibold">Acciones</th>
        </tr>
      </thead>
      <tbody>

        <!-- ── Lugares fijos ───────────────────────────────────────────── -->
        <tr *ngIf="fijos.length > 0">
          <td colspan="4"
              class="px-[16px] py-[6px] text-xs font-semibold text-gray-400 uppercase tracking-wider bg-gray-50 border-b" style="border-color:var(--color-abril-border)">
            Lugares fijos
          </td>
        </tr>
        <tr *ngFor="let l of fijos" class="border-b hover:bg-gray-50" style="border-color:var(--color-abril-border)">
          <td class="px-[16px] py-[10px]">
            <span class="inline-block px-[8px] py-[2px] rounded-full text-xs font-semibold bg-gray-100 text-gray-600">
              Fijo
            </span>
          </td>
          <td class="px-[16px] py-[10px] text-gray-700">{{ l.nombreDisplay }}</td>
          <td class="px-[16px] py-[10px] text-center">
            <app-status-badge
              [text]="l.activo ? 'ACTIVO' : 'INACTIVO'"
              [bgColor]="l.activo ? '#D7FAF4' : '#FAD5D4'"
              [textColor]="l.activo ? '#009C87' : '#D30000'" />
          </td>
          <td class="px-[16px] py-[10px] text-center">
            <div class="flex items-center justify-center gap-[10px]">
              <button
                (click)="toggle(l)"
                class="text-xs font-medium px-[10px] py-[4px] rounded-[6px] border transition-colors cursor-pointer"
                [ngClass]="l.activo
                  ? 'border-red-200 text-red-600 hover:bg-red-50'
                  : 'border-green-300 text-green-700 hover:bg-green-50'">
                {{ l.activo ? 'Desactivar' : 'Activar' }}
              </button>
              <button
                (click)="openEdit(l)"
                class="text-xs font-medium transition-colors cursor-pointer" style="color:var(--color-abril-primary)">
                Editar
              </button>
            </div>
          </td>
        </tr>

        <!-- ── Proyectos ───────────────────────────────────────────────── -->
        <tr *ngIf="proyectos.length > 0">
          <td colspan="4"
              class="px-[16px] py-[6px] text-xs font-semibold text-gray-400 uppercase tracking-wider bg-gray-50 border-b" style="border-color:var(--color-abril-border)">
            Proyectos
          </td>
        </tr>
        <tr *ngFor="let l of proyectos" class="border-b hover:bg-gray-50" style="border-color:var(--color-abril-border)">
          <td class="px-[16px] py-[10px]">
            <span class="inline-block px-[8px] py-[2px] rounded-full text-xs font-semibold bg-blue-100 text-blue-700">
              Proyecto
            </span>
          </td>
          <td class="px-[16px] py-[10px] text-gray-700">{{ l.nombreDisplay }}</td>
          <td class="px-[16px] py-[10px] text-center">
            <app-status-badge
              [text]="l.activo ? 'ACTIVO' : 'INACTIVO'"
              [bgColor]="l.activo ? '#D7FAF4' : '#FAD5D4'"
              [textColor]="l.activo ? '#009C87' : '#D30000'" />
          </td>
          <td class="px-[16px] py-[10px] text-center">
            <button
              (click)="toggle(l)"
              class="text-xs font-medium px-[10px] py-[4px] rounded-[6px] border transition-colors cursor-pointer"
              [ngClass]="l.activo
                ? 'border-red-200 text-red-600 hover:bg-red-50'
                : 'border-green-300 text-green-700 hover:bg-green-50'">
              {{ l.activo ? 'Desactivar' : 'Activar' }}
            </button>
          </td>
        </tr>

        <!-- Vacío -->
        <tr *ngIf="lugares.length === 0">
          <td colspan="4" class="px-[16px] py-[32px] text-center text-gray-400 text-sm">
            No hay lugares registrados.
          </td>
        </tr>

      </tbody>
    </table>
  </div>

</div>

<!-- ── Modales (fuera del card) ──────────────────────────────────────── -->
<app-ga-lugar-create
  *ngIf="showCreateModal"
  (closeModal)="showCreateModal = false"
  (saved)="load()" />

<app-ga-lugar-edit
  *ngIf="showEditModal && lugarToEdit"
  [lugar]="lugarToEdit!"
  (closeModal)="showEditModal = false; lugarToEdit = null"
  (saved)="load()" />
