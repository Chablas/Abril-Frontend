<app-abril-page-header
  [badge]="'GESTIÓN ADMINISTRATIVA · ' + anioActual"
  titulo="Motivos de Salida"
  subtitulo="Motivos de salida habilitados para los trabajadores."
  [tabs]="[
    { label: 'Solicitud de Salidas', icono: 'ti-file-text',    route: '/gestion-administrativa/solicitud-salidas',   featureKey: 'gestion-administrativa.solicitud-salidas' },
    { label: 'Gestión de Salidas',   icono: 'ti-briefcase',    route: '/gestion-administrativa/gestion-salidas',     featureKey: 'gestion-administrativa.gestion-salidas' },
    { label: 'Lugares',              icono: 'ti-map-pin',      route: '/gestion-administrativa/configuracion/lugares',   featureKey: 'gestion-administrativa.config.lugares' },
    { label: 'Motivos',              icono: 'ti-list-details', route: '/gestion-administrativa/configuracion/motivos',   featureKey: 'gestion-administrativa.config.motivos' },
    { label: 'Trayectos',            icono: 'ti-route',        route: '/gestion-administrativa/configuracion/trayectos', featureKey: 'gestion-administrativa.config.trayectos' },
    { label: 'Revisor de Salidas',   icono: 'ti-user-check',   route: '/gestion-administrativa/configuracion/revisor-salidas', featureKey: 'gestion-administrativa.config.revisor-salidas' },
    { label: 'Visibilidad',          icono: 'ti-eye',          route: '/gestion-administrativa/configuracion/visibilidad-salidas', featureKey: 'gestion-administrativa.config.visibilidad-salidas' }
  ]"
  [botonPrimario]="{ label: 'Nuevo motivo', icono: 'ti-plus' }"
  (primaryClick)="showCreateModal = true">
</app-abril-page-header>

<div class="flex flex-col gap-[20px] bg-white p-[20px] flex-1 overflow-y-auto">

  <!-- ── Tabla ─────────────────────────────────────────────────────────── -->
  <div class="w-full rounded-lg overflow-auto border-t border-x" style="border-color:var(--color-abril-border)">
    <table class="w-full text-sm">
      <thead style="background:var(--color-abril-primary-light)">
        <tr style="color:var(--color-abril-primary-dark)">
          <th class="text-left px-[16px] py-[10px] font-semibold">Descripción</th>
          <th class="text-center px-[16px] py-[10px] font-semibold">Estado</th>
          <th class="text-center px-[16px] py-[10px] font-semibold">Acciones</th>
        </tr>
      </thead>
      <tbody>

        <tr *ngIf="motivos.length === 0">
          <td colspan="3" class="px-[16px] py-[32px] text-center text-gray-400 text-sm">
            No hay motivos registrados.
          </td>
        </tr>

        <tr *ngFor="let m of motivos" class="border-b hover:bg-gray-50" style="border-color:var(--color-abril-border)">

          <td class="px-[16px] py-[10px] text-gray-700">{{ m.descripcion }}</td>

          <td class="px-[16px] py-[10px] text-center">
            <app-status-badge
              [text]="m.activo ? 'ACTIVO' : 'INACTIVO'"
              [bgColor]="m.activo ? '#D7FAF4' : '#FAD5D4'"
              [textColor]="m.activo ? '#009C87' : '#D30000'" />
          </td>

          <td class="px-[16px] py-[10px] text-center">
            <div class="flex items-center justify-center gap-[10px]">
              <button
                (click)="toggle(m)"
                class="text-xs font-medium px-[10px] py-[4px] rounded-[6px] border transition-colors cursor-pointer"
                [ngClass]="m.activo
                  ? 'border-red-200 text-red-600 hover:bg-red-50'
                  : 'border-green-300 text-green-700 hover:bg-green-50'">
                {{ m.activo ? 'Desactivar' : 'Activar' }}
              </button>
              <button
                (click)="openEdit(m)"
                class="text-xs font-medium transition-colors cursor-pointer" style="color:var(--color-abril-primary)">
                Editar
              </button>
            </div>
          </td>

        </tr>
      </tbody>
    </table>
  </div>

</div>

<!-- ── Modales (fuera del card) ──────────────────────────────────────── -->
<app-ga-motivo-create
  *ngIf="showCreateModal"
  (closeModal)="showCreateModal = false"
  (saved)="load()" />

<app-ga-motivo-edit
  *ngIf="showEditModal && motivoToEdit"
  [motivo]="motivoToEdit!"
  (closeModal)="showEditModal = false; motivoToEdit = null"
  (saved)="load()" />
