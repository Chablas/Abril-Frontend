<!-- Sección embebida en GaConfiguracion: el header, el botón de crear y el
     disparador de filtros viven en el contenedor (`ga-configuracion`). -->
<div class="flex flex-col gap-[10px] flex-1 min-h-0 overflow-hidden">

  <!-- ── Tabla ─────────────────────────────────────────────────────────── -->
  <div class="w-full flex-1 min-h-0 overflow-auto">
    <table class="abril-table abril-table--th-center">
      <thead class="sticky top-0 z-10">
        <tr>
          <th>Descripción</th>
          <th class="text-center">Doc. adjunto</th>
          <th class="text-center">Estado</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>

        <tr *ngIf="filteredMotivos.length === 0">
          <td colspan="4" class="text-center py-[40px] text-gray-400 text-sm">
            {{ searchText.trim() || estadoFilter !== null ? 'Sin resultados.' : 'No hay motivos registrados.' }}
          </td>
        </tr>

        <tr *ngFor="let m of pagedMotivos" class="border-b hover:bg-gray-50" style="border-color:var(--color-abril-border)">

          <td class="text-gray-700">{{ m.descripcion | titleCase }}</td>

          <td class="text-center">
            <span *ngIf="m.requiereAdjunto"
                  class="text-[11px] px-[10px] py-[3px] rounded-full bg-[#DBEAFE] text-[#1D4ED8] font-medium whitespace-nowrap">
              Requerido
            </span>
            <span *ngIf="!m.requiereAdjunto" class="text-gray-300">—</span>
          </td>

          <td class="text-center">
            <app-status-badge
              [text]="m.activo ? 'ACTIVO' : 'INACTIVO'"
              [bgColor]="m.activo ? '#D7FAF4' : '#FAD5D4'"
              [textColor]="m.activo ? '#009C87' : '#D30000'" />
          </td>

          <td class="text-center">
            <div class="flex items-center justify-center gap-[8px]">
              <button
                (click)="toggle(m)"
                [abrilBulkAction]="m.activo ? 'danger' : 'default'">
                {{ m.activo ? 'Desactivar' : 'Activar' }}
              </button>
              <button
                (click)="openEdit(m)"
                abrilBulkAction="default">
                Editar
              </button>
            </div>
          </td>

        </tr>
      </tbody>
    </table>
  </div>

  <div class="shrink-0 max-w-[440px]">
    <app-paginator
      [totalRecords]="filteredMotivos.length"
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      (pageChange)="changePage($event)">
    </app-paginator>
  </div>

</div>

<!-- ── Modales (fuera del card) ──────────────────────────────────────── -->
<app-ga-motivo-create
  *ngIf="showCreateModal"
  (closeModal)="showCreateModal = false"
  (saved)="load()" />

<app-ga-motivo-edit
  *ngIf="showEditModal && motivoToEdit"
  [motivo]="motivoToEdit!"
  (closeModal)="showEditModal = false; motivoToEdit = null"
  (saved)="load()" />

<!-- ── Modal de filtros estándar ────────────────────────────────────── -->
<app-filter-modal *ngIf="filtrosAbiertos" (closeModal)="filtrosAbiertos = false" (clear)="limpiarFiltros()">
  <div class="w-full">
    <app-search-input
      placeholder="Buscar por descripción..."
      [(value)]="searchText"
      (valueChange)="onFilterChange()"
      width="100%">
    </app-search-input>
  </div>

  <div class="w-full">
    <app-search-select
      label="Estado"
      [options]="estadoFilterOptions"
      valueField="value"
      displayField="label"
      [value]="estadoFilter"
      (valueChange)="estadoFilter = $event; onFilterChange()">
    </app-search-select>
  </div>
</app-filter-modal>
