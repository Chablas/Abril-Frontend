<app-abril-page-header
  [badge]="badge"
  titulo="Configuración"
  [subtitulo]="subtitulo"
  [botonSecundario]="{ label: 'Volver', icono: 'ti-arrow-left' }"
  (secondaryClick)="volver()">
</app-abril-page-header>

<section class="page-container px-3 py-4 flex flex-col gap-[16px] flex-1 min-h-0 overflow-auto">

  <!-- Secciones exteriores. Solo Mis Rendiciones tiene más de una (Correos + Días
       reembolsables); en el resto la tira no se dibuja. -->
  <app-section-tabs
    *ngIf="secciones.length > 1"
    class="shrink-0"
    [tabs]="secciones"
    [value]="seccionActiva"
    color="var(--color-abril-standard)"
    (valueChange)="onSeccionChange($event)">
  </app-section-tabs>

  <!-- SECCIÓN: Correos (con una subsección por cada correo de esta pantalla) -->
  <app-ga-correos-config
    *ngIf="mostrandoCorreos"
    [pantalla]="pantalla"
    [textoSinCorreos]="textoSinCorreos">
  </app-ga-correos-config>

  <!-- SECCIÓN: Días reembolsables (el plazo para rendir un mes) -->
  <app-ga-dias-reembolsables *ngIf="mostrandoPlazo"></app-ga-dias-reembolsables>
</section>
