<app-base-modal
  [title]="titulo"
  width="w-[680px]"
  [preventCloseWhenDirty]="true"
  (closeModal)="closeModal.emit()">

  <div class="flex flex-col gap-[14px] mt-[12px]">

    <!-- Aviso de estado, no explicación: el orden manda distinto en cada pantalla. -->
    <p class="text-xs text-gray-500">{{ avisoRegla }}</p>

    <!-- ── Filas (posición = prioridad) ────────────────────────────────
         Sin overflow propio: el panel del app-search-select se posiciona con
         absolute y un contenedor con overflow-y-auto lo recortaría. Con muchas
         filas, el modal crece y el scroll lo hace el backdrop del base-modal. -->
    <div class="flex flex-col gap-[8px]">
      <div *ngFor="let row of rows; let i = index"
           class="flex items-center gap-[10px] border border-[#D6DEE5] rounded-lg px-[12px] py-[8px]">

        <span class="shrink-0 w-[26px] h-[26px] rounded-full bg-[var(--color-abril-standard-light)] text-[var(--color-abril-standard)] text-xs font-bold flex items-center justify-center">
          {{ i + 1 }}
        </span>

        <div class="flex-1 min-w-0">
          <app-search-select
            [options]="opcionesFila(i)"
            valueField="workerId"
            displayField="fullName"
            [value]="row.workerId"
            (valueChange)="row.workerId = $event"
            [placeholder]="'Seleccionar ' + singular.toLowerCase() + '...'">
          </app-search-select>
        </div>

        <!-- Activo / inactivo -->
        <label class="shrink-0 flex items-center gap-[6px] text-xs text-gray-600 cursor-pointer select-none">
          <input type="checkbox" class="w-4 h-4 accent-[var(--color-abril-standard)] cursor-pointer"
                 [checked]="row.active"
                 (change)="row.active = !row.active" />
          Activo
        </label>

        <!-- Subir / bajar prioridad -->
        <div class="shrink-0 flex flex-col">
          <button type="button" (click)="mover(i, -1)" [disabled]="i === 0"
                  class="text-gray-400 hover:text-gray-700 disabled:opacity-30 cursor-pointer disabled:cursor-default leading-none text-[13px]"
                  title="Subir prioridad">▲</button>
          <button type="button" (click)="mover(i, 1)" [disabled]="i === rows.length - 1"
                  class="text-gray-400 hover:text-gray-700 disabled:opacity-30 cursor-pointer disabled:cursor-default leading-none text-[13px]"
                  title="Bajar prioridad">▼</button>
        </div>

        <button type="button" (click)="quitar(i)"
                class="shrink-0 text-[#D30000] hover:bg-[#FAD5D4] rounded-full w-[26px] h-[26px] flex items-center justify-center cursor-pointer transition-colors"
                [title]="'Quitar ' + singular.toLowerCase()">
          ✕
        </button>
      </div>

      <p *ngIf="rows.length === 0" class="text-sm text-gray-400 text-center py-[16px]">
        Sin {{ plural.toLowerCase() }}: el área se resuelve por el algoritmo.
      </p>
    </div>

    <div>
      <button type="button" (click)="agregar()"
        class="text-xs font-medium px-[10px] py-[5px] rounded-[6px] border border-[var(--color-abril-standard)] text-[var(--color-abril-standard)] hover:bg-[var(--color-abril-standard-light)] transition-colors cursor-pointer">
        + Agregar {{ singular.toLowerCase() }}
      </button>
    </div>

    <div class="flex justify-center mt-[6px]">
      <button (click)="guardar()"
        class="w-[180px] py-[9px] rounded-[10px] cursor-pointer transition-colors"
        style="background:var(--color-abril-standard)">
        <p class="text-white text-base font-medium text-center">Guardar</p>
      </button>
    </div>

  </div>
</app-base-modal>
