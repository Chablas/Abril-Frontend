<div class="config-stack">
  <div class="config-card">

    <div class="config-card__head">
      <div class="config-card__headtext">
        <h3 class="config-card__title">
          <i class="ti ti-calendar-clock"></i>
          Plazo para rendir
        </h3>
      </div>
    </div>

    <div class="form-row plazo-field">
      <div class="abril-field">
        <label class="abril-field-label">Días hábiles del mes siguiente *</label>
        <input
          type="number"
          class="abril-field-input"
          name="diasHabilesPlazo"
          inputmode="numeric"
          [min]="minimo"
          [max]="maximo"
          step="1"
          [disabled]="loading || saving"
          [ngModel]="dias"
          (ngModelChange)="onDiasChange($event)" />
      </div>
    </div>

    <!-- Hasta qué mes hacia atrás llega el permiso. Son dos ajustes y no uno porque se preguntan
         cosas distintas: cuánto abre la ventana de arriba, y cuánto queda abierto todo el mes. -->
    <div class="plazo-sub">
      <h4 class="plazo-sub__title">Meses que se pueden rendir</h4>

      <div class="plazo-alcances">
        <app-search-select
          label="Dentro del plazo"
          [options]="alcances"
          valueField="id"
          displayField="nombre"
          [rawLabel]="true"
          [sortAlpha]="false"
          [allowClear]="false"
          [required]="true"
          [disabled]="loading || saving"
          [value]="alcancePlazoId"
          (valueChange)="onAlcancePlazoChange($event)"
          placeholder="Selecciona">
        </app-search-select>

        <app-search-select
          label="En cualquier momento"
          [options]="alcances"
          valueField="id"
          displayField="nombre"
          [rawLabel]="true"
          [sortAlpha]="false"
          [allowClear]="true"
          [disabled]="loading || saving"
          [value]="alcancePermanenteId"
          (valueChange)="onAlcancePermanenteChange($event)"
          placeholder="No aplica">
        </app-search-select>
      </div>
    </div>

    <!-- Único aviso de estado: desde qué mes se rinde HOY con lo guardado. Es el efecto de los tres
         campos juntos, que es lo que no se puede leer de los campos mirándolos. -->
    <p class="config-warn" *ngIf="rendibleDesde && !hayCambios">
      <i class="ti ti-info-circle"></i>
      <span>Hoy se pueden rendir salidas desde {{ rendibleDesde }}.</span>
    </p>

    <p class="config-warn" *ngIf="hayCambios">
      <i class="ti ti-alert-triangle"></i>
      <span>Sin guardar. Sigue rigiendo la configuración anterior.</span>
    </p>

    <p class="form-error" *ngIf="error">
      <i class="ti ti-alert-circle"></i> <span>{{ error }}</span>
    </p>

    <div class="plazo-actions">
      <button type="button" class="btn-primary" [disabled]="!puedeGuardar" (click)="guardar()">
        <i class="ti ti-loader-2 spin" *ngIf="saving"></i>
        <i class="ti ti-check" *ngIf="!saving"></i>
        {{ saving ? 'Guardando…' : 'Guardar' }}
      </button>

      <span class="plazo-ok" *ngIf="guardado && !hayCambios">
        <i class="ti ti-circle-check"></i> Guardado
      </span>
    </div>
  </div>
</div>
