<!-- PDF: no tiene vista previa, va el ícono rojo de archivo. Abre en una ventana nueva el webUrl de
     SharePoint o, si todavía no se guardó, el object URL del archivo elegido. -->
<a *ngIf="esPdf; else imagen"
   [href]="url"
   target="_blank"
   rel="noopener noreferrer"
   class="captura-pdf"
   title="Abrir el PDF"
   aria-label="Abrir el PDF">
  <svg width="34" height="42" viewBox="0 0 32 40" aria-hidden="true">
    <path d="M3 0h18l11 11v26a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3V3a3 3 0 0 1 3-3z" fill="currentColor" />
    <path d="M21 0v8a3 3 0 0 0 3 3h8z" fill="#FFFFFF" fill-opacity="0.45" />
    <text x="16" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">PDF</text>
  </svg>
</a>

<ng-template #imagen>
  <app-draggable-image [src]="url" />
</ng-template>
