<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img src="/images/abril-logo-verde-letra-blanca.png" alt="Abril" class="auth-logo" />
      <h2>{{ title }}</h2>
      <p>{{ subtitle }}</p>
    </div>

    <div *ngIf="tokenInvalido" class="alert-error">
      Enlace inválido o incompleto. Solicita uno nuevo desde
      <a routerLink="/auth/recuperar-contratista" class="btn-link">recuperar contraseña</a>.
    </div>

    <form *ngIf="!tokenInvalido" (ngSubmit)="submit()" class="auth-form">
      <div class="field">
        <label class="field-label">Nueva contraseña *</label>
        <div class="password-wrapper">
          <input
            class="field-input"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            autocomplete="new-password"
            placeholder="Mínimo 8 caracteres"
          />
          <button type="button" class="password-toggle" (click)="toggleShow()">
            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        <app-password-strength [password]="password" />
        <ul class="reglas">
          <li [class.ok]="password.length >= 8">8 caracteres mínimo</li>
          <li [class.ok]="password.length > 0 && password.match('[A-Z]')">1 mayúscula</li>
          <li [class.ok]="password.length > 0 && password.match('[0-9]')">1 número</li>
        </ul>
      </div>

      <div class="field">
        <label class="field-label">Confirmar contraseña *</label>
        <input
          class="field-input"
          type="password"
          [(ngModel)]="passwordConfirm"
          name="passwordConfirm"
          autocomplete="new-password"
        />
        <span class="error-line" *ngIf="passwordMismatch">Las contraseñas no coinciden.</span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="!canSubmit">
        {{ saving ? 'Guardando…' : 'Establecer contraseña' }}
      </button>

      <a routerLink="/auth/login" class="btn-link center">Volver al inicio</a>
    </form>
  </div>
</div>
