<div class="flex flex-col md:flex-row w-full min-h-screen">

    <!-- Panel izquierdo (logo + videos tutoriales) -->
    <div class="flex flex-col bg-gradient-to-t from-[#182233] to-[#2a3675]
              py-8 px-6 md:px-10 md:flex-1">

        <!-- Logo -->
        <div class="flex justify-center mb-8 shrink-0">
            <img class="w-40 sm:w-52 md:w-64" src="/images/abril-logo-verde-letra-blanca.png" />
        </div>

        <!-- Divider -->
        <div class="border-t border-white/10 mb-5 shrink-0"></div>

        <!-- Sección videos tutoriales -->
        <div class="flex items-center gap-2 mb-3 shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="#64bc04" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <span class="tutorial-section-label">Videos Tutoriales</span>
        </div>

        <div class="tutorial-scroll">
            <a *ngFor="let v of tutorialVideos"
               [href]="v.url" target="_blank" rel="noopener noreferrer"
               class="tutorial-card">
                <div class="tutorial-play">
                    <svg xmlns="http://www.w3.org/2000/svg" width="9" height="9" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </div>
                <div class="tutorial-info">
                    <p class="tutorial-title">{{ v.titulo }}</p>
                    <span class="tutorial-link">Ver tutorial →</span>
                </div>
            </a>
        </div>
    </div>

    <!-- Panel formulario -->
    <div class="flex-1 bg-[#f6f6f9] flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-sm">

            <h2 class="text-[#1f2937] text-2xl font-bold text-center mb-6">Iniciar sesión</h2>

            <!-- Tabs -->
            <div class="login-tabs">
                <button type="button" class="login-tab" [class.active]="activeTab === 'abril'"
                    (click)="setTab('abril')">
                    Abril
                </button>
                <button type="button" class="login-tab" [class.active]="activeTab === 'contratistas'"
                    (click)="setTab('contratistas')">
                    Contratistas
                </button>
                <button type="button" class="login-tab" [class.active]="activeTab === 'clinica'"
                    (click)="setTab('clinica')">
                    Clínica
                </button>
            </div>

            <!-- Tab Abril -->
            <div *ngIf="activeTab === 'abril'" class="flex justify-center">
                <button type="button" (click)="submitMicrosoft()"
                    class="flex items-center justify-center gap-3 w-full border border-[#E2E2E2] bg-white py-[10px] rounded-[10px] cursor-pointer hover:bg-gray-50 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 21 21">
                        <rect x="1" y="1" width="9" height="9" fill="#f25022" />
                        <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
                        <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
                        <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
                    </svg>
                    <span class="text-sm text-gray-700 font-medium">Iniciar sesión con Microsoft</span>
                </button>
            </div>

            <!-- Tab Contratistas -->
            <form *ngIf="activeTab === 'contratistas'" class="flex flex-col gap-6" [formGroup]="contratistaForm"
                (ngSubmit)="submitContratista()">
                <div class="flex flex-col gap-1.5">
                    <label>Email</label>
                    <input placeholder="tu@empresa.com"
                        class="border border-[#E2E2E2] rounded-lg p-[10px] w-full" type="email"
                        formControlName="email" autocomplete="email" />
                </div>

                <div class="flex flex-col gap-1.5">
                    <label>Contraseña</label>
                    <div class="password-wrapper">
                        <input placeholder="Tu contraseña"
                            class="border border-[#E2E2E2] rounded-lg p-[10px] w-full pr-20"
                            [type]="showContratistaPassword ? 'text' : 'password'"
                            formControlName="password" autocomplete="current-password" />
                        <button type="button" class="password-toggle" (click)="toggleContratistaPassword()">
                            {{ showContratistaPassword ? 'Ocultar' : 'Mostrar' }}
                        </button>
                    </div>
                </div>

                <button class="text-white w-full bg-[#64BC04] py-[10px] rounded-[10px] cursor-pointer" type="submit"
                    [disabled]="contratistaForm.invalid">
                    INGRESAR
                </button>

                <div class="text-center flex flex-col gap-2">
                    <a routerLink="/auth/recuperar-contratista" class="text-sm text-[#64BC04] font-medium hover:underline">
                        ¿Olvidaste tu contraseña?
                    </a>
                    <a routerLink="/contractors/registro" class="text-sm text-[#64BC04] font-medium hover:underline">
                        ¿Nueva empresa? Regístrate aquí
                    </a>
                    <p class="text-sm text-gray-600 m-0">
                        ¿Primera vez?
                        <a routerLink="/auth/activar-empresa" class="text-[#64BC04] font-medium hover:underline">
                            Activa tu cuenta aquí
                        </a>
                    </p>
                </div>
            </form>

            <!-- Tab Clínica -->
            <div *ngIf="activeTab === 'clinica'" class="flex flex-col gap-6">
                <div class="flex flex-col gap-1.5">
                    <label>Email</label>
                    <input type="email" placeholder="correo@clinica.com"
                        class="border border-[#E2E2E2] rounded-lg p-[10px] w-full"
                        [(ngModel)]="clinicaForm.email" autocomplete="email" />
                </div>

                <div class="flex flex-col gap-1.5">
                    <label>Contraseña</label>
                    <input type="password" placeholder="Tu contraseña"
                        class="border border-[#E2E2E2] rounded-lg p-[10px] w-full"
                        [(ngModel)]="clinicaForm.password" autocomplete="current-password" />
                </div>

                <div *ngIf="clinicaError" class="text-sm text-red-600 text-center">{{ clinicaError }}</div>

                <button type="button"
                    class="text-white w-full bg-[#64BC04] py-[10px] rounded-[10px] cursor-pointer"
                    [disabled]="clinicaLoading || !clinicaForm.email || !clinicaForm.password"
                    (click)="submitClinica()">
                    {{ clinicaLoading ? 'Ingresando...' : 'INGRESAR' }}
                </button>
            </div>

        </div>
    </div>

</div>
