<app-base-modal [title]="'Registrar Descanso Médico'" [fullScreen]="fullScreen" (closeModal)="closed.emit()">
  <div class="modal-body">

    <div class="field-row">
      <div class="field">
        <app-search-select
          label="Tipo *"
          [options]="tipoOpts"
          valueField="id"
          displayField="label"
          [value]="tipo"
          placeholder="Selecciona tipo"
          [allowClear]="false"
          (valueChange)="tipo = $event">
        </app-search-select>
      </div>
    </div>

    <div class="field-row two-cols">
      <div class="field">
        <label class="field-label">Fecha inicio *</label>
        <input type="date" class="field-input" [(ngModel)]="fechaInicio" />
      </div>
      <div class="field">
        <label class="field-label">Fecha fin *</label>
        <input type="date" class="field-input" [(ngModel)]="fechaFin" />
      </div>
    </div>

    <div class="dias-badge" *ngIf="diasCalculados > 0">
      <span>{{ diasCalculados }} día{{ diasCalculados !== 1 ? 's' : '' }} de descanso</span>
    </div>

    <div class="field">
      <label class="field-label">Motivo</label>
      <input type="text" class="field-input" [(ngModel)]="motivo" placeholder="Motivo del descanso" />
    </div>

    <div class="field-row two-cols">
      <div class="field">
        <label class="field-label">Diagnóstico</label>
        <input type="text" class="field-input" [(ngModel)]="diagnostico" placeholder="Diagnóstico médico" />
      </div>
      <div class="field">
        <label class="field-label">CIE-10</label>
        <input type="text" class="field-input" [(ngModel)]="diagnosticoCie10" placeholder="Ej. J06.9" />
      </div>
    </div>

    <div class="field">
      <label class="field-label">Certificado médico</label>
      <div *ngIf="!documento">
        <app-file-selector
          accept=".pdf,.jpg,.jpeg,.png"
          label="Adjunta el certificado médico o"
          hint="PDF, JPG, PNG"
          (fileSelected)="onFileSelected($event)">
        </app-file-selector>
      </div>
      <div *ngIf="documento" class="file-chip">
        <span class="file-chip__name">{{ documentoNombre }}</span>
        <button type="button" class="file-chip__remove" (click)="quitarDocumento()">✕</button>
      </div>
    </div>

  </div>

  <div class="modal-footer" slot="footer">
    <button class="btn-ghost" (click)="closed.emit()">Cancelar</button>
    <button class="btn-primary" [disabled]="saving" (click)="guardar()">
      {{ saving ? 'Guardando...' : 'Registrar descanso' }}
    </button>
  </div>
</app-base-modal>
