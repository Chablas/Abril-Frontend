<app-abril-modal-panel
  titulo="Registrar Descanso Médico"
  icono="ti-bed"
  variant="blue"
  (closeModal)="closed.emit()">

    <div class="form-row">
      <div class="abril-field">
        <label class="abril-field-label">Fecha inicio *</label>
        <input type="date" class="abril-field-input" [(ngModel)]="fechaInicio" />
      </div>
      <div class="abril-field">
        <label class="abril-field-label">Fecha fin *</label>
        <input type="date" class="abril-field-input" [(ngModel)]="fechaFin" />
      </div>
    </div>

    <div class="dias-badge" *ngIf="diasCalculados > 0">
      <span>{{ diasCalculados }} día{{ diasCalculados !== 1 ? 's' : '' }} de descanso</span>
    </div>

    <div class="abril-field">
      <app-search-select
        color="var(--color-abril-logo-blue)"
        label="Motivo"
        [options]="motivos"
        valueField="id"
        displayField="nombre"
        [value]="motivoId"
        placeholder="Selecciona motivo"
        (valueChange)="motivoId = $event">
      </app-search-select>
    </div>

    <div class="abril-field">
      <label class="abril-field-label">Diagnóstico</label>
      <input type="text" class="abril-field-input" [(ngModel)]="diagnostico" placeholder="Diagnóstico médico" />
    </div>

    <div class="abril-field">
      <label class="abril-field-label">Certificado médico</label>
      <app-file-selector
        accept=".pdf,.jpg,.jpeg,.png"
        label="Adjunta uno o varios archivos o"
        hint="PDF, JPG, PNG"
        (fileSelected)="onFileSelected($event)">
      </app-file-selector>
      <div *ngFor="let doc of documentos; let i = index" class="file-chip">
        <span class="file-chip__name">{{ doc.name }}</span>
        <button type="button" class="file-chip__remove" (click)="quitarDocumento(i)">✕</button>
      </div>
    </div>

  <div modalFooter>
    <button type="button" class="btn-ghost" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn-primary" [disabled]="saving" (click)="guardar()">
      <i class="ti ti-loader-2 spin" *ngIf="saving"></i><i class="ti ti-check" *ngIf="!saving"></i>
      {{ saving ? 'Guardando...' : 'Registrar descanso' }}
    </button>
  </div>
</app-abril-modal-panel>
