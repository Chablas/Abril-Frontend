<app-abril-page-header
  [badge]="'SSOMA · ' + anioActual"
  titulo="Accidentes de Trabajo"
  subtitulo="Registro y seguimiento de accidentes de trabajo."
  [tabs]="tabs">
</app-abril-page-header>

<section class="px-3 py-4 space-y-3 flex-1 overflow-y-auto">

  <!-- Filtros -->
  <div class="filters-card">
    <div class="filters-grid">
      <div>
        <label class="filter-label">Fecha desde</label>
        <input type="date" class="field-input" [(ngModel)]="filtros.fechaDesde" (ngModelChange)="onFilterChange()" />
      </div>
      <div>
        <label class="filter-label">Fecha hasta</label>
        <input type="date" class="field-input" [(ngModel)]="filtros.fechaHasta" (ngModelChange)="onFilterChange()" />
      </div>
      <div>
        <label class="filter-label">Estado</label>
        <select class="field-input" [(ngModel)]="filtros.estado" (ngModelChange)="onFilterChange()">
          <option *ngFor="let e of estadoOpts" [value]="e.id">{{ e.nombre }}</option>
        </select>
      </div>
      <div>
        <label class="filter-label">ID Trabajador</label>
        <input type="number" class="field-input" [(ngModel)]="filtros.workerId"
          placeholder="Número" (ngModelChange)="onWorkerChange()" />
      </div>
    </div>
    <div *ngIf="hasFilters" class="pt-2">
      <button class="btn-link" (click)="limpiarFiltros()">Limpiar filtros</button>
    </div>
  </div>

  <!-- Tabla -->
  <div class="card">
    <div class="table-wrapper">
      <table class="data-table">
        <colgroup>
          <col style="width:50px"/>
          <col/>
          <col style="width:100px"/>
          <col style="width:120px"/>
          <col style="width:130px"/>
          <col style="width:90px"/>
          <col style="width:60px"/>
          <col style="width:36px"/>
        </colgroup>
        <thead>
          <tr>
            <th>#</th>
            <th>Trabajador</th>
            <th>Fecha</th>
            <th>Tipo</th>
            <th>Lugar</th>
            <th>Estado</th>
            <th>Seg.</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let a of accidentes">
            <td class="col-mono">{{ a.id }}</td>
            <td class="col-worker">
              <div class="worker-cell">
                <span class="worker-name">{{ a.workerNombre ?? '—' }}</span>
                <span class="worker-dni">{{ a.workerDni }}</span>
              </div>
            </td>
            <td>{{ a.fechaAccidente | date:'dd/MM/yyyy' }}</td>
            <td>{{ a.tipoAccidente ?? '—' }}</td>
            <td>{{ a.lugarAccidente ?? '—' }}</td>
            <td>
              <span class="badge"
                [class.badge-red]="a.estado === 'Abierto'"
                [class.badge-green]="a.estado === 'Cerrado'"
                [class.badge-gray]="a.estado !== 'Abierto' && a.estado !== 'Cerrado'">
                {{ a.estado }}
              </span>
            </td>
            <td>{{ a.totalSeguimientos }}</td>
            <td class="text-right">
              <button class="row-action" (click)="eliminar(a, $event)" title="Eliminar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
                </svg>
              </button>
            </td>
          </tr>
          <tr *ngIf="!loading && accidentes.length === 0">
            <td colspan="8" class="empty-row">Sin accidentes registrados.</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div *ngIf="totalRecords > 0" class="paginator-wrapper">
      <app-paginator [totalRecords]="totalRecords" [currentPage]="currentPage"
        [totalPages]="totalPages" (pageChange)="onPageChange($event)">
      </app-paginator>
    </div>
  </div>

</section>
