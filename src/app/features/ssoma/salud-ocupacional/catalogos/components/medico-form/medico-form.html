<app-base-modal *ngIf="open" [title]="title" width="w-[700px]" (closeModal)="close()">
  <div class="form-wrapper">
    <div class="grid-2">
      <div class="col-span-2">
        <label class="field-label">Apellidos y nombres *</label>
        <input type="text" class="field-input" [(ngModel)]="model.apellidoNombre" />
      </div>
      <div>
        <label class="field-label">CMP</label>
        <input type="text" class="field-input" [(ngModel)]="model.cmp" />
      </div>
      <div>
        <label class="field-label">Especialidad</label>
        <input type="text" class="field-input" [(ngModel)]="model.especialidad" />
      </div>
      <div class="col-span-2">
        <label class="field-label">Clínica</label>
        <app-search-select
          [options]="clinicas"
          valueField="id"
          displayField="nombre"
          [value]="model.clinicaId"
          [showLabel]="false"
          placeholder="Sin asignar"
          (valueChange)="model.clinicaId = $event"
        ></app-search-select>
      </div>
      <div>
        <label class="field-label">Email</label>
        <input type="email" class="field-input" [(ngModel)]="model.email" />
      </div>
      <div>
        <label class="field-label">Celular</label>
        <input type="text" class="field-input" [(ngModel)]="model.celular" />
      </div>
      <div>
        <label class="field-label">Estado</label>
        <select class="field-input" [(ngModel)]="model.activo">
          <option [ngValue]="true">Activo</option>
          <option [ngValue]="false">Inactivo</option>
        </select>
      </div>
    </div>

    <footer class="form-footer">
      <button type="button" class="btn-ghost" (click)="close()">Cancelar</button>
      <button type="button" class="btn-primary" [disabled]="!canSubmit" (click)="submit()">
        {{ saving ? 'Guardando…' : 'Guardar' }}
      </button>
    </footer>
  </div>
</app-base-modal>
