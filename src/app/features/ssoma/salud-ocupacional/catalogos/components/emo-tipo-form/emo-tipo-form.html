<app-base-modal *ngIf="open" [title]="title" width="w-[640px]" (closeModal)="close()">
  <div class="form-wrapper">
    <div class="grid-2">
      <div class="col-span-2">
        <label class="field-label">Nombre *</label>
        <input type="text" class="field-input" [(ngModel)]="model.nombre" />
      </div>
      <div>
        <label class="field-label">Vigencia (meses) *</label>
        <input
          type="number"
          min="0"
          class="field-input"
          [(ngModel)]="model.vigenciaMeses"
        />
      </div>
      <div>
        <app-search-select
          label="Requiere nuevo"
          [options]="siNoOpts"
          valueField="id"
          displayField="label"
          [sortAlpha]="false"
          [value]="model.requiereNuevo"
          [allowClear]="false"
          placeholder="Selecciona"
          (valueChange)="model.requiereNuevo = $event">
        </app-search-select>
      </div>
      <div class="col-span-2">
        <label class="field-label">Descripción</label>
        <textarea rows="3" class="field-input" [(ngModel)]="model.descripcion"></textarea>
      </div>
      <div>
        <app-search-select
          label="Estado"
          [options]="estadoOpts"
          valueField="id"
          displayField="label"
          [sortAlpha]="false"
          [value]="model.activo"
          [allowClear]="false"
          placeholder="Selecciona estado"
          (valueChange)="model.activo = $event">
        </app-search-select>
      </div>
    </div>

    <footer class="form-footer">
      <button type="button" class="btn-ghost" (click)="close()">Cancelar</button>
      <button type="button" class="btn-primary" [disabled]="!canSubmit" (click)="submit()">
        {{ saving ? 'Guardando…' : 'Guardar' }}
      </button>
    </footer>
  </div>
</app-base-modal>
