<app-abril-modal-panel
  *ngIf="open"
  [titulo]="title"
  icono="ti-stethoscope"
  variant="blue"
  width="640px"
  (closeModal)="close()">

  <div class="form-row">
    <div class="abril-field">
      <label class="abril-field-label">Nombre *</label>
      <input type="text" class="abril-field-input" [(ngModel)]="model.nombre" />
    </div>
  </div>
  <div class="form-row">
    <div class="abril-field">
      <label class="abril-field-label">Vigencia (meses) *</label>
      <input type="number" min="0" class="abril-field-input" [(ngModel)]="model.vigenciaMeses" />
    </div>
    <div class="abril-field">
      <app-search-select
        color="var(--color-abril-logo-blue)"
        label="Requiere nuevo"
        [options]="siNoOpts"
        valueField="id"
        displayField="label"
        [sortAlpha]="false"
        [value]="model.requiereNuevo"
        [allowClear]="false"
        placeholder="Selecciona"
        (valueChange)="model.requiereNuevo = $event">
      </app-search-select>
    </div>
  </div>
  <div class="form-row">
    <div class="abril-field">
      <label class="abril-field-label">Descripción</label>
      <textarea rows="3" class="abril-field-input" [(ngModel)]="model.descripcion"></textarea>
    </div>
  </div>
  <div class="form-row">
    <div class="abril-field">
      <app-search-select
        color="var(--color-abril-logo-blue)"
        label="Estado"
        [options]="estadoOpts"
        valueField="id"
        displayField="label"
        [sortAlpha]="false"
        [value]="model.activo"
        [allowClear]="false"
        placeholder="Selecciona estado"
        (valueChange)="model.activo = $event">
      </app-search-select>
    </div>
  </div>

  <div modalFooter>
    <button type="button" class="btn-ghost" (click)="close()">Cancelar</button>
    <button type="button" class="btn-primary" [disabled]="!canSubmit" (click)="submit()">
      <i class="ti ti-loader-2 spin" *ngIf="saving"></i><i class="ti ti-check" *ngIf="!saving"></i>
      {{ saving ? 'Guardando…' : 'Guardar' }}
    </button>
  </div>

</app-abril-modal-panel>
