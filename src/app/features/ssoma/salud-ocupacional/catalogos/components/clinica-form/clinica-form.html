<app-base-modal *ngIf="open" [title]="title" width="w-[700px]" (closeModal)="close()">
  <div class="form-wrapper">
    <div class="grid-2">
      <div class="col-span-2">
        <label class="field-label">Nombre *</label>
        <input type="text" class="field-input" [(ngModel)]="model.nombre" />
      </div>
      <div>
        <label class="field-label">RUC</label>
        <input type="text" class="field-input" [(ngModel)]="model.ruc" maxlength="11" />
      </div>
      <div>
        <label class="field-label">Teléfono</label>
        <input type="text" class="field-input" [(ngModel)]="model.telefono" />
      </div>
      <div class="col-span-2">
        <label class="field-label">Dirección</label>
        <input type="text" class="field-input" [(ngModel)]="model.direccion" />
      </div>

      <div class="col-span-2">
        <div class="emails-header">
          <span class="field-label">Emails de contacto</span>
          <button type="button" class="btn-link" (click)="agregarEmail()">+ Agregar email</button>
        </div>
        <div class="email-row" *ngFor="let e of emails; let i = index">
          <input
            type="email"
            class="field-input"
            [(ngModel)]="e.email"
            [name]="'email-' + i"
            placeholder="correo@ejemplo.com"
          />
          <input
            type="text"
            class="field-input"
            [(ngModel)]="e.nombre"
            [name]="'nombre-' + i"
            placeholder="Nombre contacto"
          />
          <button type="button" class="btn-delete" (click)="eliminarEmail(i)" title="Eliminar">
            🗑
          </button>
        </div>
        <p *ngIf="emails.length === 0" class="emails-empty">Sin emails registrados</p>
      </div>

      <div>
        <app-search-select
          label="Estado"
          [options]="estadoOpts"
          valueField="id"
          displayField="label"
          [sortAlpha]="false"
          [value]="model.activo"
          [allowClear]="false"
          placeholder="Selecciona estado"
          (valueChange)="model.activo = $event">
        </app-search-select>
      </div>
    </div>

    <footer class="form-footer">
      <button type="button" class="btn-ghost" (click)="close()">Cancelar</button>
      <button type="button" class="btn-primary" [disabled]="!canSubmit" (click)="submit()">
        {{ saving ? 'Guardando…' : 'Guardar' }}
      </button>
    </footer>
  </div>
</app-base-modal>
