<app-abril-page-header
  [badge]="'SSOMA · ' + anioActual"
  titulo="Descansos Médicos"
  subtitulo="Registro y seguimiento de descansos médicos ocupacionales."
  [tabs]="tabs">
</app-abril-page-header>

<section class="px-3 py-4 space-y-3 flex-1 overflow-y-auto">

  <!-- Filtros -->
  <div class="filters-card">
    <div class="filters-grid">
      <div>
        <label class="filter-label">Fecha desde</label>
        <input type="date" class="field-input" [(ngModel)]="filtros.fechaDesde" (ngModelChange)="onFilterChange()" />
      </div>
      <div>
        <label class="filter-label">Fecha hasta</label>
        <input type="date" class="field-input" [(ngModel)]="filtros.fechaHasta" (ngModelChange)="onFilterChange()" />
      </div>
      <div>
        <label class="filter-label">Estado</label>
        <select class="field-input" [(ngModel)]="filtros.estado" (ngModelChange)="onFilterChange()">
          <option *ngFor="let e of estadoOpts" [value]="e.id">{{ e.nombre }}</option>
        </select>
      </div>
      <div>
        <label class="filter-label">Tipo</label>
        <select class="field-input" [(ngModel)]="filtros.tipo" (ngModelChange)="onFilterChange()">
          <option *ngFor="let t of tipoOpts" [value]="t.id">{{ t.nombre }}</option>
        </select>
      </div>
      <div>
        <label class="filter-label">ID Trabajador</label>
        <input type="number" class="field-input" [(ngModel)]="filtros.workerId"
          placeholder="Número" (ngModelChange)="onWorkerChange()" />
      </div>
    </div>
    <div *ngIf="hasFilters" class="pt-2">
      <button class="btn-link" (click)="limpiarFiltros()">Limpiar filtros</button>
    </div>
  </div>

  <!-- Tabla -->
  <div class="card">
    <div class="table-wrapper">
      <table class="data-table">
        <colgroup>
          <col style="width:50px"/>
          <col/>
          <col style="width:90px"/>
          <col style="width:100px"/>
          <col style="width:100px"/>
          <col style="width:44px"/>
          <col style="width:110px"/>
          <col style="width:80px"/>
          <col style="width:36px"/>
        </colgroup>
        <thead>
          <tr>
            <th>#</th>
            <th>Trabajador</th>
            <th>Tipo</th>
            <th>Inicio</th>
            <th>Fin</th>
            <th>Días</th>
            <th>Estado</th>
            <th>Acceso</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let d of descansos" class="row-clickable" (click)="abrirModal(d.id)">
            <td class="col-mono">{{ d.id }}</td>
            <td class="col-worker">
              <div class="worker-cell">
                <span class="worker-name">{{ d.workerNombre ?? '—' }}</span>
                <span class="worker-dni">{{ d.workerDni }}</span>
              </div>
            </td>
            <td><span class="badge badge-gray">{{ d.tipo }}</span></td>
            <td>{{ d.fechaInicio | date:'dd/MM/yyyy' }}</td>
            <td>{{ d.fechaFin | date:'dd/MM/yyyy' }}</td>
            <td class="col-mono">{{ d.dias }}</td>
            <td>
              <span class="badge" [ngClass]="estadoBadgeClass(d.estado)">{{ d.estado }}</span>
            </td>
            <td>
              <span *ngIf="d.trabajadorBloqueado" class="blocked-chip" title="Bloqueado en Control de Acceso">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
                </svg>
                Bloqueado
              </span>
              <span *ngIf="!d.trabajadorBloqueado" class="free-chip">Activo</span>
            </td>
            <td class="text-right">
              <button class="row-action" (click)="eliminar(d, $event)" title="Eliminar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
                </svg>
              </button>
            </td>
          </tr>
          <tr *ngIf="!loading && descansos.length === 0">
            <td colspan="9" class="empty-row">Sin descansos médicos registrados.</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div *ngIf="totalRecords > 0" class="paginator-wrapper">
      <app-paginator [totalRecords]="totalRecords" [currentPage]="currentPage"
        [totalPages]="totalPages" (pageChange)="onPageChange($event)">
      </app-paginator>
    </div>
  </div>

</section>

<app-fab label="Nuevo Descanso" (clicked)="abrirModal()"></app-fab>

<app-descanso-modal
  *ngIf="modalVisible"
  [descansoId]="descansoSeleccionadoId"
  (closed)="cerrarModal()"
  (saved)="onGuardado()">
</app-descanso-modal>
