<div class="abril-field">
  <label class="abril-field-label">{{ label }}</label>
  <app-file-selector
    accept=".pdf,.jpg,.jpeg,.png"
    label="Adjunta uno o varios archivos o"
    hint="PDF, JPG, PNG"
    [color]="color"
    (fileSelected)="onFileSelected($event)">
  </app-file-selector>

  <div *ngFor="let archivo of archivos; let i = index" class="file-chip">
    <span class="file-chip__name">{{ archivo.name }}</span>
    <button type="button" class="file-chip__remove" (click)="quitar(i)" title="Quitar archivo">✕</button>
  </div>
</div>
