<app-abril-page-header
  badge="SSOMA · CONFIGURACIÓN"
  titulo="Configuración de EMOs"
  subtitulo="Administra los destinatarios de los correos de programación de EMO."
  [tabs]="tabs"
  [botonSecundario]="{ label: 'Volver', icono: 'ti-arrow-left' }"
  (secondaryClick)="volver()">
</app-abril-page-header>

<section class="page-container px-3 py-4 flex flex-col gap-[16px] flex-1 min-h-0 overflow-auto">
  <app-section-tabs
    class="shrink-0"
    [tabs]="sectionTabs"
    [value]="activeSection"
    color="var(--color-abril-standard)"
    (valueChange)="onSectionChange($event)">
  </app-section-tabs>

  <app-emo-correos-config *ngIf="activeSection === 'correos'"></app-emo-correos-config>
</section>
