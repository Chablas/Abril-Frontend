<app-base-modal *ngIf="open" title="Nueva programación" width="w-[800px]" (closeModal)="close()">
  <div class="form-wrapper">
    <h4 class="section-title">Trabajador</h4>
    <app-worker-search-input [selected]="worker" (selectedChange)="onWorkerSelected($event)"></app-worker-search-input>

    <h4 class="section-title mt-6">Datos de la cita</h4>
    <div class="grid-2">
      <div>
        <label class="field-label">Tipo EMO *</label>
        <app-search-select
          [options]="emoTipos"
          valueField="id"
          displayField="nombre"
          [value]="tipoEmoId"
          [showLabel]="false"
          placeholder="Selecciona tipo"
          (valueChange)="tipoEmoId = $event"
        ></app-search-select>
      </div>
      <div>
        <label class="field-label">Empresa *</label>
        <app-search-select
          [options]="empresas"
          valueField="id"
          displayField="nombre"
          [value]="empresaId"
          [showLabel]="false"
          placeholder="Selecciona empresa"
          (valueChange)="empresaId = $event"
        ></app-search-select>
      </div>
      <div>
        <label class="field-label">Fecha *</label>
        <input type="date" class="field-input" [(ngModel)]="fecha" />
      </div>
      <div>
        <label class="field-label">Clínica</label>
        <app-search-select
          [options]="clinicas"
          valueField="id"
          displayField="nombre"
          [value]="clinicaId"
          [showLabel]="false"
          placeholder="Selecciona clínica"
          (valueChange)="onClinicaChange($event)"
        ></app-search-select>
      </div>
    </div>

    <footer class="form-footer">
      <button type="button" class="btn-ghost" (click)="close()">Cancelar</button>
      <button type="button" class="btn-primary" [disabled]="!canSubmit" (click)="submit()">
        {{ saving ? 'Guardando…' : 'Registrar programación' }}
      </button>
    </footer>
  </div>
</app-base-modal>
