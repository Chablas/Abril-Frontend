<div class="lista-root">
  <app-ssoma-page-header
    badge="SSOMA · PASO"
    titulo="Programas PASO"
    subtitulo="Seguridad · Salud Ocupacional · Medio Ambiente"
    [botonSecundario]="{ label: 'Exportar', icono: 'ti-download' }"
    (secondaryClick)="exportOpen = !exportOpen">
  </app-ssoma-page-header>
  <app-paso-nav></app-paso-nav>

  <!-- Selector de proyecto + KPIs -->
  <div class="proyecto-bar">

    <!-- Selector Apple-style -->
    <div class="proyecto-selector">
      <span class="selector-label">PROYECTO</span>
      <div class="selector-row">
        <div class="selector-wrap">
          <select class="selector-select" [(ngModel)]="selectedPasoId" (ngModelChange)="onProyectoChange()">
            <option *ngFor="let p of programas" [ngValue]="p.id">
              {{ p.proyectoNombre ?? p.nombre }} · {{ p.anio }}
            </option>
          </select>
          <i class="ti ti-chevron-down selector-chev"></i>
        </div>
        <span *ngIf="paso" class="estado-pill" [ngClass]="'estado-pill--' + paso.estado.toLowerCase()">
          {{ paso.estado }}
        </span>
      </div>
    </div>

    <div class="bar-sep"></div>

    <!-- KPI mini-cards -->
    <div class="kpi-strip" *ngIf="spi && !loadingDetalle">
      <div class="kpi-strip__item">
        <span class="kpi-strip__label">SPI</span>
        <app-spi-badge [spi]="spi.spiGeneral" size="sm"></app-spi-badge>
      </div>
      <div class="kpi-strip__item">
        <span class="kpi-strip__label">Avance</span>
        <span class="kpi-strip__value" style="color:#2563eb">{{ spi.porcentajeAvance | number:'1.0-1' }}%</span>
      </div>
      <div class="kpi-strip__item">
        <span class="kpi-strip__label">Ejecutadas</span>
        <span class="kpi-strip__value" style="color:#16a34a">{{ spi.totalEjecutadas }}</span>
      </div>
      <div class="kpi-strip__item">
        <span class="kpi-strip__label">Vencidas</span>
        <span class="kpi-strip__value" [style.color]="spi.totalVencidas > 0 ? '#dc2626' : '#16a34a'">
          {{ spi.totalVencidas }}
        </span>
      </div>
    </div>

    <!-- Acciones -->
    <div class="proyecto-actions" *ngIf="paso">
      <button *ngIf="paso.estado === 'Borrador'" type="button" class="hdr-btn hdr-btn--green" (click)="aprobar()">
        <i class="ti ti-check"></i> Aprobar
      </button>
      <div class="export-wrap" *ngIf="exportOpen">
        <div class="export-menu">
          <div class="export-item" (click)="exportar('excel')">
            <i class="ti ti-file-spreadsheet" style="color:#16a34a"></i> Excel
          </div>
          <div class="export-item" (click)="exportar('pdf')">
            <i class="ti ti-file-type-pdf" style="color:#dc2626"></i> PDF
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="loadingDetalle" class="loading-center">
    <i class="ti ti-loader-2 animate-spin" style="font-size:1.5rem"></i>
    <span>Cargando programa…</span>
  </div>

  <ng-container *ngIf="!loadingDetalle && paso">
    <!-- Tabs de ámbito -->
    <nav class="paso-tabs">
      <button *ngFor="let t of tabs" type="button"
        class="paso-tab"
        [ngClass]="[tabColor(t), tabActiva === t ? 'active' : '']"
        (click)="setTab(t)">
        <i class="ti" [ngClass]="tabIcon(t)"></i>
        {{ tabLabel(t) }}
        <span *ngIf="t !== 'Gantt'" class="tab-count">{{ countTab($any(t)) }}</span>
      </button>
    </nav>

    <!-- Toolbar entre tabs y contenido -->
    <div class="actividades-toolbar" *ngIf="tabActiva !== 'Gantt'">
      <div class="filtro-pills">
        <button [class.active]="filtroEstado===''" (click)="filtroEstado=''" type="button">Todas</button>
        <button [class.active]="filtroEstado==='pendiente'" (click)="filtroEstado='pendiente'" type="button">Pendientes</button>
        <button [class.active]="filtroEstado==='ejecutado'" (click)="filtroEstado='ejecutado'" type="button">Completadas</button>
        <button [class.active]="filtroEstado==='vencido'" (click)="filtroEstado='vencido'" type="button">Vencidas</button>
      </div>
      <button type="button" class="btn-add" (click)="abrirAgregar()">
        <i class="ti ti-plus"></i> Agregar actividad
      </button>
    </div>

    <!-- Contenido del tab -->
    <div class="tab-body">
      <ng-container *ngIf="tabActiva !== 'Gantt'">
        <app-actividad-tree
          [actividades]="actividadesTab"
          [pasoId]="paso.id"
          [ambito]="tabActiva"
          [filtroEstado]="filtroEstado"
          (actividadEliminada)="onEliminada($event)">
        </app-actividad-tree>
      </ng-container>
      <app-paso-gantt *ngIf="tabActiva === 'Gantt'" [pasoId]="paso.id"></app-paso-gantt>
    </div>
  </ng-container>
</div>

<!-- Offcanvas agregar actividad -->
<div *ngIf="agregarOpen" class="offcanvas-overlay">
  <div class="offcanvas-backdrop" (click)="agregarOpen=false"></div>
  <div class="offcanvas-panel">
    <div class="offcanvas-header">
      <h3 class="offcanvas-title">Agregar Actividad</h3>
      <button type="button" class="offcanvas-close" (click)="agregarOpen=false"><i class="ti ti-x"></i></button>
    </div>
    <div class="oc-field">
      <label class="oc-label">Categoría *</label>
      <select class="oc-select" [(ngModel)]="agregarForm.categoriaId">
        <option [ngValue]="undefined">— Selecciona —</option>
        <option *ngFor="let c of categoriasFiltradas" [ngValue]="c.id">{{ c.nombre }}</option>
      </select>
    </div>
    <div class="oc-field">
      <label class="oc-label">Nombre *</label>
      <input type="text" class="oc-input" [(ngModel)]="agregarForm.nombre" />
    </div>
    <div class="oc-field">
      <label class="oc-label">Frecuencia</label>
      <select class="oc-select" [(ngModel)]="agregarForm.frecuencia">
        <option value="Mensual">Mensual</option>
        <option value="Bimestral">Bimestral</option>
        <option value="Trimestral">Trimestral</option>
        <option value="Semestral">Semestral</option>
        <option value="Anual">Anual</option>
        <option value="Unica">Única</option>
      </select>
    </div>
    <div class="oc-grid2">
      <div class="oc-field">
        <label class="oc-label">Mes inicio</label>
        <input type="number" min="1" max="12" class="oc-input" [(ngModel)]="agregarForm.mesInicio" />
      </div>
      <div class="oc-field">
        <label class="oc-label">Mes fin</label>
        <input type="number" min="1" max="12" class="oc-input" [(ngModel)]="agregarForm.mesFin" />
      </div>
    </div>
    <div class="oc-field">
      <label class="oc-label">Cantidad planificada</label>
      <input type="number" min="1" class="oc-input" [(ngModel)]="agregarForm.cantidadPlanificada" />
    </div>
    <div class="oc-footer">
      <button type="button" class="oc-btn-cancel" (click)="agregarOpen=false">Cancelar</button>
      <button type="button" class="oc-btn-save" [disabled]="saving" (click)="guardarActividad()">
        <i class="ti" [ngClass]="saving ? 'ti-loader-2 animate-spin' : 'ti-plus'"></i>
        {{ saving ? 'Guardando...' : 'Agregar' }}
      </button>
    </div>
  </div>
</div>

<app-instanciar-modal *ngIf="instanciarOpen && paso"
  [pasoPlantillaId]="paso.id" [plantillaNombre]="paso.nombre"
  (closed)="instanciarOpen=false" (instanciaCreada)="onInstanciaCreada()">
</app-instanciar-modal>
