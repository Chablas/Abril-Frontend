<app-base-modal [title]="step === 1 ? 'Agregar PASO al Proyecto' : 'Instanciar Plantilla — Confirmar'" width="w-full max-w-md" (closed)="close()">
  <div class="mt-2">

    <!-- Origen info -->
    <div class="bg-indigo-50 border border-indigo-100 rounded-lg px-3 py-2 text-sm mb-4">
      <span class="text-indigo-600 text-xs font-semibold uppercase tracking-wide">Plantilla origen</span>
      <p class="font-semibold text-indigo-800 mt-0.5">{{ plantillaNombre }}</p>
    </div>

    <!-- PASO 1 -->
    <ng-container *ngIf="step === 1">
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Proyecto destino <span class="text-red-500">*</span></label>
          <div *ngIf="loadingProyectos" class="text-sm text-gray-400 py-2">Cargando proyectos...</div>
          <select *ngIf="!loadingProyectos"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-400"
            [(ngModel)]="proyectoId">
            <option [ngValue]="null">— Selecciona un proyecto —</option>
            <option *ngFor="let p of proyectos" [ngValue]="p.projectId">{{ p.projectDescription }}</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Año <span class="text-red-500">*</span></label>
          <input type="number" min="2020" max="2035" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-400"
            [(ngModel)]="anio" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Mes de inicio <span class="text-red-500">*</span></label>
          <select class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-400"
            [(ngModel)]="mesInicio">
            <option *ngFor="let m of meses" [ngValue]="m.valor">{{ m.nombre }}</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-4 mt-2 border-t border-gray-100">
        <button type="button" (click)="close()" class="px-4 py-2 text-sm border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50">Cancelar</button>
        <button type="button" (click)="siguente()" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 flex items-center gap-2">
          Siguiente <i class="ti ti-arrow-right"></i>
        </button>
      </div>
    </ng-container>

    <!-- PASO 2 -->
    <ng-container *ngIf="step === 2">
      <div class="space-y-3">
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div class="text-gray-500">Proyecto</div>
          <div class="font-medium text-gray-800">{{ proyectoNombre }}</div>
          <div class="text-gray-500">Año</div>
          <div class="font-medium text-gray-800">{{ anio }}</div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre del programa (editable)</label>
          <input type="text" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-400"
            [(ngModel)]="nombreGenerado" />
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-4 mt-2 border-t border-gray-100">
        <button type="button" (click)="anterior()" class="px-4 py-2 text-sm border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50 flex items-center gap-2">
          <i class="ti ti-arrow-left"></i> Anterior
        </button>
        <button type="button" [disabled]="saving" (click)="instanciar()"
          class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-50 flex items-center gap-2">
          <i class="ti" [ngClass]="saving ? 'ti-loader-2 animate-spin' : 'ti-copy'"></i>
          {{ saving ? 'Instanciando...' : 'Instanciar' }}
        </button>
      </div>
    </ng-container>

  </div>
</app-base-modal>
