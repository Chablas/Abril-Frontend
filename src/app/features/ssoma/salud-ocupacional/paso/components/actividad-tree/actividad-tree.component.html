<div class="tree-wrap">

  <div *ngFor="let grupo of groups">

    <!-- Fila cabecera de categoría -->
    <div class="cat-header" (click)="toggleGroup(grupo.id)">
      <i class="ti ti-chevron-right cat-chevron" [class.open]="!isCollapsed(grupo.id)"></i>
      <span class="cat-name">{{ grupo.nombre }}</span>
      <span class="cat-count">{{ grupo.actividades.length }}</span>
    </div>

    <!-- Filas de actividades -->
    <div *ngIf="!isCollapsed(grupo.id)">
      <div *ngFor="let a of grupo.actividades" class="actividad-row">

        <!-- Col 1: barra de color SPI -->
        <div class="act-color-bar" [ngClass]="'act-color-bar--' + spiBarColor(a)"></div>

        <!-- Col 2: nombre -->
        <div class="act-name-cell">
          <span class="act-name" [title]="a.nombre">{{ a.nombre }}</span>
        </div>

        <!-- Col 3: frecuencia -->
        <span class="freq-badge" [ngClass]="frecuenciaClass(a.frecuencia)">{{ a.frecuencia }}</span>

        <!-- Col 4: meses -->
        <span class="act-meses">M{{ a.mesInicio }}–M{{ a.mesFin }}</span>

        <!-- Col 5: ejecuciones -->
        <span class="act-ejec">{{ ejecutadas(a) }}/{{ a.cantidadPlanificada }}</span>

        <!-- Col 6: SPI badge -->
        <app-spi-badge [spi]="spiActividad(a)" size="sm"></app-spi-badge>

        <!-- Col 7: estado mes actual -->
        <span class="mes-actual" [ngClass]="'mes-actual--' + ejecucionMesActual(a).estado">
          {{ ejecucionMesActual(a).label }}
        </span>

        <!-- Col 8: acciones -->
        <div class="act-row-actions">
          <button type="button" class="row-btn row-btn--reg" (click)="abrirEjecucion(a)" title="Registrar ejecución">
            <i class="ti ti-plus"></i> Registrar
          </button>
          <a class="row-btn row-btn--ver" [routerLink]="['/ssoma/gestion/paso/actividad', a.id]" title="Ver detalle">
            <i class="ti ti-eye"></i>
          </a>
          <button type="button" class="row-btn row-btn--del" (click)="onEliminar(a)" title="Eliminar">
            <i class="ti ti-trash"></i>
          </button>
        </div>

      </div>
    </div>
  </div>

  <div *ngIf="groups.length === 0" class="tree-empty">
    <i class="ti ti-clipboard-list"></i>
    <p>No hay actividades{{ filtroEstado ? ' con este filtro' : ' en este ámbito' }}</p>
  </div>

</div>

<app-ejecucion-modal
  *ngIf="actividadEjecutando"
  [actividad]="actividadEjecutando"
  (closed)="actividadEjecutando = null"
  (ejecucionCreada)="onEjecucionCreada($event)">
</app-ejecucion-modal>
