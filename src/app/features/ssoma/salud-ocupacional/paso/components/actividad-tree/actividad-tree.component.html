<div class="tree-wrap">

  <div *ngFor="let grupo of groups">

    <!-- Cabecera colapsable de categoría -->
    <div class="cat-header" (click)="toggleGroup(grupo.id)">
      <div class="cat-icon" [ngClass]="'cat-icon--' + ambitoClass()">
        <i class="ti ti-tag"></i>
      </div>
      <span class="cat-name">{{ grupo.nombre }}</span>
      <span class="cat-count">{{ grupo.actividades.length }}</span>
      <i class="ti ti-chevron-right cat-chevron" [class.open]="!isCollapsed(grupo.id)"></i>
    </div>

    <!-- Lista de actividades -->
    <div *ngIf="!isCollapsed(grupo.id)" class="activities">
      <div *ngFor="let a of grupo.actividades"
        class="act-card"
        [ngClass]="'act-card--' + ambitoClass()">

        <div class="act-top">
          <!-- Izquierda: info -->
          <div class="act-info">
            <div class="act-name-row">
              <span class="act-name">{{ a.nombre }}</span>
              <span class="freq-badge" [ngClass]="frecuenciaClass(a.frecuencia)">{{ a.frecuencia }}</span>
            </div>
            <div *ngIf="a.responsableNombre" class="act-responsable">
              <span class="avatar-chip">{{ avatarInitials(a.responsableNombre) }}</span>
              {{ a.responsableNombre }}
            </div>
          </div>

          <!-- Derecha: progreso + SPI + mes actual -->
          <div class="act-right">
            <app-spi-badge [spi]="spiActividad(a)" size="sm"></app-spi-badge>
            <div class="act-progress-text">{{ ejecutadas(a) }}/{{ a.cantidadPlanificada }} ejecuciones</div>
            <div class="progress-bar">
              <div class="progress-bar__fill" [ngClass]="'progress-bar__fill--' + ambitoClass()" [style.width.%]="progreso(a)"></div>
            </div>
            <span class="mes-actual" [ngClass]="'mes-actual--' + ejecucionMesActual(a).estado">
              <i class="ti ti-calendar-event" style="font-size:.65rem"></i>
              {{ ejecucionMesActual(a).label }}
            </span>
          </div>
        </div>

        <!-- Botones de acción -->
        <div class="act-actions">
          <button type="button" class="act-btn act-btn--registrar" (click)="abrirEjecucion(a)">
            <i class="ti ti-plus"></i> Registrar
          </button>
          <a class="act-btn act-btn--ver" [routerLink]="['/ssoma/gestion/paso/actividad', a.id]">
            <i class="ti ti-eye"></i> Ver detalle
          </a>
          <button type="button" class="act-btn act-btn--icon-only" (click)="onEditar(a)" title="Editar">
            <i class="ti ti-edit"></i>
          </button>
          <button type="button" class="act-btn act-btn--icon-only act-btn--danger" (click)="onEliminar(a)" title="Eliminar">
            <i class="ti ti-trash"></i>
          </button>
        </div>

      </div>
    </div>
  </div>

  <div *ngIf="groups.length === 0" class="tree-empty">
    <i class="ti ti-clipboard-list"></i>
    <p>No hay actividades en este ámbito</p>
  </div>

</div>

<app-ejecucion-modal
  *ngIf="actividadEjecutando"
  [actividad]="actividadEjecutando"
  (closed)="actividadEjecutando = null"
  (ejecucionCreada)="onEjecucionCreada($event)">
</app-ejecucion-modal>
