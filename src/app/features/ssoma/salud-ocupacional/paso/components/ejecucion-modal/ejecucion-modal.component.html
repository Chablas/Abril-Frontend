<app-base-modal title="Registrar Ejecución" width="w-full max-w-lg" (closed)="close()">
  <div class="space-y-4 mt-2">

    <!-- Actividad info -->
    <div class="bg-blue-50 border border-blue-100 rounded-lg px-3 py-2 text-sm">
      <span class="font-semibold text-blue-800">{{ actividad.nombre }}</span>
      <span class="text-blue-600 ml-2">· {{ actividad.frecuencia }}</span>
    </div>

    <!-- Fecha ejecutada -->
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1">Fecha ejecutada <span class="text-red-500">*</span></label>
      <input type="date" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400"
        [(ngModel)]="form.fechaEjecutada" />
    </div>

    <!-- Participantes -->
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1">N° de participantes</label>
      <input type="number" min="0" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400"
        placeholder="0" [(ngModel)]="form.participantesCount" />
    </div>

    <!-- Observaciones -->
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1">Observaciones</label>
      <textarea rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400 resize-none"
        placeholder="Detalles de la ejecución..." [(ngModel)]="form.observaciones"></textarea>
    </div>

    <!-- Evidencia drag & drop -->
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1">Evidencia</label>
      <div class="border-2 border-dashed rounded-lg p-4 text-center cursor-pointer transition-colors"
        [class.border-blue-400]="isDragOver"
        [class.bg-blue-50]="isDragOver"
        [class.border-gray-200]="!isDragOver"
        (dragover)="onDragOver($event)" (dragleave)="onDragLeave()" (drop)="onDrop($event)"
        (click)="fileInput.click()">
        <input #fileInput type="file" class="hidden" (change)="onFileSelect($event)" />
        <ng-container *ngIf="!evidenciaFile">
          <i class="ti ti-cloud-upload text-2xl text-gray-400 mb-1 block"></i>
          <p class="text-xs text-gray-500">Arrastra un archivo o haz clic para seleccionar</p>
        </ng-container>
        <ng-container *ngIf="evidenciaFile">
          <div class="flex items-center justify-center gap-2">
            <i class="ti ti-file text-blue-500"></i>
            <span class="text-sm text-gray-700 font-medium">{{ evidenciaFile.name }}</span>
            <button type="button" class="text-red-400 hover:text-red-600 ml-1" (click)="$event.stopPropagation(); removeFile()">
              <i class="ti ti-x"></i>
            </button>
          </div>
        </ng-container>
      </div>
    </div>

    <!-- Upload progress -->
    <div *ngIf="uploadProgress" class="flex items-center gap-2 text-sm text-blue-600">
      <i class="ti ti-loader-2 animate-spin"></i>
      <span>Subiendo evidencia...</span>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-2 pt-2 border-t border-gray-100">
      <button type="button" (click)="close()"
        class="px-4 py-2 text-sm border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50">
        Cancelar
      </button>
      <button type="button" [disabled]="!canSave || saving" (click)="guardar()"
        class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
        <i class="ti" [ngClass]="saving ? 'ti-loader-2 animate-spin' : 'ti-device-floppy'"></i>
        {{ saving ? 'Guardando...' : 'Registrar' }}
      </button>
    </div>
  </div>
</app-base-modal>
