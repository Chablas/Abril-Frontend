<app-abril-page-header
  badge="SSOMA · Materiales"
  titulo="Datos Base del Proyecto"
  subtitulo="Te lleva directo a la ficha de tu proyecto — ahí están Datos Base, Cronograma, Personal, Vigilancia, Servicios, Ratios y más"
  [tabs]="headerTabs">
</app-abril-page-header>

<div class="page-root">
  <div class="page-body">
    <div *ngIf="cargando" class="empty-cell">
      <i class="ti ti-loader-2 spin" style="font-size:32px;color:#94a3b8"></i>
      <p style="margin-top:10px;">Buscando tu proyecto...</p>
    </div>

    <div *ngIf="!cargando" class="picker-card">
      <i class="ti ti-building" style="font-size:40px;color:#94a3b8"></i>
      <p>No encontramos una obra vinculada a tu usuario. Elige un proyecto para entrar a su ficha.</p>
      <app-search-select
        [options]="proyectos"
        valueField="projectId"
        displayField="projectDescription"
        [value]="proyectoElegidoId"
        [showLabel]="false"
        placeholder="Buscar proyecto..."
        (valueChange)="irAFicha($event)">
      </app-search-select>
    </div>
  </div>
</div>
