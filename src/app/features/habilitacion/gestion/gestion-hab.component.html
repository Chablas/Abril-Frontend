<div class="gestion-shell">

  <!-- ══ HEADER (mismo patrón que ssoma-page-header) ══════════ -->
  <header class="gestion-hero">

    <div class="gestion-hero__left">
      <span class="gestion-hero__badge">SSOMA · 2026</span>
      <div class="gestion-hero__vline"></div>
      <div class="gestion-hero__title-wrap">
        <h1 class="gestion-hero__title">GESTIÓN DE INGRESOS</h1>
        <p class="gestion-hero__sub">Habilitación · Seguridad · Salud Ocupacional</p>
      </div>
    </div>

    <div class="gestion-hero__center">
      <span class="gestion-hero__pill">
        <svg class="pill-icon" viewBox="0 0 16 16" fill="none"><rect x="2" y="4" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M5 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="1.4"/></svg>
        <strong>{{ empresasTotal }}</strong> empresas activas
      </span>
      <span class="gestion-hero__pill">
        <svg class="pill-icon" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 14c0-3.038 2.462-5.5 5.5-5.5s5.5 2.462 5.5 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <strong>{{ workersTotal }}</strong> workers
      </span>
      <span class="gestion-hero__pill" [class.gestion-hero__pill--warn]="entregablesVencidos > 0">
        <svg class="pill-icon" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4"/><path d="M8 5v3.5l2 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <strong>{{ entregablesVencidos }}</strong> vencidos
      </span>
    </div>

    <div class="gestion-hero__right">
      <button
        type="button"
        class="gestion-hero__btn gestion-hero__btn--ghost"
        [class.gestion-hero__btn--spinning]="refreshing"
        [disabled]="refreshing"
        (click)="onRefresh()"
      >
        <svg class="btn-icon" viewBox="0 0 20 20" fill="none">
          <path d="M4 10a6 6 0 0 1 6-6 6 6 0 0 1 4.243 1.757L16 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M16 4v4h-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 10a6 6 0 0 1-6 6 6 6 0 0 1-4.243-1.757L4 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M4 16v-4h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Actualizar
      </button>
    </div>

  </header>

  <!-- ══ TABS ══════════════════════════════════════════════════ -->
  <nav class="gestion-tabs">
    @for (tab of tabs; track tab.path) {
      <a
        class="gestion-tab"
        [routerLink]="tab.path"
        routerLinkActive="gestion-tab--active"
      >{{ tab.label }}</a>
    }
  </nav>

  <!-- ══ CONTENIDO ═════════════════════════════════════════════ -->
  <div class="gestion-content">
    <router-outlet />
  </div>

</div>
