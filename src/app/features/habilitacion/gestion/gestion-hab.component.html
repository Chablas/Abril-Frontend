<app-abril-page-header
  badge="HABILITACIÓN"
  titulo="Gestión de Ingresos"
  subtitulo="Habilitación · Seguridad · Salud Ocupacional"
  [pills]="[
    { icono: 'ti-building', texto: empresasTotal + ' empresas activas' },
    { icono: 'ti-users',    texto: workersTotal + ' workers' },
    { icono: 'ti-clock',    texto: entregablesVencidos + ' vencidos', warn: entregablesVencidos > 0 }
  ]"
  [botonSecundario]="{ label: 'Actualizar', icono: 'ti-refresh' }"
  (secondaryClick)="onRefresh()">
</app-abril-page-header>

<div class="gestion-shell">

  <!-- ══ TABS ══════════════════════════════════════════════════ -->
  <nav class="gestion-tabs">
    @for (tab of tabs; track tab.path) {
      <a
        class="gestion-tab"
        [routerLink]="tab.path"
        routerLinkActive="gestion-tab--active"
      >{{ tab.label }}</a>
    }
  </nav>

  <!-- ══ CONTENIDO ═════════════════════════════════════════════ -->
  <div class="gestion-content">
    <router-outlet />
  </div>

</div>
