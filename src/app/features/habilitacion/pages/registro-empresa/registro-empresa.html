<div class="registro-page">
  <div class="registro-card">
    <div class="registro-header">
      <img src="/images/abril-logo-verde-letra-blanca.png" alt="Abril" class="registro-logo" />
      <h2>Registro de Empresa Contratista</h2>
      <p>Completa el formulario. Un administrador activará tu acceso.</p>
    </div>

    <div class="grid-2">
      <div>
        <label class="field-label">RUC</label>
        <input
          type="text"
          class="field-input"
          [(ngModel)]="model.ruc"
          placeholder="11 dígitos"
          maxlength="11"
        />
        <span class="error-line" *ngIf="rucInvalido">El RUC debe tener 11 dígitos.</span>
      </div>
      <div>
        <label class="field-label">Razón Social *</label>
        <input type="text" class="field-input" [(ngModel)]="model.razonSocial" />
      </div>

      <div>
        <label class="field-label">Nombre Comercial</label>
        <input type="text" class="field-input" [(ngModel)]="model.nombreComercial" />
      </div>
      <div>
        <label class="field-label">Rubro / Actividad</label>
        <input type="text" class="field-input" [(ngModel)]="model.rubro" />
      </div>

      <div class="col-span-2">
        <label class="field-label">Dirección</label>
        <input type="text" class="field-input" [(ngModel)]="model.direccion" />
      </div>

      <div>
        <label class="field-label">Email Gerente</label>
        <input type="email" class="field-input" [(ngModel)]="model.emailGerente" />
      </div>
      <div>
        <label class="field-label">Email Administrador *</label>
        <input type="email" class="field-input" [(ngModel)]="model.emailAdmin" />
      </div>

      <div class="col-span-2">
        <label class="field-label">Email SSOMA</label>
        <input type="email" class="field-input" [(ngModel)]="model.emailSsoma" />
      </div>

      <div>
        <label class="field-label">Contraseña *</label>
        <input
          type="password"
          class="field-input"
          [(ngModel)]="model.password"
          minlength="6"
          placeholder="Mínimo 6 caracteres"
        />
      </div>
      <div>
        <label class="field-label">Confirmar contraseña *</label>
        <input
          type="password"
          class="field-input"
          [(ngModel)]="passwordConfirm"
        />
        <span class="error-line" *ngIf="passwordMismatch">Las contraseñas no coinciden.</span>
      </div>
    </div>

    <div class="registro-footer">
      <button
        type="button"
        class="btn-primary"
        [disabled]="!canSubmit"
        (click)="submit()"
      >
        {{ saving ? 'Registrando…' : 'Registrar Empresa' }}
      </button>
      <a routerLink="/auth/login" class="btn-link">Ya tengo cuenta — Ingresar</a>
    </div>
  </div>
</div>
