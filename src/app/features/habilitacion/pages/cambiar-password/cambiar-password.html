<div class="card cp-card">
  <div class="cp-header">
    <h2>Cambiar contraseña</h2>
    <p>Define una nueva contraseña para tu cuenta de contratista.</p>
  </div>

  <form (ngSubmit)="submit()" class="cp-form">
    <div class="field">
      <label class="field-label">Contraseña actual *</label>
      <input
        class="field-input"
        type="password"
        [(ngModel)]="passwordActual"
        name="passwordActual"
        autocomplete="current-password"
      />
    </div>

    <div class="field">
      <label class="field-label">Nueva contraseña *</label>
      <input
        class="field-input"
        type="password"
        [(ngModel)]="passwordNuevo"
        name="passwordNuevo"
        autocomplete="new-password"
        placeholder="Mínimo 8 caracteres"
      />
      <app-password-strength [password]="passwordNuevo" />
      <ul class="reglas">
        <li [class.ok]="passwordNuevo.length >= 8">8 caracteres mínimo</li>
        <li [class.ok]="passwordNuevo.length > 0 && passwordNuevo.match('[A-Z]')">1 mayúscula</li>
        <li [class.ok]="passwordNuevo.length > 0 && passwordNuevo.match('[0-9]')">1 número</li>
      </ul>
    </div>

    <div class="field">
      <label class="field-label">Confirmar nueva contraseña *</label>
      <input
        class="field-input"
        type="password"
        [(ngModel)]="passwordConfirm"
        name="passwordConfirm"
        autocomplete="new-password"
      />
      <span class="error-line" *ngIf="passwordMismatch">Las contraseñas no coinciden.</span>
    </div>

    <div class="cp-footer">
      <button type="submit" class="btn-primary" [disabled]="!canSubmit">
        {{ saving ? 'Guardando…' : 'Guardar cambios' }}
      </button>
    </div>
  </form>
</div>
