<app-base-modal *ngIf="open" title="Historial de versiones" width="w-[760px]" (closeModal)="close()">
  <div class="form-wrapper">
    <div *ngIf="loading" class="loading-text">Cargando…</div>

    <div *ngIf="!loading" class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>Versión</th>
            <th>Fecha</th>
            <th>Subido por</th>
            <th>Estado al subir</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="versiones.length === 0">
            <td colspan="5" class="empty-row">Sin versiones registradas.</td>
          </tr>
          <tr *ngFor="let v of versiones">
            <td>v{{ v.version }}</td>
            <td>{{ v.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
            <td>{{ v.subidoPorEmpresaId ? 'Empresa #' + v.subidoPorEmpresaId : v.subidoPorUserId ? 'Usuario #' + v.subidoPorUserId : '—' }}</td>
            <td>{{ v.estadoAlSubir ?? '—' }}</td>
            <td class="row-actions">
              <a class="btn-link" [href]="getViewUrl(v.archivoUrl)" target="_blank" rel="noopener">
                Ver
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <footer class="form-footer">
      <button type="button" class="btn-ghost" (click)="close()">Cerrar</button>
    </footer>
  </div>
</app-base-modal>
