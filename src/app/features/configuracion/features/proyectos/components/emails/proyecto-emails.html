<app-base-modal *ngIf="open" [title]="'Emails SSOMA'" width="w-full sm:w-[640px]" (closeModal)="close()">

  <div class="flex flex-col gap-[14px] mt-2">

    <p class="text-[12px] text-gray-500">
      Proyecto: <span class="font-semibold text-gray-800">{{ projectDescription }}</span>
    </p>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-[16px] gap-y-[8px]">

      <!-- Residente y coordinador administrativo se eligen de la lista de trabajadores:
           su correo sale de la ficha, así no queda una copia acá que se desactualice. -->
      <div class="flex flex-col">
        <app-search-select
          label="Residente"
          [options]="residentes"
          valueField="workerId"
          displayField="nombreCompleto"
          [value]="model.residenteWorkersId ?? null"
          placeholder="Buscar por nombre o DNI..."
          (valueChange)="model.residenteWorkersId = $event">
        </app-search-select>
        <p class="text-[11px] mt-[4px] leading-tight"
          [ngClass]="residenteEmail ? 'text-gray-400' : 'text-amber-600'">
          {{ residenteEmail ?? 'Sin residente: nadie recibe el aviso por ese rol.' }}
        </p>
      </div>

      <div class="flex flex-col">
        <app-search-select
          label="Coordinador administrativo"
          [options]="residentes"
          valueField="workerId"
          displayField="nombreCompleto"
          [value]="model.workersCoordAdminId ?? null"
          placeholder="Buscar por nombre o DNI..."
          (valueChange)="model.workersCoordAdminId = $event">
        </app-search-select>
        <p class="text-[11px] mt-[4px] leading-tight"
          [ngClass]="coordAdminEmail ? 'text-gray-400' : 'text-amber-600'">
          {{ coordAdminEmail ?? 'Sin coordinador: nadie recibe el aviso por ese rol.' }}
        </p>
      </div>

      <div class="abril-field">
        <label class="abril-field-label">Email Responsable</label>
        <input type="email" class="abril-field-input" [(ngModel)]="model.emailResponsable" />
      </div>

      <div class="abril-field">
        <label class="abril-field-label">Email RR.HH.</label>
        <input type="email" class="abril-field-input" [(ngModel)]="model.emailRrhh" />
      </div>

      <div class="abril-field sm:col-span-2">
        <label class="abril-field-label">Email Coord. SSOMA</label>
        <input type="email" class="abril-field-input" [(ngModel)]="model.emailCoordSsoma" />
      </div>

    </div>

    <div class="flex justify-end gap-[8px] mt-2 pt-3 border-t border-gray-100">
      <button type="button" (click)="close()"
        class="h-[36px] px-[16px] text-[13px] text-gray-600 font-semibold cursor-pointer hover:text-gray-800">
        Cancelar
      </button>
      <button type="button" (click)="submit()" [disabled]="saving"
        class="h-[36px] px-[20px] text-[13px] bg-abril-lime text-white font-semibold rounded-[7px] cursor-pointer transition-opacity hover:opacity-90 disabled:opacity-50">
        {{ saving ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>

  </div>

</app-base-modal>
