<!-- Sección embebida en Area: el header, el botón de crear y el disparador de filtros
     viven en el contenedor. -->
<div class="abril-table-wrap">
  <table class="abril-table abril-table--th-center">
    <thead class="sticky top-0 z-10">
      <tr>
        <th>Área</th>
        <th>Tipo de área</th>
        <th class="text-center w-[140px]">Estado</th>
        <th class="text-center w-[200px]">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of paged.data"
          class="border-b hover:bg-gray-50"
          style="border-color:var(--color-abril-border)">

        <!-- Los nombres del catálogo ya vienen capitalizados: nada de titleCase acá, que
             convertiría "SSOMA" en "Ssoma". -->
        <td class="text-gray-700" [title]="item.areaItemName">{{ item.areaItemName }}</td>

        <td class="text-gray-700">
          <span *ngIf="item.areaTypeName"
                class="text-[11px] px-[8px] py-[2px] rounded-full font-medium whitespace-nowrap"
                style="background:var(--color-abril-standard-light); color:var(--color-abril-standard)">
            {{ item.areaTypeName }}
          </span>
          <span *ngIf="!item.areaTypeName" class="text-gray-400 italic">Sin tipo</span>
        </td>

        <td class="text-center">
          <app-status-badge
            [text]="item.active ? 'ACTIVO' : 'INACTIVO'"
            [bgColor]="item.active ? '#D7FAF4' : '#FAD5D4'"
            [textColor]="item.active ? '#009C87' : '#D30000'" />
        </td>

        <td class="text-center">
          <div class="flex items-center justify-center gap-2">
            <button (click)="openEdit(item, $event)" abrilBulkAction="default">Editar</button>
            <button (click)="delete(item.areaItemId, $event)" abrilBulkAction="danger">Eliminar</button>
          </div>
        </td>
      </tr>

      <tr *ngIf="!paged.data.length">
        <td colspan="4" class="text-center py-[40px] text-gray-400 text-sm">
          {{ filtrosActivos > 0 ? 'Sin resultados.' : 'No hay áreas registradas.' }}
        </td>
      </tr>
    </tbody>
  </table>
</div>

<app-area-item-edit
  *ngIf="showEditModal"
  [dto]="editDto"
  (closeModal)="onEditClosed()"
  (saved)="onEditSaved()"
></app-area-item-edit>

<!-- ── Modal de filtros estándar ────────────────────────────────────── -->
<app-filter-modal *ngIf="filtrosAbiertos" (closeModal)="filtrosAbiertos = false" (clear)="limpiarFiltros()">

  <div class="w-full">
    <app-search-input
      placeholder="Buscar por nombre de área..."
      [(value)]="searchText"
      (valueChange)="onSearchChange()"
      width="100%"
    ></app-search-input>
  </div>

  <div class="w-full">
    <app-search-select
      label="Tipo de área"
      [options]="areaTypes"
      valueField="areaTypeId"
      displayField="areaTypeName"
      [value]="filterTypeId"
      (valueChange)="filterTypeId = $event; onFilterChange()"
      placeholder="Todos los tipos"
    ></app-search-select>
  </div>

  <div class="w-full">
    <app-search-select
      label="Estado"
      [options]="activeOptions"
      [value]="filterActive"
      (valueChange)="filterActive = $event; onFilterChange()"
      placeholder="Todos"
    ></app-search-select>
  </div>
</app-filter-modal>
