<div class="w-full rounded-lg overflow-auto border border-[#D6DEE5] bg-white">
  <table class="w-full">
    <thead class="bg-[#E5F7D1]">
      <tr class="text-[#64BC04]">
        <th class="text-left px-[16px] py-[10px] font-semibold w-[80px]"></th>
        <th class="text-left px-[16px] py-[10px] font-semibold">Rama</th>
        <th class="text-left px-[16px] py-[10px] font-semibold w-[140px]">Trabajadores</th>
        <th class="text-left px-[16px] py-[10px] font-semibold w-[140px]">Area_Scope_Id</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of rows"
          class="border-b border-[#D6DEE5] hover:bg-gray-50 cursor-pointer"
          title="Ver trabajadores de esta área"
          (click)="openWorkers(row)">
        <td class="px-[16px] py-[8px]">
          <div class="flex items-center gap-2">
            <button class="cursor-pointer" title="Eliminar" (click)="delete(row); $event.stopPropagation()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 21C6.45 21 5.97933 20.8043 5.588 20.413C5.19667 20.0217 5.00067 19.5507 5 19V6H4V4H9V3H15V4H20V6H19V19C19 19.55 18.8043 20.021 18.413 20.413C18.0217 20.805 17.5507 21.0007 17 21H7ZM17 6H7V19H17V6ZM9 17H11V8H9V17ZM13 17H15V8H13V17Z" fill="#D30000" />
              </svg>
            </button>
            <button class="cursor-pointer" title="Editar nodo padre del último nodo de la rama"
              (click)="openEditParent(row); $event.stopPropagation()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 17.25V21H6.75L17.81 9.94L14.06 6.19L3 17.25ZM20.71 7.04C21.1 6.65 21.1 6.02 20.71 5.63L18.37 3.29C17.98 2.9 17.35 2.9 16.96 3.29L15.13 5.12L18.88 8.87L20.71 7.04Z" fill="#64BC04" />
              </svg>
            </button>
          </div>
        </td>
        <td class="px-[16px] py-[8px] text-gray-700">
          <span *ngFor="let seg of row.segments; let i = index; let last = last">
            <span class="inline-flex items-center gap-1.5">
              <span>{{ seg.name }}</span>
              <span class="text-[0.6rem] bg-gray-100 text-gray-500 border border-gray-200 rounded px-1 py-0.5 whitespace-nowrap">
                {{ seg.areaTypeName }}
              </span>
            </span>
            <span *ngIf="!last" class="text-gray-400 mx-2">&rsaquo;</span>
          </span>
        </td>
        <td class="px-[16px] py-[8px]">
          <span class="inline-flex items-center gap-1.5 text-[0.72rem] font-semibold rounded-full px-2 py-0.5 border"
                [ngClass]="row.workersCount > 0
                  ? 'bg-green-100 text-green-800 border-green-200'
                  : 'bg-gray-50 text-gray-400 border-gray-200'">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 10-4-4 4 4 0 004 4zm6-4a3 3 0 11-3-3" />
            </svg>
            {{ row.workersCount }}
          </span>
        </td>
        <td class="px-[16px] py-[8px] text-gray-500 text-sm">{{ row.leafScopeId }}</td>
      </tr>
      <tr *ngIf="rows.length === 0">
        <td colspan="4" class="text-center py-8 text-gray-400 text-sm">
          Sin relaciones. Crea una con el botón superior.
        </td>
      </tr>
    </tbody>
  </table>
</div>

<app-area-scope-branch
  *ngIf="showBranchModal"
  (closeModal)="showBranchModal = false"
  (saved)="onBranchSaved()" />

<app-area-scope-workers
  *ngIf="workersRow"
  [areaScopeId]="workersRow.leafScopeId"
  [areaNombre]="workersRow.leafName"
  [rutaRama]="rutaRama(workersRow)"
  (closeModal)="workersRow = null" />

<app-area-scope-edit-parent
  *ngIf="editParentRow"
  [areaScopeId]="editParentRow.leafScopeId"
  [areaNombre]="editParentRow.leafName"
  [rutaRama]="rutaRama(editParentRow)"
  [tree]="tree"
  (closeModal)="editParentRow = null"
  (saved)="onParentSaved()" />
