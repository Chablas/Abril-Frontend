<!-- Sección embebida en Area: el header, el botón de crear y el disparador de filtros
     viven en el contenedor. -->
<div class="abril-table-wrap">
  <table class="abril-table abril-table--th-center">
    <thead class="sticky top-0 z-10">
      <tr>
        <th>Rama</th>
        <th class="text-center w-[150px]">Trabajadores</th>
        <th class="text-center w-[130px]">Area_Scope_Id</th>
        <th class="text-center w-[260px]">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <!-- La fila abre los trabajadores del área. Los botones cortan la propagación para
           no abrirlos al usarlos. -->
      <tr *ngFor="let row of pagedRows"
          class="border-b hover:bg-gray-50 cursor-pointer"
          style="border-color:var(--color-abril-border)"
          title="Ver trabajadores de esta área"
          (click)="openWorkers(row)">

        <td class="text-gray-700">
          <span *ngFor="let seg of row.segments; let last = last">
            <span class="inline-flex items-center gap-1.5">
              <span>{{ seg.name }}</span>
              <span class="text-[10px] px-[7px] py-[1px] rounded-full font-medium whitespace-nowrap"
                    style="background:var(--color-abril-standard-light); color:var(--color-abril-standard)">
                {{ seg.areaTypeName }}
              </span>
            </span>
            <span *ngIf="!last" class="text-gray-400 mx-2">&rsaquo;</span>
          </span>
        </td>

        <td class="text-center">
          <span *ngIf="row.workersCount > 0"
                class="text-[11px] px-[10px] py-[3px] rounded-full bg-[#D7FAF4] text-[#009C87] font-medium whitespace-nowrap">
            {{ row.workersCount }} trabajador(es)
          </span>
          <span *ngIf="row.workersCount === 0" class="text-gray-300">—</span>
        </td>

        <td class="text-center text-gray-500">{{ row.leafScopeId }}</td>

        <td class="text-center" (click)="$event.stopPropagation()">
          <div class="flex items-center justify-center gap-2">
            <button (click)="openWorkers(row)" abrilBulkAction="default">Ver</button>
            <button (click)="openEditParent(row)" abrilBulkAction="default"
                    title="Editar nodo padre del último nodo de la rama">
              Editar padre
            </button>
            <button (click)="delete(row)" abrilBulkAction="danger">Eliminar</button>
          </div>
        </td>
      </tr>

      <tr *ngIf="filteredRows.length === 0">
        <td colspan="4" class="text-center py-[40px] text-gray-400 text-sm">
          {{ filtrosActivos > 0 ? 'Sin resultados.' : 'Sin relaciones.' }}
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="shrink-0 max-w-[440px]">
  <app-paginator
    [totalRecords]="filteredRows.length"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (pageChange)="changePage($event)"
  ></app-paginator>
</div>

<app-area-scope-branch
  *ngIf="showBranchModal"
  (closeModal)="showBranchModal = false"
  (saved)="onBranchSaved()" />

<app-area-scope-workers
  *ngIf="workersRow"
  [areaScopeId]="workersRow.leafScopeId"
  [areaNombre]="workersRow.leafName"
  [rutaRama]="rutaRama(workersRow)"
  (closeModal)="workersRow = null" />

<app-area-scope-edit-parent
  *ngIf="editParentRow"
  [areaScopeId]="editParentRow.leafScopeId"
  [areaNombre]="editParentRow.leafName"
  [rutaRama]="rutaRama(editParentRow)"
  [tree]="tree"
  (closeModal)="editParentRow = null"
  (saved)="onParentSaved()" />

<!-- ── Modal de filtros estándar ────────────────────────────────────── -->
<app-filter-modal *ngIf="filtrosAbiertos" (closeModal)="filtrosAbiertos = false" (clear)="limpiarFiltros()">

  <div class="w-full">
    <app-search-input
      placeholder="Buscar por área de la rama..."
      [(value)]="searchText"
      (valueChange)="onFilterChange()"
      width="100%"
    ></app-search-input>
  </div>

  <div class="w-full">
    <app-search-select
      label="Trabajadores"
      [options]="usoFilterOptions"
      valueField="value"
      displayField="label"
      [value]="usoFilter"
      (valueChange)="usoFilter = $event; onFilterChange()"
    ></app-search-select>
  </div>
</app-filter-modal>
