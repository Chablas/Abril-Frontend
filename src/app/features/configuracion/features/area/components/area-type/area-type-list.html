<!-- Sección embebida en Area: el header y el botón de crear viven en el contenedor. -->
<div class="abril-table-wrap">
  <table class="abril-table abril-table--th-center">
    <thead class="sticky top-0 z-10">
      <tr>
        <th>Tipo de área</th>
        <th class="text-center w-[140px]">Estado</th>
        <th class="text-center w-[200px]">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of paged.data"
          class="border-b hover:bg-gray-50"
          style="border-color:var(--color-abril-border)">

        <!-- Los nombres del catálogo ya vienen capitalizados: nada de titleCase acá. -->
        <td class="text-gray-700" [title]="item.areaTypeName">{{ item.areaTypeName }}</td>

        <td class="text-center">
          <app-status-badge
            [text]="item.active ? 'ACTIVO' : 'INACTIVO'"
            [bgColor]="item.active ? '#D7FAF4' : '#FAD5D4'"
            [textColor]="item.active ? '#009C87' : '#D30000'" />
        </td>

        <td class="text-center">
          <div class="flex items-center justify-center gap-2">
            <button (click)="openEdit(item, $event)" abrilBulkAction="default">Editar</button>
            <button (click)="delete(item.areaTypeId, $event)" abrilBulkAction="danger">Eliminar</button>
          </div>
        </td>
      </tr>

      <tr *ngIf="!paged.data.length">
        <td colspan="3" class="text-center py-[40px] text-gray-400 text-sm">
          {{ filtrosActivos > 0 ? 'Sin resultados.' : 'No hay tipos de área registrados.' }}
        </td>
      </tr>
    </tbody>
  </table>
</div>

<app-area-type-edit
  *ngIf="showEditModal"
  [dto]="editDto"
  (closeModal)="onEditClosed()"
  (saved)="onEditSaved()"
></app-area-type-edit>

<!-- Modal de filtros estándar -->
<app-filter-modal *ngIf="filtrosAbiertos" (closeModal)="filtrosAbiertos = false" (clear)="limpiarFiltros()">

  <div class="w-full">
    <app-search-input
      placeholder="Buscar por tipo de área..."
      [(value)]="searchText"
      (valueChange)="onSearchChange()"
      width="100%"
    ></app-search-input>
  </div>

  <div class="w-full">
    <app-search-select
      label="Estado"
      [options]="activeOptions"
      [value]="filterActive"
      (valueChange)="filterActive = $event; onFilterChange()"
      placeholder="Todos"
    ></app-search-select>
  </div>
</app-filter-modal>
