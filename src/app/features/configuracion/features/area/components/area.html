<app-abril-page-header
  badge="CONFIGURACIÓN"
  titulo="Áreas"
  subtitulo="Gestión de áreas, jerarquías y tipos de área."
  [tabs]="tabs"
  [botonPrimario]="botonPrimario"
  (primaryClick)="onCreate()">

  <!-- Botón "Filtros" estándar: se proyecta a la altura de las pestañas y delega en el
       modal de filtros de la sección activa. -->
  <app-filter-trigger tabsExtra [count]="filtrosActivos" (open)="onOpenFilters()" />
</app-abril-page-header>

<div class="page-container flex flex-col gap-[10px] bg-white flex-1 min-h-0 overflow-hidden">

  <!-- Tabs de sección -->
  <app-section-tabs
    class="shrink-0"
    [tabs]="sectionTabs"
    [value]="activeSection"
    color="var(--color-abril-standard)"
    (valueChange)="onSectionChange($event)">
  </app-section-tabs>

  <!-- SECCIÓN: Áreas (vocabulario plano) -->
  <div *ngIf="activeSection === 'items'" class="flex flex-col gap-[10px] flex-1 min-h-0 overflow-hidden">
    <app-area-item-list (pagedData)="onItemPaged($event)"></app-area-item-list>

    <div class="shrink-0 max-w-[440px]">
      <app-paginator
        [totalRecords]="itemTotalRecords"
        [currentPage]="itemPage"
        [totalPages]="itemTotalPages"
        (pageChange)="changeItemPage($event)"
      ></app-paginator>
    </div>
  </div>

  <!-- SECCIÓN: Estructura jerárquica (area_scope) -->
  <div *ngIf="activeSection === 'scope'" class="flex flex-col gap-[10px] flex-1 min-h-0 overflow-hidden">
    <app-area-scope-list></app-area-scope-list>
  </div>

  <!-- SECCIÓN: Tipos de Área -->
  <div *ngIf="activeSection === 'types'" class="flex flex-col gap-[10px] flex-1 min-h-0 overflow-hidden">
    <app-area-type-list
      (pagedData)="onTypePaged($event)"
      (changed)="onTypesChanged()"
    ></app-area-type-list>

    <div class="shrink-0 max-w-[440px]">
      <app-paginator
        [totalRecords]="typeTotalRecords"
        [currentPage]="typePage"
        [totalPages]="typeTotalPages"
        (pageChange)="changeTypePage($event)"
      ></app-paginator>
    </div>
  </div>
</div>

<app-area-type-create
  *ngIf="showCreateTypeModal"
  (closeModal)="showCreateTypeModal = false"
  (saved)="onTypeCreated()"
></app-area-type-create>

<app-area-item-create
  *ngIf="showCreateItemModal"
  (closeModal)="showCreateItemModal = false"
  (saved)="onItemCreated()"
></app-area-item-create>
