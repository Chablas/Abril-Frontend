<div class="bg-white rounded-lg p-[20px] flex flex-col gap-6">
  <!-- SECCIÓN 1: Áreas (items) -->
  <div>
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-[#64BC04] text-lg font-semibold">Áreas</h2>
      <button
        (click)="openCreateItem($event)"
        class="bg-[#E5F7D1] py-[5px] px-[20px] rounded-lg border border-[#64BC04] text-[#64BC04] cursor-pointer"
      >
        <div class="flex items-center gap-[10px]">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M10 0C4.48615 0 0 4.48615 0 10C0 15.5138 4.48615 20 10 20C15.5138 20 20 15.5138 20 10C20 4.48615 15.5138 0 10 0ZM10 1.53846C14.6823 1.53846 18.4615 5.31769 18.4615 10C18.4615 14.6823 14.6823 18.4615 10 18.4615C5.31769 18.4615 1.53846 14.6823 1.53846 10C1.53846 5.31769 5.31769 1.53846 10 1.53846ZM9.23077 5.38462V9.23077H5.38462V10.7692H9.23077V14.6154H10.7692V10.7692H14.6154V9.23077H10.7692V5.38462H9.23077Z"
              fill="#64BC04"
            />
          </svg>
          <p>Nueva área</p>
        </div>
      </button>
    </div>

    <app-area-item-list (pagedData)="onItemPaged($event)"></app-area-item-list>

    <app-paginator
      [totalRecords]="itemTotalRecords"
      [currentPage]="itemPage"
      [totalPages]="itemTotalPages"
      (pageChange)="changeItemPage($event)"
    ></app-paginator>
  </div>

  <hr class="border-[#D6DEE5]" />

  <!-- SECCIÓN 2: Tipos de Área -->
  <div>
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-[#64BC04] text-lg font-semibold">Tipos de área</h2>
      <button
        (click)="openCreateType($event)"
        class="bg-[#E5F7D1] py-[5px] px-[20px] rounded-lg border border-[#64BC04] text-[#64BC04] cursor-pointer"
      >
        <div class="flex items-center gap-[10px]">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M10 0C4.48615 0 0 4.48615 0 10C0 15.5138 4.48615 20 10 20C15.5138 20 20 15.5138 20 10C20 4.48615 15.5138 0 10 0ZM10 1.53846C14.6823 1.53846 18.4615 5.31769 18.4615 10C18.4615 14.6823 14.6823 18.4615 10 18.4615C5.31769 18.4615 1.53846 14.6823 1.53846 10C1.53846 5.31769 5.31769 1.53846 10 1.53846ZM9.23077 5.38462V9.23077H5.38462V10.7692H9.23077V14.6154H10.7692V10.7692H14.6154V9.23077H10.7692V5.38462H9.23077Z"
              fill="#64BC04"
            />
          </svg>
          <p>Nuevo tipo</p>
        </div>
      </button>
    </div>

    <app-area-type-list
      (pagedData)="onTypePaged($event)"
      (changed)="onTypesChanged()"
    ></app-area-type-list>

    <app-paginator
      [totalRecords]="typeTotalRecords"
      [currentPage]="typePage"
      [totalPages]="typeTotalPages"
      (pageChange)="changeTypePage($event)"
    ></app-paginator>
  </div>
</div>

<app-area-type-create
  *ngIf="showCreateTypeModal"
  (closeModal)="showCreateTypeModal = false"
  (saved)="onTypeCreated()"
></app-area-type-create>

<app-area-item-create
  *ngIf="showCreateItemModal"
  (closeModal)="showCreateItemModal = false"
  (saved)="onItemCreated()"
></app-area-item-create>
