<app-base-modal [title]="'TRABAJADORES DEL PUESTO'" width="w-[660px]" (closeModal)="closeModal.emit()">

  <div class="flex flex-col gap-[12px] mt-[10px]">

    <!-- Puesto y categoría del registro clickeado: el título del modal es genérico. -->
    <div class="flex flex-wrap items-center gap-[8px]">
      <span class="text-[15px] font-semibold text-gray-800">{{ puesto.nombre | titleCase }}</span>
      <span *ngIf="puesto.categoriaNombre"
            class="text-[11px] px-[10px] py-[3px] rounded-full bg-[#EAF6FF] text-[#0B6BA8] font-medium whitespace-nowrap">
        {{ puesto.categoriaNombre | titleCase }}
      </span>
      <span *ngIf="!puesto.categoriaNombre" class="text-[11px] text-gray-400 italic">Sin categoría</span>
    </div>

    <div *ngIf="trabajadores.length > 0" class="w-full">
      <app-search-input
        placeholder="Buscar por nombre o correo..."
        [(value)]="searchText"
        (valueChange)="onSearchChange()"
        width="100%">
      </app-search-input>
    </div>

    <div class="abril-table-wrap max-h-[46vh]">
      <table class="abril-table abril-table--th-center">
        <thead class="sticky top-0 z-10">
          <tr>
            <th>Trabajador</th>
            <th class="w-[260px]">Correo corporativo</th>
          </tr>
        </thead>
        <tbody>

          <tr *ngIf="filteredTrabajadores.length === 0">
            <td colspan="2" class="text-center py-[40px] text-gray-400 text-sm">
              <ng-container *ngIf="!cargado">Cargando...</ng-container>
              <ng-container *ngIf="cargado && trabajadores.length > 0">Sin resultados.</ng-container>
              <ng-container *ngIf="cargado && trabajadores.length === 0">
                Ningún trabajador tiene este puesto asignado.
              </ng-container>
            </td>
          </tr>

          <tr *ngFor="let t of pagedTrabajadores"
              class="border-b hover:bg-gray-50"
              style="border-color:var(--color-abril-border)">

            <td class="text-gray-700">{{ t.nombreCompleto | titleCase }}</td>

            <td class="text-gray-700">
              <span *ngIf="t.emailCorporativo">{{ t.emailCorporativo }}</span>
              <span *ngIf="!t.emailCorporativo" class="text-gray-400 italic">Sin correo</span>
            </td>

          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="totalPages > 1" class="max-w-[440px]">
      <app-paginator
        [totalRecords]="filteredTrabajadores.length"
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        (pageChange)="changePage($event)">
      </app-paginator>
    </div>

  </div>

</app-base-modal>
