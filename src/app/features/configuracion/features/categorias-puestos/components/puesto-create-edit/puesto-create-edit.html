<app-base-modal [title]="titulo" width="w-[480px]" (closeModal)="closeModal.emit()">

  <div class="flex flex-col gap-[16px] mt-[10px]">

    <div class="abril-field">
      <label class="abril-field-label">Nombre</label>
      <input
        type="text"
        class="abril-field-input"
        [(ngModel)]="nombre"
        (keydown.enter)="save()"
        placeholder="Ej. Maestro de obra" />
    </div>
    <p *ngIf="submitted && !nombre.trim()" class="text-xs text-red-500 -mt-[10px]">Campo requerido</p>

    <app-search-select
      label="Categoría"
      [options]="categorias"
      valueField="id"
      displayField="nombre"
      [value]="categoriaId"
      (valueChange)="categoriaId = $event"
      placeholder="Selecciona categoría">
    </app-search-select>
    <p *ngIf="submitted && categoriaId === null" class="text-xs text-red-500 -mt-[10px]">Campo requerido</p>

    <!-- Áreas: opcional a propósito. Los puestos de obra no pertenecen a ninguna, y las áreas
         solo deciden en qué desplegable de Solicitud de Personal aparece el puesto. -->
    <app-multi-search-select
      label="Áreas"
      [options]="areaOptions"
      valueField="areaScopeId"
      displayField="ruta"
      [value]="areaScopeIds"
      (valueChange)="areaScopeIds = $event"
      placeholder="Sin área">
    </app-multi-search-select>

    <div class="flex justify-center mt-[4px]">
      <button
        (click)="save()"
        class="w-[160px] py-[8px] rounded-[10px] cursor-pointer transition-colors"
        style="background:var(--color-abril-standard)">
        <p class="text-white text-base font-medium text-center">Guardar</p>
      </button>
    </div>

  </div>

</app-base-modal>
