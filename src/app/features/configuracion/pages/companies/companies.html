<app-abril-page-header
  badge="CONFIGURACIÓN"
  titulo="Razones Sociales"
  subtitulo="Empresas del grupo Abril."
  [tabs]="[
    { label: 'Proyectos', icono: 'ti-folder', route: '/configuracion/proyectos' },
    { label: 'Áreas', icono: 'ti-layout', route: '/configuracion/area' },
    { label: 'Razones Sociales', icono: 'ti-building', route: '/configuracion/companies' },
    { label: 'Trabajadores', icono: 'ti-users', route: '/configuracion/workers' },
    { label: 'Feriados y Días no Laborables', icono: 'ti-calendar', route: '/configuracion/feriados' }
  ]"
  [botonPrimario]="{ label: 'Nueva razón social', icono: 'ti-plus' }"
  (primaryClick)="openCreateModal()">
</app-abril-page-header>

<section class="p-6 space-y-4 flex-1 min-h-0">

  <div class="filters-card">
    <div class="filters-grid">
      <div class="filter-search">
        <label class="filter-label">Buscar</label>
        <div class="search-input">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.3-4.3" />
          </svg>
          <input
            type="text"
            placeholder="Razón social, RUC, dirección o partida"
            [ngModel]="filters.search"
            (ngModelChange)="onSearchChange($event)"
          />
        </div>
      </div>

      <div>
        <label class="filter-label">Estado</label>
        <select class="field-input" [(ngModel)]="filters.estado" (change)="onFilterChange()">
          <option value="">Todos</option>
          <option value="activo">Activos</option>
          <option value="inactivo">Inactivos</option>
        </select>
      </div>
    </div>

    <div *ngIf="hasActiveFilters" class="pt-2">
      <button type="button" class="btn-link" (click)="clearFilters()">Limpiar filtros</button>
    </div>
  </div>

  <div class="card">
    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>Razón Social</th>
            <th>RUC</th>
            <th>Partida Registral</th>
            <th>Tipo Actividad</th>
            <th>Dirección</th>
            <th>Estado</th>
            <th class="text-right">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of pageItems">
            <td class="font-semibold text-gray-800">{{ item.nombre }}</td>
            <td class="text-gray-600">{{ item.ruc || '—' }}</td>
            <td class="text-gray-600">{{ item.partidaRegistral || '—' }}</td>
            <td class="text-gray-600">{{ item.tipoActividad || '—' }}</td>
            <td class="text-gray-600">{{ item.direccion || '—' }}</td>
            <td>
              <span class="badge border" [ngClass]="(item.activo ?? true) ? 'chip-green' : 'chip-gray'">
                {{ (item.activo ?? true) ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td class="text-right">
              <div class="row-actions">
                <button type="button" class="btn-chip chip-blue" (click)="openEditModal(item)">
                  Editar
                </button>
              </div>
            </td>
          </tr>
          <tr *ngIf="!loading && pageItems.length === 0">
            <td colspan="7" class="empty-row">Sin razones sociales registradas.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="totalRecords > 0" class="paginator-wrapper">
      <app-paginator
        [totalRecords]="totalRecords"
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        (pageChange)="onPageChange($event)"
      ></app-paginator>
    </div>
  </div>
</section>

<app-company-edit-form
  *ngIf="editModalOpen"
  [open]="editModalOpen"
  [company]="editCompany"
  (closed)="closeEditModal()"
  (saved)="onEditSaved()"
></app-company-edit-form>

<app-company-create-form
  *ngIf="createModalOpen"
  (closed)="closeCreateModal()"
  (saved)="onCreated()"
></app-company-create-form>
