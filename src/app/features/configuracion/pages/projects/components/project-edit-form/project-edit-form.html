<app-base-modal *ngIf="open" title="Editar proyecto" width="w-[860px]" (closeModal)="close()">
  <div class="form-wrapper">
    <h4 class="section-title">Datos generales</h4>
    <div class="grid-2">
      <div class="col-span-2">
        <label class="field-label">Nombre *</label>
        <input type="text" class="field-input" [(ngModel)]="model.projectDescription" />
      </div>
      <div>
        <label class="field-label">Código</label>
        <input type="text" class="field-input" [(ngModel)]="model.projectCode" />
      </div>
      <div>
        <label class="field-label">Empresa</label>
        <app-search-select
          [options]="empresas"
          valueField="id"
          displayField="nombre"
          [value]="model.companyId"
          [showLabel]="false"
          placeholder="Sin asignar"
          (valueChange)="model.companyId = $event"
        ></app-search-select>
      </div>
      <div>
        <label class="field-label">Estado</label>
        <app-search-select
          [options]="estadoOptions"
          valueField="id"
          displayField="nombre"
          [value]="model.estado"
          [showLabel]="false"
          placeholder="Selecciona"
          (valueChange)="model.estado = $event"
        ></app-search-select>
      </div>
      <div>
        <label class="field-label">Responsable</label>
        <input type="text" class="field-input" [(ngModel)]="model.responsable" />
      </div>
      <div>
        <label class="field-label">Fecha Inicio</label>
        <input type="date" class="field-input" [(ngModel)]="model.fechaInicio" />
      </div>
      <div>
        <label class="field-label">Fecha Fin</label>
        <input type="date" class="field-input" [(ngModel)]="model.fechaFin" />
      </div>
      <div>
        <label class="field-label">Área (m²)</label>
        <input type="number" min="0" step="0.01" class="field-input" [(ngModel)]="model.areaM2" />
      </div>
      <div>
        <label class="field-label">Activo</label>
        <select class="field-input" [(ngModel)]="model.active">
          <option [ngValue]="true">Sí</option>
          <option [ngValue]="false">No</option>
        </select>
      </div>
    </div>

    <h4 class="section-title mt-6">Emails SSOMA</h4>
    <div class="grid-2">
      <div>
        <label class="field-label">Email Residente</label>
        <input type="email" class="field-input" [(ngModel)]="model.emailResidente" />
      </div>
      <div>
        <label class="field-label">Email Responsable</label>
        <input type="email" class="field-input" [(ngModel)]="model.emailResponsable" />
      </div>
      <div>
        <label class="field-label">Email RRHH</label>
        <input type="email" class="field-input" [(ngModel)]="model.emailRrhh" />
      </div>
      <div>
        <label class="field-label">Email Coord. SSOMA</label>
        <input type="email" class="field-input" [(ngModel)]="model.emailCoordSsoma" />
      </div>
      <div class="col-span-2">
        <label class="field-label">Email Coord. Admin</label>
        <input type="email" class="field-input" [(ngModel)]="model.emailCoordAdmin" />
      </div>
    </div>

    <footer class="form-footer">
      <button type="button" class="btn-ghost" (click)="close()">Cancelar</button>
      <button type="button" class="btn-primary" [disabled]="!canSubmit" (click)="submit()">
        {{ saving ? 'Guardando…' : 'Guardar cambios' }}
      </button>
    </footer>
  </div>
</app-base-modal>
