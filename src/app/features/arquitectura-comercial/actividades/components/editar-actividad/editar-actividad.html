<app-base-modal *ngIf="open" title="Editar Actividad" width="w-[660px]" (closeModal)="close()">
  <div class="form-wrapper">
    <div class="grid-2">

      <div class="col-span-2">
        <label class="field-label">Nombre *</label>
        <input type="text" class="field-input" [(ngModel)]="model.nombre" placeholder="Nombre de la actividad" />
      </div>

      <div>
        <label class="field-label">Tipo</label>
        <select class="field-input" [(ngModel)]="model.tipo">
          <option value="">— sin tipo —</option>
          <option *ngFor="let t of tipoOpciones" [value]="t">{{ t }}</option>
        </select>
      </div>

      <div>
        <label class="field-label">Etapa</label>
        <select class="field-input" [(ngModel)]="model.etapaId" [disabled]="loadingEtapas">
          <option [ngValue]="null">{{ loadingEtapas ? 'Cargando…' : 'Sin etapa' }}</option>
          <option *ngFor="let e of etapas; trackBy: trackByEtapa" [ngValue]="e.id">{{ e.nombre }}</option>
        </select>
      </div>

      <div class="col-span-2">
        <label class="field-label">Responsable</label>
        <select class="field-input" [(ngModel)]="model.userId">
          <option [ngValue]="null">— sin responsable —</option>
          <option *ngFor="let s of supervisores; trackBy: trackBySupervisor" [ngValue]="s.id">
            {{ s.apellidoNombre }}
          </option>
        </select>
      </div>

      <div>
        <label class="field-label">Inicio programado</label>
        <input type="date" class="field-input" [(ngModel)]="model.inicioProgramado" />
      </div>

      <div>
        <label class="field-label">Fin programado</label>
        <input type="date" class="field-input" [(ngModel)]="model.finProgramado" />
      </div>

      <div>
        <label class="field-label">Inicio efectivo</label>
        <input type="date" class="field-input" [(ngModel)]="model.inicioEfectivo" />
      </div>

      <div>
        <label class="field-label">Fin efectivo</label>
        <input type="date" class="field-input" [(ngModel)]="model.finEfectivo" />
      </div>

      <div class="col-span-2">
        <label class="field-label">Observaciones</label>
        <textarea class="field-input" rows="3" [(ngModel)]="model.observaciones" placeholder="—"></textarea>
      </div>

    </div>

    <footer class="form-footer">
      <button type="button" class="btn-ghost" (click)="close()">Cancelar</button>
      <button type="button" class="btn-primary" [disabled]="!canSubmit" (click)="submit()">
        {{ saving ? 'Guardando…' : 'Guardar cambios' }}
      </button>
    </footer>
  </div>
</app-base-modal>
