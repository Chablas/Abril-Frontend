<div class="flex flex-col flex-1 p-8 gap-6 bg-white">

  <!-- Título de página con flecha para volver al inicio -->
  <div class="flex items-start gap-3">
    <button
      type="button"
      (click)="volverAlInicio()"
      class="shrink-0 mt-0.5 flex items-center justify-center w-9 h-9 rounded-full border border-gray-200 text-gray-600 cursor-pointer transition-colors hover:bg-gray-50 hover:text-[#0F6E56] hover:border-[#0F6E56]"
      title="Volver al inicio"
      aria-label="Volver al inicio"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <div class="flex flex-col gap-1">
      <h1 class="m-0 text-2xl font-bold" style="color:#0F6E56">Centro de Aprendizaje y Guías</h1>
      <p class="m-0 text-sm text-gray-500">
        Videos y guías paso a paso, organizados por módulo. Aprende a usar cada parte de la
        intranet a tu propio ritmo.
      </p>
    </div>
  </div>

  <!-- Contenido: mismo componente que la columna derecha del inicio, en modo ampliado -->
  <app-learning-center
    *ngIf="categorias.length"
    class="flex-1 min-h-0"
    [categorias]="categorias"
    [showHeading]="false"
    [large]="true"
    [collapsible]="true"
  />

  <!-- Estado vacío: sin grupos visibles para el perfil del usuario -->
  <div
    *ngIf="!cargando && !categorias.length"
    class="flex flex-col items-center justify-center gap-3 flex-1 text-center text-gray-400"
  >
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <path d="M10 9l5 3-5 3z" />
    </svg>
    <p class="m-0 text-sm font-semibold">Aún no hay videos ni guías disponibles para tu perfil.</p>
  </div>

</div>
